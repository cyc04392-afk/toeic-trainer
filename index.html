<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#3B3763"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="토익"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" href="icons/icon-192.png"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script></head><body><title>동헌의 토익 트레이너</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 모바일 우선 단일 컬럼(최대 560px). 짙은 보라 바탕 위에 피치색 카드와 알약형 버튼 — 단일 다크 테마로 고정 */
:root{
  color-scheme:dark;
  --bg:#3B3763; --surface:#453F76; --surface2:#322D58; --fg:#F5F2FB; --muted:#B7B0D8; --line:#56508A;
  --accent:#F3BF91; --accent-ink:#2E2A52; --accent-soft:#5A4B64;
  --navy:#B99CF3; --navy-soft:#4C4680;
  --good:#8FD9A8; --good-soft:#3A4F5E; --warn:#F3BF91; --warn-soft:#574A5C; --bad:#F4A3A3; --bad-soft:#5C3F5C;
  --lc:#8EC5F5; --rc:#B99CF3; --white:#F7F4FC;
  --font-kr:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-num:"Poppins","Noto Sans KR",-apple-system,sans-serif;
  --radius:28px; --radius-sm:20px; --shadow:0 12px 32px rgba(18,14,46,.35),0 2px 6px rgba(18,14,46,.25);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-kr);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
p{margin:0}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;padding-inline:18px;padding-block:18px calc(96px + env(safe-area-inset-bottom,0px));min-height:100%}
.view[hidden]{display:none}
.view{display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.card{background:var(--surface2);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card.light{background:var(--surface)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:380px){.grid3{grid-template-columns:1fr 1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 20px;border-radius:999px;font-weight:700;font-size:14.5px;background:var(--surface);color:var(--fg);transition:transform .08s,filter .15s;box-shadow:0 6px 16px rgba(18,14,46,.25)}
.btn:active{transform:scale(.97)}
.btn:hover{filter:brightness(1.06)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.navy{background:var(--navy);color:var(--accent-ink)}
.btn.ink{background:var(--accent-ink);color:var(--white)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);box-shadow:none}
.btn.small{padding:8px 14px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:default;filter:none}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface);color:var(--muted)}
.chip.lc{background:color-mix(in srgb,var(--lc) 22%,transparent);color:var(--lc)}
.chip.rc{background:color-mix(in srgb,var(--rc) 22%,transparent);color:var(--rc)}
.chip.bad{background:color-mix(in srgb,var(--bad) 22%,transparent);color:var(--bad)}
.chip.warn{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.chip.good{background:color-mix(in srgb,var(--good) 22%,transparent);color:var(--good)}
.chip.accent{background:var(--accent);color:var(--accent-ink)}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.bold{font-weight:700}
.hr{height:1px;background:var(--line);margin-block:4px}

/* 헤더 */
.brand-top{font-family:var(--font-num);font-size:22px;font-weight:500;color:var(--fg);letter-spacing:.01em}
.brand{font-size:26px;font-weight:700;color:var(--accent);line-height:1.2}
.avatar-tile{width:76px;height:76px;border-radius:24px;background:var(--surface2);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex-shrink:0}
.avatar-tile .emoji{font-size:28px;line-height:1}
.avatar-tile .lbl{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}

/* 하단 탭바 */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface2);border-radius:26px 26px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20;box-shadow:0 -8px 30px rgba(18,14,46,.35)}
.tabbar .inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 10px 2px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 8px;font-size:11px;font-weight:700;color:var(--muted);border-radius:18px;transition:background .15s}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.active{color:var(--accent-ink);background:var(--accent)}

/* 홈 점수 카드 (피치) */
.score-hero{background:var(--accent);color:var(--accent-ink);border-radius:var(--radius);padding:22px 20px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start}
.score-hero .big{font-size:52px;font-weight:700;line-height:1;letter-spacing:-.02em;font-family:var(--font-num)}
.score-hero .sub{opacity:.72;font-size:13px;font-weight:600}
.score-hero .full{grid-column:1/-1}
.pillstack{background:var(--white);border-radius:999px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 8px 18px rgba(18,14,46,.18)}
.pill-item{width:52px;height:52px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;color:var(--accent-ink)}
.pill-item b{font-family:var(--font-num);font-size:14px;font-weight:700}
.pill-item small{font-size:9.5px;font-weight:700;opacity:.7;margin-top:2px;letter-spacing:.04em}
.pill-item.lc{background:var(--lc)} .pill-item.rc{background:var(--rc)} .pill-item.goal{background:#EFE9F6}
.pill-item input{width:46px;background:transparent;border:0;text-align:center;font-family:var(--font-num);font-weight:700;font-size:14px;color:var(--accent-ink);padding:0;-moz-appearance:textfield}
.pill-item input::-webkit-outer-spin-button,.pill-item input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.goalbar{height:8px;border-radius:99px;background:rgba(46,42,82,.18);overflow:hidden}
.goalbar i{display:block;height:100%;background:var(--accent-ink);border-radius:99px;transition:width .5s}
.prev{display:flex;align-items:center;gap:14px;background:var(--surface2);border-radius:var(--radius);padding:14px 18px;box-shadow:var(--shadow)}
.prev .ico{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0}
.prev .ico svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.split-row{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:start}
.peach-square{width:84px;height:84px;border-radius:26px;background:var(--accent);color:var(--accent-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:12px;box-shadow:var(--shadow)}
.peach-square .big{font-family:var(--font-num);font-size:22px;font-weight:700;line-height:1}
.partcircles{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.partcircle{display:flex;flex-direction:column;align-items:center;gap:6px;width:48px}
.partcircle .c{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-num);font-weight:700;font-size:14px;color:var(--accent-ink);box-shadow:0 6px 14px rgba(18,14,46,.3)}
.partcircle.lc .c{background:var(--lc)} .partcircle.rc .c{background:var(--rc)}
.partcircle .n{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
.partcircle .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.partcircle .dot.off{background:var(--line)}

/* 통계 타일 */
.tile{background:var(--surface2);border-radius:var(--radius-sm);padding:12px 14px;box-shadow:var(--shadow)}
.tile .v{font-size:22px;font-weight:700;line-height:1.1;font-family:var(--font-num)}
.tile .l{font-size:11.5px;color:var(--muted);margin-top:3px}

/* 리스트 아이템 */
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item .title{font-weight:700}
.item .desc{font-size:12.5px;color:var(--muted)}
.partbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:22px;background:var(--surface)}
.partbtn .pn{font-family:var(--font-num);font-weight:700;font-size:13px;min-width:44px;padding-inline:10px;height:44px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--accent-ink)}
.partbtn.lc .pn{background:var(--lc)}
.partbtn.rc .pn{background:var(--rc)}
.partbtn .grow{flex:1;min-width:0}
.partbtn .desc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.partbtn .acc{font-family:var(--font-num);font-weight:700;font-size:15px}

/* 막대 (슬라이더 느낌) */
.bar{height:10px;border-radius:99px;background:var(--surface);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px;background:var(--navy)}
.bar i.bad{background:var(--bad)} .bar i.warn{background:var(--warn)} .bar i.good{background:var(--good)}
.typerow{display:grid;grid-template-columns:1fr 60px;gap:8px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.typerow:first-child{border-top:0}
.typerow .name{font-size:13.5px;font-weight:600;min-width:0}
.typerow .meta{font-size:11.5px;color:var(--muted)}
.typerow .pct{text-align:right;font-family:var(--font-num);font-weight:700}
.typerow .bar{grid-column:1/-1}

/* 학습 세션 (전체화면) */
.quiz{position:fixed;inset:0;background:var(--bg);z-index:30;overflow:auto;padding-top:env(safe-area-inset-top,0px)}
.quiz[hidden]{display:none}
.quiz .inner{max-width:560px;margin:0 auto;padding:14px 18px calc(28px + env(safe-area-inset-bottom,0px))}
.qhead{display:flex;align-items:center;gap:12px;padding-bottom:12px}
.qhead .prog{flex:1;height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.qhead .prog i{display:block;height:100%;background:var(--accent);transition:width .3s;border-radius:99px}
.qhead .cnt{font-family:var(--font-num);font-weight:600;font-size:13px;color:var(--muted)}
.iconbtn{width:44px;height:44px;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;background:var(--surface2);box-shadow:var(--shadow)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.on{background:var(--accent);color:var(--accent-ink)}
.passage{background:var(--surface2);border-radius:var(--radius-sm);padding:16px;font-size:14.5px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:var(--shadow)}
.passage.mono{font-family:var(--font-num);font-size:13.5px}
.passage .blank{font-weight:700;color:var(--accent)}
.passage .pos{display:inline-block;font-weight:700;color:var(--accent-ink);background:var(--navy);border-radius:6px;padding:0 5px;margin:0 2px}
.audio{display:flex;align-items:center;gap:12px;background:var(--surface2);border-radius:var(--radius-sm);padding:10px 12px;box-shadow:var(--shadow)}
.audio .play{width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 6px 14px rgba(18,14,46,.3)}
.audio .play svg{width:20px;height:20px;fill:currentColor}
.audio .play.playing{background:var(--navy)}
.audio .txt{flex:1;min-width:0;font-size:13px}
.qblock{background:var(--surface2);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.qblock .qtext{font-weight:600;font-size:15.5px;line-height:1.55;margin-bottom:12px}
.qblock .qtext .n{font-family:var(--font-num);color:var(--accent);margin-right:6px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:11px 12px;border-radius:999px;border:1.5px solid transparent;background:var(--surface);line-height:1.45;font-size:14.5px;transition:border-color .15s,background .15s}
.opt .k{font-family:var(--font-num);font-weight:700;width:26px;height:26px;border-radius:50%;background:var(--surface2);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--navy)}
.opt.correct{background:var(--good);color:var(--accent-ink)}
.opt.correct .k{background:var(--accent-ink);color:var(--good)}
.opt.wrong{background:var(--bad);color:var(--accent-ink)}
.opt.wrong .k{background:var(--accent-ink);color:var(--bad)}
.opt[disabled]{cursor:default}
.opt.hiddentext .t{color:var(--muted);font-style:italic}
.opt .t{padding-top:3px}
.verdict{margin-top:12px;padding:14px;border-radius:var(--radius-sm);background:var(--surface);font-size:14px;line-height:1.6}
.verdict .vh{font-weight:700;margin-bottom:4px}
.verdict.ok .vh{color:var(--good)} .verdict.no .vh{color:var(--bad)}
.verdict .script{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13.5px;white-space:pre-wrap;color:var(--muted)}
.pwrong{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
.pwrong .meter{width:56px;height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.pwrong .meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.tgauge{margin-bottom:12px;background:var(--surface2);border-radius:var(--radius-sm);padding:10px 14px;box-shadow:var(--shadow)}
.tgauge .trow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted)}
.tgauge #ttime{font-size:15px;color:var(--fg)}
.tgauge .track{height:10px;border-radius:99px;background:var(--surface);overflow:hidden;margin-top:8px}
.tgauge .track i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .2s linear}
.tgauge.over .track i{background:var(--bad)}
.tgauge.over #ttime,.tgauge.over #tlabel{color:var(--bad)}
.tgauge.over #ttime{animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:.45}}
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:700;z-index:50;box-shadow:var(--shadow);max-width:90vw;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.lesson{background:var(--surface2);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);line-height:1.7}
.lesson h3{font-size:18px;margin-bottom:8px}
.lesson .formula{background:var(--surface);color:var(--accent);border-radius:var(--radius-sm);padding:12px 14px;font-weight:700;margin:10px 0;white-space:pre-wrap;font-size:14px}
.lesson ul{margin:6px 0 0;padding-left:18px}
.lesson li{margin:3px 0}
.lesson .ex{font-family:var(--font-num);font-size:13.5px;color:var(--muted);margin-top:6px}
.vocabcard{background:var(--accent);color:var(--accent-ink);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.vocabcard .eyebrow{color:var(--accent-ink);opacity:.65}
.vocabcard .w{font-family:var(--font-num);font-size:28px;font-weight:700}
.vocabcard .pos{font-size:12px;opacity:.7;margin-left:6px}
.vocabcard .m{font-size:16px;font-weight:700;margin-top:4px}
.vocabcard .ex{font-size:13.5px;opacity:.8;margin-top:6px;font-family:var(--font-num)}
.vocabcard .muted{color:var(--accent-ink);opacity:.6}
.seg{display:flex;background:var(--surface2);border-radius:999px;padding:4px;gap:4px;box-shadow:var(--shadow)}
.seg button{flex:1;padding:9px 6px;border-radius:999px;font-weight:700;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.result-big{font-size:44px;font-weight:700;line-height:1;font-family:var(--font-num)}
.delta{font-weight:700}.delta.up{color:var(--good)}.delta.down{color:var(--bad)}
.score-hero .delta.up,.score-hero .delta.down{color:var(--accent-ink);opacity:.8}
.ai-box{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.ai-box textarea,#guide-q{width:100%;min-height:60px;border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;background:var(--surface2);color:var(--fg);font:inherit;resize:vertical}
.ai-ans{white-space:pre-wrap;font-size:14px;line-height:1.65;margin-top:8px;background:var(--surface);border-radius:var(--radius-sm);padding:12px 14px}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--font-num);font-size:14px;fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.chart .area{fill:var(--accent);opacity:.15}
.chart .dot{fill:var(--accent);stroke:var(--bg);stroke-width:2}
.chart .goal{stroke:var(--good);stroke-dasharray:4 4;stroke-width:1.5}
.plan-week{display:grid;grid-template-columns:44px 1fr;gap:8px 10px;align-items:start;padding:9px 0;border-top:1px solid var(--line)}
.plan-week:first-child{border-top:0}
.plan-week .d{width:36px;height:36px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent);font-size:13px}
.plan-week .t{font-size:14px}
.plan-week .t small{display:block;color:var(--muted);font-size:12.5px}
.banner{background:var(--accent);color:var(--accent-ink);border-radius:var(--radius-sm);padding:14px 16px;font-weight:700;font-size:14px}
.kbd{font-family:var(--font-num);font-size:12px;background:var(--surface);padding:1px 6px;border-radius:5px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="app">
  <section id="view-home" class="view"></section>
  <section id="view-study" class="view" hidden></section>
  <section id="view-analysis" class="view" hidden></section>
  <section id="view-notes" class="view" hidden></section>
  <section id="view-guide" class="view" hidden></section>
</div>

{id:'p2-01',part:2,script:"Where did you put the quarterly report?",qs:[{type:'p2_wh',diff:1,opts:["It's on your desk.","Last Tuesday.","Yes, I did."],ans:0,exp:"Where 의문문은 장소로 답합니다. (B)는 When에 대한 답, (C)처럼 의문사 의문문에는 Yes/No로 답할 수 없습니다."}]},

{id:'p2-07',part:2,script:"Did you receive the invoice from the supplier?",qs:[{type:'p2_yn',diff:1,opts:["Yes, it arrived this morning.","The supplier is in Busan.","I'll pay by credit card."],ans:0,exp:"Did you ~? → Yes + 부연 설명. (B)는 supplier 반복, (C)는 invoice 연상(결제) 함정입니다."}]},

// ---------- Part 3 ----------
{id:'p3-01',part:3,script:[["W","Hi, this is Laura from Benton Office Supplies. I'm calling about the order you placed on Monday—the twenty ergonomic chairs. Unfortunately, the gray model is out of stock until the end of the month."],["M","Oh, that's a problem. We're moving into the new office on the fifteenth, and we need the chairs by then."],["W","I understand. We do have the same model in black, and I could have those delivered by Thursday. I can also take ten percent off the order for the inconvenience."],["M","Black would be fine. Let me confirm with my manager, and I'll call you back within the hour."]],
 qs:[{type:'p3_topic',diff:2,q:"Why is the woman calling?",opts:["To confirm a delivery address","To report that an item is unavailable","To request a payment","To schedule an installation"],ans:1,exp:"첫 대사에서 'the gray model is out of stock'이라고 했으므로 품절(unavailable)을 알리는 전화입니다."},
 {type:'p3_detail',diff:2,q:"What does the woman offer?",opts:["Free shipping","A discount","An extended warranty","A product sample"],ans:1,exp:"'take ten percent off the order' = 10% 할인(discount). 패러프레이즈에 주의하세요."},
 {type:'p3_next',diff:2,q:"What will the man most likely do next?",opts:["Visit the store","Speak with his manager","Cancel the order","Measure the office"],ans:1,exp:"마지막 대사 'Let me confirm with my manager'가 다음 행동의 근거입니다. 다음 행동 문제는 대화 끝부분에서 찾으세요."}]},
{id:'p3-02',part:3,script:[["M","Excuse me, Ms. Alvarez. I was hoping to book the large conference room for Friday morning. We're presenting the marketing plan to the regional team."],["W","Let me check... Friday morning is already reserved for the finance department's budget review. But the room is free after one o'clock."],["M","Hmm, some of the regional staff are flying back in the afternoon. Is there any other room with a projector?"],["W","Room 4B has one, and it seats twelve. It's available all day Friday. I can reserve it for you right now if you'd like."]],
 qs:[{type:'p3_topic',diff:1,q:"What does the man want to do?",opts:["Reserve a meeting room","Buy a projector","Change a flight","Join the finance department"],ans:0,exp:"'book the large conference room' = reserve a meeting room. book → reserve 패러프레이즈."},
 {type:'p3_intent',diff:4,q:"Why does the man say, \"some of the regional staff are flying back in the afternoon\"?",opts:["To explain why an afternoon time will not work","To ask for travel reimbursement","To suggest postponing the presentation","To complain about the schedule"],ans:0,exp:"여자가 '1시 이후는 비어 있다'고 하자 남자가 '오후엔 직원들이 돌아간다'고 말한 것 → 오후 시간이 안 되는 이유를 설명. 의도 문제는 앞 대사와의 연결로 풉니다."},
 {type:'p3_detail',diff:2,q:"What does the woman say about Room 4B?",opts:["It is being renovated.","It has a projector.","It seats twenty people.","It is reserved for Friday."],ans:1,exp:"'Room 4B has one' — 여기서 one은 projector를 가리킵니다. 12명 수용(twelve)이므로 (C)는 오답."}]},
{id:'p3-03',part:3,script:[["W","Good morning. I bought this coffee maker here last week, but it stopped working after two days. I'd like a refund."],["M","I'm sorry to hear that. Do you have your receipt with you?"],["W","I do, right here. I also brought the original box."],["M","Great. Since it's within thirty days, I can give you a full refund to your card. Or, if you prefer, we just received the newer model, and I could exchange it at no extra charge."],["W","Actually, the newer model sounds good. Could you show me how to set it up before I leave?"]],
 qs:[{type:'p3_topic',diff:1,q:"Where most likely are the speakers?",opts:["In a restaurant","In an appliance store","In a repair shop","At a coffee shop"],ans:1,exp:"coffee maker를 구매·환불·교환하는 상황 → 가전제품 매장(appliance store). coffee만 듣고 (D)를 고르지 않도록 주의."},
 {type:'p3_detail',diff:1,q:"What does the man ask the woman for?",opts:["Her phone number","A receipt","A credit card","A warranty card"],ans:1,exp:"'Do you have your receipt with you?' 직접 언급."},
 {type:'p3_next',diff:2,q:"What does the woman ask the man to do?",opts:["Call a technician","Deliver the product","Demonstrate a product","Give her a discount"],ans:2,exp:"'Could you show me how to set it up' = 사용법 시연(demonstrate). show how to → demonstrate 패러프레이즈."}]},
{id:'p3-04',part:3,script:[["M","Did you see the email about the leadership workshop next month? Registration closes on the twentieth."],["W","I did, but it's in Chicago, and I'm not sure the company will cover the travel costs."],["M","Actually, I asked the training department this morning. They said they'll reimburse airfare and two nights at the hotel for up to five employees per branch."],["W","Oh, that changes things. I'll fill out the registration form today, then. Do you know if we need our supervisor's approval?"],["M","Yes—there's a signature line at the bottom of the form."]],
 qs:[{type:'p3_topic',diff:1,q:"What are the speakers mainly discussing?",opts:["A job opening","A training event","A sales trip","A company merger"],ans:1,exp:"leadership workshop = training event. 대화 전체의 소재를 묻는 문제는 첫 대사에서 결정됩니다."},
 {type:'p3_detail',diff:3,q:"What did the man learn from the training department?",opts:["The workshop has been canceled.","Some expenses will be covered.","The deadline has been extended.","Only managers may attend."],ans:1,exp:"'reimburse airfare and two nights at the hotel' → 일부 비용을 회사가 부담(covered). reimburse → cover 패러프레이즈."},
 {type:'p3_detail',diff:2,q:"What does the man say the form requires?",opts:["A photo","A payment","A supervisor's signature","A hotel confirmation"],ans:2,exp:"'there's a signature line' = 상사의 서명이 필요. approval → signature 연결."}]},

{id:'p4-01',part:4,script:[["W","Attention, Greenway Market shoppers. For the next two hours, all fresh bakery items are twenty percent off. That includes breads, muffins, and our popular blueberry pies, which are baked fresh every morning. Also, don't forget that this Saturday we'll be hosting a free cooking demonstration in the deli section at eleven A.M. Chef Marco will show you how to prepare a three-course dinner in under thirty minutes. Space is limited, so please sign up at the customer service desk. Thank you for shopping at Greenway Market."]],
 qs:[{type:'p4_topic',diff:1,q:"Where is the announcement being made?",opts:["At a restaurant","At a grocery store","At a cooking school","At a bakery"],ans:1,exp:"'Market shoppers', 'deli section', 'customer service desk' → 식료품점(grocery store). bakery items는 매장의 한 코너일 뿐입니다."},
 {type:'p4_detail',diff:2,q:"What will happen on Saturday?",opts:["A new section will open.","A cooking demonstration will be held.","Prices will be reduced.","A chef will be hired."],ans:1,exp:"'this Saturday we'll be hosting a free cooking demonstration'. 할인(C)은 '지금부터 2시간' 동안입니다."},
 {type:'p4_next',diff:2,q:"What are listeners encouraged to do?",opts:["Register at a desk","Try a free sample","Fill out a survey","Visit a Web site"],ans:0,exp:"'please sign up at the customer service desk' → sign up = register. 요청 문제는 please/encourage 뒤를 들으세요."}]},
{id:'p4-02',part:4,script:[["W","Hi, Mr. Tanaka, this is Jennifer Lowe from Harbor Dental. I'm calling to remind you that you have an appointment with Dr. Kim this Thursday at ten thirty. Please arrive about fifteen minutes early, because we've updated our patient forms and you'll need to fill out a new one. Also, if you've changed insurance providers since your last visit, please bring your new insurance card. If you need to reschedule, call us at 555-0142 at least twenty-four hours in advance. Thanks, and we'll see you Thursday."]],
 qs:[{type:'p4_topic',diff:1,q:"What is the purpose of the message?",opts:["To confirm a payment","To remind the listener of an appointment","To introduce a new doctor","To announce new office hours"],ans:1,exp:"'I'm calling to remind you that you have an appointment' — 목적은 보통 I'm calling to ~ 뒤에 나옵니다."},
 {type:'p4_detail',diff:2,q:"Why should the listener arrive early?",opts:["To park the car","To complete a form","To meet a new dentist","To receive a discount"],ans:1,exp:"'you'll need to fill out a new one (form)' → fill out = complete."},
 {type:'p4_detail',diff:3,q:"What should the listener do if he needs to change the appointment?",opts:["Send an email","Visit the office","Call a day in advance","Speak with Dr. Kim"],ans:2,exp:"'call us ... at least twenty-four hours in advance' → 하루 전에 전화. 24 hours → a day 패러프레이즈."}]},
{id:'p4-03',part:4,script:[["M","Before we wrap up, I want to share some news about our customer service team. Starting next month, we'll be extending our phone support hours until nine P.M. on weekdays. As you know, many of our customers are on the West Coast, and they've told us in surveys that our current five o'clock closing time is inconvenient. To cover the extra hours, we're hiring three additional representatives, and we'll also be offering a flexible shift schedule to current staff. If you're interested in working an evening shift, please let your team leader know by Friday. I'll send out the details in an email this afternoon."]],
 qs:[{type:'p4_topic',diff:2,q:"What change is the speaker announcing?",opts:["A new office location","Longer support hours","A price increase","A new survey"],ans:1,exp:"'extending our phone support hours until nine P.M.' → 지원 시간 연장(longer hours)."},
 {type:'p4_detail',diff:3,q:"According to the speaker, why is the change being made?",opts:["To reduce costs","To respond to customer feedback","To comply with a regulation","To compete with a rival company"],ans:1,exp:"'they've told us in surveys that ... is inconvenient' → 고객 의견(feedback)에 대응하기 위해서."},
 {type:'p4_next',diff:1,q:"What will the speaker do this afternoon?",opts:["Interview candidates","Meet with team leaders","Send an email","Conduct a survey"],ans:2,exp:"마지막 문장 'I'll send out the details in an email this afternoon'."}]},

{id:'p5-03',part:5,qs:[{type:'p5_pos_n',diff:3,q:"Mr. Ortega has extensive ______ in international marketing.",opts:["experience","experienced","experiencing","experiences"],ans:0,exp:"형용사 extensive 뒤 명사 자리. '경험(경력)'의 의미일 때 experience는 불가산 명사이므로 복수형(D)은 오답."}]},
{id:'p5-04',part:5,qs:[{type:'p5_pos_n',diff:2,q:"The ______ for the position must have a valid driver's license.",opts:["apply","applicant","applicable","applied"],ans:1,exp:"The ___ for → 주어 자리의 명사. applicant(지원자). 사람 명사와 사물 명사(application) 구분도 자주 출제됩니다."}]},
{id:'p5-05',part:5,qs:[{type:'p5_pos_adj',diff:1,q:"The committee reached a ______ decision after several hours of discussion.",opts:["final","finally","finalize","finality"],ans:0,exp:"관사 a와 명사 decision 사이 → 형용사 자리. final."}]},
{id:'p5-06',part:5,qs:[{type:'p5_pos_adj',diff:1,q:"Our ______ staff are available to answer questions 24 hours a day.",opts:["help","helpful","helpfully","helped"],ans:1,exp:"소유격 Our와 명사 staff 사이 → 형용사. helpful."}]},
{id:'p5-07',part:5,qs:[{type:'p5_pos_adj',diff:3,q:"The hotel offers ______ rates to guests who stay for more than five nights.",opts:["reduce","reduced","reduction","reducing"],ans:1,exp:"명사 rates를 수식하는 자리. '할인된 요금'은 수동 의미이므로 과거분사 reduced. reducing은 '요금이 줄이는' 능동 의미라 부적절."}]},
{id:'p5-08',part:5,qs:[{type:'p5_pos_adj',diff:2,q:"Please make sure the report is ______ before sending it to the client.",opts:["accuracy","accurate","accurately","accurateness"],ans:1,exp:"be동사 뒤 주격 보어 → 형용사. accurate. 부사(C)는 보어가 될 수 없습니다."}]},
{id:'p5-09',part:5,qs:[{type:'p5_pos_adv',diff:1,q:"The new software was ______ installed on all office computers.",opts:["success","successful","successfully","succeed"],ans:2,exp:"be동사와 과거분사(was ___ installed) 사이 → 부사 자리. successfully."}]},
{id:'p5-10',part:5,qs:[{type:'p5_pos_adv',diff:2,q:"Sales figures have risen ______ since the advertising campaign began.",opts:["steady","steadiness","steadily","steadied"],ans:2,exp:"자동사 risen 뒤에서 동사를 수식 → 부사. steadily."}]},
{id:'p5-11',part:5,qs:[{type:'p5_pos_adv',diff:2,q:"The museum is ______ located near the central train station.",opts:["convenience","convenient","conveniently","conveniences"],ans:2,exp:"is ___ located: be동사와 분사 사이 → 부사. conveniently located(편리한 위치에)는 빈출 표현."}]},
{id:'p5-12',part:5,qs:[{type:'p5_pos_adv',diff:1,q:"Ms. Reyes ______ reviews every contract before it is signed.",opts:["careful","carefully","care","caring"],ans:1,exp:"주어와 동사(reviews) 사이 → 부사. carefully."}]},
{id:'p5-13',part:5,qs:[{type:'p5_tense',diff:4,q:"By the time the inspector arrives, the construction crew ______ the repairs.",opts:["will have completed","completes","is completing","had completed"],ans:0,exp:"By the time + 현재시제(arrives) → 주절은 미래완료(will have p.p.). By the time + 과거 → 과거완료(had p.p.)."}]},
{id:'p5-14',part:5,qs:[{type:'p5_tense',diff:2,q:"Every member of the sales team ______ required to attend the monthly meeting.",opts:["are","is","were","being"],ans:1,exp:"Every + 단수명사는 단수 취급 → is. 'of the sales team'은 수식어이므로 수일치에 영향 없음."}]},
{id:'p5-15',part:5,qs:[{type:'p5_tense',diff:1,q:"The company ______ its headquarters to Singapore three years ago.",opts:["moves","has moved","moved","will move"],ans:2,exp:"ago는 명확한 과거 시점 → 과거시제. 현재완료(B)는 ago와 함께 쓸 수 없습니다."}]},
{id:'p5-16',part:5,qs:[{type:'p5_tense',diff:2,q:"Since 2019, Dalton Industries ______ its production capacity by forty percent.",opts:["increases","increased","has increased","is increasing"],ans:2,exp:"Since + 과거 시점 → 현재완료(has p.p.). 시제 단서: since, for, over the past ~ → 현재완료."}]},
{id:'p5-17',part:5,qs:[{type:'p5_voice',diff:2,q:"The annual report ______ to shareholders next week.",opts:["will send","will be sent","sends","is sending"],ans:1,exp:"send의 목적어가 없고 주어(report)가 '보내지는' 대상 → 수동태. next week → 미래."}]},
{id:'p5-18',part:5,qs:[{type:'p5_voice',diff:2,q:"Applicants ______ to submit two letters of recommendation.",opts:["require","are required","requiring","have required"],ans:1,exp:"be required to V(~하도록 요구되다) 빈출 수동 표현. 지원자는 요구를 '받는' 쪽입니다."}]},
{id:'p5-19',part:5,qs:[{type:'p5_voice',diff:1,q:"The workshop ______ by Dr. Nakamura, a leading expert in data security.",opts:["conducted","was conducted","has conducted","conducting"],ans:1,exp:"by + 행위자 → 수동태. (A) conducted만으로는 문장에 동사가 없는 꼴(과거분사 수식)이 됩니다."}]},
{id:'p5-20',part:5,qs:[{type:'p5_prep',diff:2,q:"Please submit your timesheet ______ 5 P.M. on Friday.",opts:["by","until","in","at"],ans:0,exp:"by = '~까지 완료', until = '~까지 계속'. submit(제출)은 1회 완료 동작이므로 by."}]},
{id:'p5-21',part:5,qs:[{type:'p5_prep',diff:2,q:"The invoice must be paid ______ thirty days of receipt.",opts:["within","until","since","during"],ans:0,exp:"within + 기간 = '~이내에'. 'within 30 days of ~'는 빈출 표현."}]},
{id:'p5-22',part:5,qs:[{type:'p5_prep',diff:2,q:"The training materials are available ______ the company's intranet.",opts:["on","at","to","with"],ans:0,exp:"웹사이트·인트라넷 등 온라인 플랫폼 '상에서' → on. available on the Web site."}]},
{id:'p5-23',part:5,qs:[{type:'p5_prep',diff:3,q:"Ms. Lin will be out of the office ______ the end of the week.",opts:["by","until","within","among"],ans:1,exp:"'부재 상태가 주말까지 계속' → until(지속). by는 완료 기한이라 상태 지속에는 쓰지 않습니다."}]},
{id:'p5-24',part:5,qs:[{type:'p5_conj',diff:2,q:"______ the recent increase in demand, the factory will add a third shift.",opts:["Despite","Due to","Although","Even though"],ans:1,exp:"빈칸 뒤가 명사구(the recent increase) → 전치사 자리. 의미는 인과(수요 증가 때문에) → Due to. Despite는 양보라 의미상 부적절."}]},
{id:'p5-25',part:5,qs:[{type:'p5_conj',diff:2,q:"______ the weather was bad, the outdoor event attracted a large crowd.",opts:["Despite","Because","Although","In spite of"],ans:2,exp:"빈칸 뒤가 절(주어+동사) → 접속사. 의미는 양보 → Although. Despite/In spite of는 전치사."}]},
{id:'p5-26',part:5,qs:[{type:'p5_conj',diff:2,q:"The shipment will be delayed ______ the supplier receives the payment.",opts:["until","during","despite","because of"],ans:0,exp:"절(the supplier receives) 앞 → 접속사. '~할 때까지' until. during/despite/because of는 전치사."}]},
{id:'p5-27',part:5,qs:[{type:'p5_conj',diff:3,q:"Employees may work from home ______ they notify their supervisor in advance.",opts:["as long as","in order to","because of","rather than"],ans:0,exp:"절 앞 접속사 중 조건 의미(~하기만 하면) → as long as. in order to + 동사원형, because of + 명사."}]},
{id:'p5-28',part:5,qs:[{type:'p5_rel',diff:3,q:"Employees ______ work schedules change must inform the payroll office.",opts:["who","whose","which","whom"],ans:1,exp:"빈칸 뒤에 명사(work schedules)가 바로 오고 '직원들의 근무 일정' → 소유격 관계대명사 whose."}]},
{id:'p5-29',part:5,qs:[{type:'p5_rel',diff:2,q:"The report, ______ was published last week, outlines the company's five-year plan.",opts:["that","which","who","what"],ans:1,exp:"콤마 뒤(계속적 용법)에는 that을 쓸 수 없음. 선행사가 사물(report) → which."}]},
{id:'p5-30',part:5,qs:[{type:'p5_rel',diff:1,q:"Anyone ______ wishes to attend the seminar should register by Friday.",opts:["who","which","whose","whom"],ans:0,exp:"선행사 Anyone(사람) + 빈칸 뒤 동사(wishes) → 주격 관계대명사 who."}]},
{id:'p5-31',part:5,qs:[{type:'p5_pron',diff:3,q:"The managers reviewed the proposal ______ before presenting it to the board.",opts:["they","their","themselves","them"],ans:2,exp:"문장이 이미 완전(주어·동사·목적어)하므로 빈칸은 '직접'을 뜻하는 재귀대명사 강조 용법 → themselves."}]},
{id:'p5-32',part:5,qs:[{type:'p5_pron',diff:1,q:"Ms. Carter said that ______ would handle the client's complaint personally.",opts:["she","her","hers","herself"],ans:0,exp:"that절의 주어 자리 → 주격 she."}]},
{id:'p5-33',part:5,qs:[{type:'p5_vocab_v',diff:1,q:"The marketing team will ______ a survey to gather customer feedback.",opts:["conduct","achieve","remind","attend"],ans:0,exp:"conduct a survey(설문을 실시하다) — 동사+명사 연어(collocation). conduct research/an interview도 함께 외우세요."}]},
{id:'p5-34',part:5,qs:[{type:'p5_vocab_v',diff:2,q:"Please ______ the attached form and return it by Monday.",opts:["complete","compete","comply","compose"],ans:0,exp:"complete a form(양식을 작성하다). comply는 자동사(comply with), compete는 '경쟁하다'."}]},
{id:'p5-35',part:5,qs:[{type:'p5_vocab_v',diff:1,q:"The city council ______ the proposal to build a new parking garage.",opts:["approved","arrived","appeared","applied"],ans:0,exp:"approve the proposal(제안을 승인하다). arrived/appeared는 자동사라 목적어를 가질 수 없음."}]},
{id:'p5-36',part:5,qs:[{type:'p5_vocab_v',diff:2,q:"Customers can ______ their orders online at any time.",opts:["track","trade","treat","travel"],ans:0,exp:"track an order(주문을 추적하다). 배송·물류 지문의 단골 표현."}]},
{id:'p5-37',part:5,qs:[{type:'p5_vocab_n',diff:2,q:"The hotel is within walking ______ of several major attractions.",opts:["distance","length","space","area"],ans:0,exp:"within walking distance of(~에서 도보 거리 이내) 관용 표현."}]},
{id:'p5-38',part:5,qs:[{type:'p5_vocab_n',diff:3,q:"Due to a scheduling ______, the meeting has been moved to Thursday.",opts:["conflict","contract","contact","conduct"],ans:0,exp:"scheduling conflict(일정 충돌). 비슷한 철자의 명사들을 구분하는 문제."}]},
{id:'p5-39',part:5,qs:[{type:'p5_vocab_n',diff:1,q:"The store offers a full ______ on all unused items returned within 14 days.",opts:["refund","receipt","revenue","recipe"],ans:0,exp:"full refund(전액 환불). returned items와 연결."}]},
{id:'p5-40',part:5,qs:[{type:'p5_vocab_adj',diff:2,q:"The new printer is ______ with most operating systems.",opts:["compatible","comparable","competitive","considerable"],ans:0,exp:"compatible with(~와 호환되는). comparable to(~에 필적하는)와 전치사까지 구분."}]},
{id:'p5-41',part:5,qs:[{type:'p5_vocab_adj',diff:3,q:"Tickets for the concert are ______ available at the box office.",opts:["still","yet","ever","soon"],ans:0,exp:"still available(아직 구할 수 있는). yet은 주로 부정문·의문문에서 '아직'."}]},
{id:'p5-42',part:5,qs:[{type:'p5_vocab_adj',diff:3,q:"Ms. Park is ______ responsible for the company's overseas accounts.",opts:["primarily","nearly","shortly","lately"],ans:0,exp:"primarily responsible for(주로 ~을 담당하는). 부사 어휘 문제는 수식 대상(responsible)과의 어울림을 보세요."}]},
{id:'p5-43',part:5,qs:[{type:'p5_inf',diff:1,q:"The company plans ______ a new distribution center in Daejeon.",opts:["open","opening","to open","opened"],ans:2,exp:"plan은 to부정사를 목적어로 취하는 동사(plan/hope/decide/intend/expect to V)."}]},
{id:'p5-44',part:5,qs:[{type:'p5_inf',diff:2,q:"Mr. Kim is considering ______ for the regional manager position.",opts:["apply","applying","to apply","applied"],ans:1,exp:"consider는 동명사를 목적어로 취함(consider/enjoy/avoid/suggest/recommend + V-ing)."}]},
{id:'p5-45',part:5,qs:[{type:'p5_inf',diff:3,q:"______ the deadline, the team worked overtime throughout the week.",opts:["Meet","To meet","Met","Meeting"],ans:1,exp:"'기한을 맞추기 위해' 목적을 나타내는 to부정사(= In order to meet). 문두 to부정사 + 콤마는 목적 표현의 전형."}]},
{id:'p5-46',part:5,qs:[{type:'p5_comp',diff:2,q:"The new model is ______ more efficient than the previous one.",opts:["very","much","so","too"],ans:1,exp:"비교급(more efficient) 강조는 much/far/even/still/a lot. very는 원급만 수식."}]},
{id:'p5-47',part:5,qs:[{type:'p5_comp',diff:1,q:"Of all the candidates, Ms. Tanaka has the ______ experience in project management.",opts:["more","most","much","many"],ans:1,exp:"Of all ~ (셋 이상 비교) + the → 최상급 the most."}]},
{id:'p5-48',part:5,qs:[{type:'p5_tense',diff:3,q:"The board ______ the merger proposal when the quarterly results are released next month.",opts:["discussed","will discuss","has discussed","discussing"],ans:1,exp:"시간 부사절(when ~)에서는 현재시제가 미래를 대신하고, 주절은 미래시제 will discuss. 단서: next month."}]},
{id:'p5-49',part:5,qs:[{type:'p5_vocab_v',diff:3,q:"The new policy is intended to ______ employees to use public transportation.",opts:["encourage","prevent","inform","suggest"],ans:0,exp:"encourage A to V(A가 ~하도록 장려하다). prevent A from V-ing, inform A of/that, suggest V-ing — 뒤 구조가 다릅니다."}]},
{id:'p5-50',part:5,qs:[{type:'p5_pos_adv',diff:4,q:"The merger talks are ______ confidential, so please do not discuss them outside the team.",opts:["strict","stricter","strictly","strictness"],ans:2,exp:"형용사 confidential을 수식 → 부사 strictly. 'strictly confidential(극비의)' 빈출 표현."}]},

// ---------- Part 6 ----------
{id:'p6-01',part:6,passage:"To: All Staff\nFrom: Facilities Management\nSubject: Parking Lot Renovation\n\nPlease be advised that the east parking lot will be closed for repaving from May 6 to May 10. During this period, employees are asked to park in the west lot or in the public garage on Center Street. ___(1)___ We have arranged with the garage to ___(2)___ parking fees for anyone who shows a company ID badge.\n\nThe renovation is expected to be completed on schedule. ___(3)___, if weather causes a delay, we will notify you by email. We apologize for any ___(4)___ this may cause and appreciate your cooperation.",
 qs:[{type:'p6_insert',diff:3,q:"(1)",opts:["The garage is a five-minute walk from the main entrance.","The new cafeteria menu will be posted next week.","The east lot was repaved last year.","Please submit your vacation requests by Friday."],ans:0,exp:"앞 문장에서 public garage를 처음 언급했고, 뒤 문장도 the garage에 대한 추가 정보이므로 주차장 위치를 설명하는 (A)가 자연스럽게 연결됩니다."},
 {type:'p6_vocab',diff:3,q:"(2)",opts:["raise","waive","collect","estimate"],ans:1,exp:"'회사 ID를 보여주면 주차 요금을 면제(waive)해 주기로 했다'. waive a fee(수수료를 면제하다)는 빈출 어휘."},
 {type:'p6_connector',diff:2,q:"(3)",opts:["However","Therefore","For example","In addition"],ans:0,exp:"앞: 일정대로 완료될 전망 ↔ 뒤: 날씨로 지연되면 알리겠다 → 역접 However."},
 {type:'p6_gram',diff:2,q:"(4)",opts:["inconvenience","inconvenient","inconveniently","inconveniences"],ans:0,exp:"any 뒤 명사 자리. 'apologize for any inconvenience'는 관용 표현이며 이 의미의 inconvenience는 불가산."}]},
{id:'p6-02',part:6,passage:"Dear Ms. Hwang,\n\nThank you for your recent purchase of the Aria X200 wireless headphones. We are writing to inform you that your product ___(1)___ for our extended warranty program. By registering before June 30, you will receive an additional twelve months of coverage at no cost. ___(2)___\n\nTo register, simply visit our Web site and enter the serial number located on the inside of the headphone case. Should you have any questions, our support team is available ___(3)___ 9 A.M. and 6 P.M., Monday through Friday.\n\nWe ___(4)___ your business and hope you enjoy your new headphones.\n\nSincerely,\nAria Audio Customer Care",
 qs:[{type:'p6_gram',diff:3,q:"(1)",opts:["qualifies","qualified","will have qualified","qualifying"],ans:0,exp:"현재 '자격이 된다'는 사실을 알리는 문맥 → 현재시제 qualifies. 뒤 문장의 'By registering ~ you will receive'도 현재 자격이 있음을 전제합니다."},
 {type:'p6_insert',diff:4,q:"(2)",opts:["This offer applies to all products purchased in 2026.","Unfortunately, the headphones are currently out of stock.","The warranty cannot be transferred to another owner.","We have received your complaint and are reviewing it."],ans:0,exp:"앞 문장의 무료 보증 연장 '혜택(offer)'을 받아 적용 범위를 설명하는 (A)가 자연스럽습니다. (B)(D)는 문맥(구매 감사 편지)과 충돌."},
 {type:'p6_vocab',diff:1,q:"(3)",opts:["from","between","among","during"],ans:1,exp:"between A and B. and가 있으므로 from(~ to)은 불가."},
 {type:'p6_vocab',diff:2,q:"(4)",opts:["appreciate","apply","approve","approach"],ans:0,exp:"We appreciate your business(거래해 주셔서 감사합니다) — 비즈니스 서신 마무리 관용구."}]},
{id:'p6-03',part:6,passage:"NOTICE TO RESIDENTS\n\nThe building's main elevator will be out of service on Tuesday, March 4, ___(1)___ scheduled maintenance. Work is expected to begin at 9 A.M. and finish by 4 P.M. ___(2)___ this time, residents may use the service elevator at the rear of the building.\n\nWe recognize that this may be ___(3)___ for some residents, particularly those on upper floors. ___(4)___ If you need assistance moving heavy items on that day, please contact the management office at least one day in advance.\n\nThank you for your patience.\nWestgate Towers Management",
 qs:[{type:'p6_vocab',diff:2,q:"(1)",opts:["due to","in spite of","instead of","such as"],ans:0,exp:"'정기 점검 때문에' 운행 중단 → 인과의 전치사 due to."},
 {type:'p6_vocab',diff:2,q:"(2)",opts:["During","While","Despite","Until"],ans:0,exp:"this time(명사구) 앞 → 전치사. '이 시간 동안' During. While은 접속사."},
 {type:'p6_gram',diff:2,q:"(3)",opts:["inconvenience","inconvenient","inconveniently","inconveniences"],ans:1,exp:"be동사 뒤 보어 자리이며 주어가 this(상황) → 형용사 inconvenient(불편한)."},
 {type:'p6_insert',diff:3,q:"(4)",opts:["We have therefore arranged for staff to be available to help.","The elevator was installed in 2010.","Rent payments are due on the first of the month.","The lobby will be repainted next month."],ans:0,exp:"앞: 불편할 수 있음을 인정 → 뒤: 무거운 짐 옮길 때 도움을 요청하라. 그 사이에 '도울 직원을 배치했다'(A)가 들어가야 흐름이 연결됩니다."}]},

// ---------- Part 7 ----------
{id:'p7-01',part:7,passage:"RIVERSIDE FITNESS CENTER — GRAND OPENING SPECIAL\n\nJoin before March 31 and pay no enrollment fee (a $75 value). Members enjoy:\n• A fully equipped weight room and 25-meter indoor pool\n• Over 40 group classes each week, including yoga, spinning, and Pilates\n• Free parking and towel service\n• Access to all three Riverside locations\n\nMonthly membership: $45 (individual) / $70 (family)\n\nVisit us at 220 Harbor Road or call 555-0188 for a free one-day pass. Current members who refer a friend receive one month free.",
 qs:[{type:'p7_main',diff:1,q:"What is the purpose of the advertisement?",opts:["To announce new class schedules","To attract new members","To promote a sporting event","To advertise a job opening"],ans:1,exp:"'Join before March 31 and pay no enrollment fee' — 신규 회원 모집 광고."},
 {type:'p7_not',diff:2,q:"What is NOT mentioned as a benefit of membership?",opts:["Free parking","Use of a swimming pool","Personal training sessions","Access to multiple locations"],ans:2,exp:"NOT 문제는 보기 하나씩 지문과 대조해 소거합니다. 주차(C 항목), 수영장(indoor pool), 3개 지점 접근은 있지만 개인 트레이닝은 언급 없음."},
 {type:'p7_detail',diff:2,q:"How can a current member receive a free month?",opts:["By joining before March 31","By attending 40 classes","By referring a friend","By calling 555-0188"],ans:2,exp:"마지막 문장 'Current members who refer a friend receive one month free'."}]},
{id:'p7-02',part:7,passage:"From: Daniel Reyes <dreyes@nortonlogistics.com>\nTo: Sofia Marchetti <smarchetti@brightpath.com>\nDate: August 3\nSubject: Re: Proposal for warehouse software\n\nDear Ms. Marchetti,\n\nThank you for sending the proposal for the BrightPath inventory system. I shared it with our operations team on Monday, and overall the response was positive. The real-time tracking feature, in particular, would solve a problem we've struggled with for years.\n\nHowever, there are two points I'd like to discuss before we move forward. First, the proposal lists a six-week implementation period, but our busiest season begins in mid-October, so we would need the system fully running by October 1. Second, the quoted price does not seem to include staff training. Could you confirm whether training is available and, if so, at what cost?\n\nI'm available for a call any afternoon next week except Wednesday. Please let me know what works for you.\n\nBest regards,\nDaniel Reyes\nOperations Director, Norton Logistics",
 qs:[{type:'p7_main',diff:2,q:"Why did Mr. Reyes write the e-mail?",opts:["To reject a proposal","To request clarification on a proposal","To schedule a product demonstration","To complain about a delay"],ans:1,exp:"'there are two points I'd like to discuss' + 'Could you confirm ~' → 제안서에 대한 확인·설명 요청."},
 {type:'p7_detail',diff:2,q:"What does Mr. Reyes say about the real-time tracking feature?",opts:["It is too expensive.","It would address a long-standing problem.","It requires additional staff.","It is not needed."],ans:1,exp:"'would solve a problem we've struggled with for years' → 오래된 문제 해결. solve → address, for years → long-standing 패러프레이즈."},
 {type:'p7_infer',diff:3,q:"What is suggested about Norton Logistics?",opts:["It is busiest in the autumn.","It recently hired new staff.","It has used BrightPath before.","It is located near Ms. Marchetti's office."],ans:0,exp:"'our busiest season begins in mid-October' → 가을이 성수기라고 추론할 수 있습니다. 추론 문제도 반드시 지문 근거가 있어야 합니다."},
 {type:'p7_syn',diff:3,q:"The word \"running\" in paragraph 2, line 3, is closest in meaning to",opts:["moving quickly","operating","competing","flowing"],ans:1,exp:"'the system fully running' = 시스템이 완전히 가동(operating)되는. 동의어 문제는 문맥에서의 의미로 고릅니다."}]},
{id:'p7-03',part:7,passage:"Local Bakery Expands to Second Location\n\nHALSTON (May 14)—Morning Glory Bakery, a favorite among Halston residents since it opened on Elm Street in 2015, will open a second store in the Westfield Shopping Center on June 1. [1] Owner Priya Nair said the decision came after months of customer requests. \"People kept telling us they drove across town for our sourdough,\" Ms. Nair said. \"It made sense to come to them.\" [2]\n\nThe new location will be nearly twice the size of the original and will include a small café area with seating for twenty. Unlike the Elm Street store, it will also offer sandwiches and soups at lunchtime. Ms. Nair plans to hire eight additional employees, and interviews are being held this week. [3]\n\nThe Elm Street store will remain open with its current hours. [4] To celebrate the opening, both locations will offer a free pastry with any purchase on June 1.",
 qs:[{type:'p7_main',diff:1,q:"What is the article mainly about?",opts:["A bakery's new menu","The opening of a new store","A change in ownership","A local hiring event"],ans:1,exp:"제목과 첫 문장: 'will open a second store'. 세부 내용(메뉴·채용)은 부수적 정보입니다."},
 {type:'p7_detail',diff:2,q:"According to the article, how will the new store differ from the original?",opts:["It will close earlier.","It will be smaller.","It will serve lunch items.","It will not sell sourdough."],ans:2,exp:"'Unlike the Elm Street store, it will also offer sandwiches and soups at lunchtime'. 크기는 두 배(B 오답)."},
 {type:'p7_infer',diff:3,q:"What is indicated about Ms. Nair?",opts:["She recently moved to Halston.","She responded to customer demand.","She plans to close the Elm Street store.","She has owned the bakery since 2010."],ans:1,exp:"'the decision came after months of customer requests' → 고객 요청에 응답. Elm Street 매장은 계속 운영(C 오답), 개점은 2015년(D 오답)."},
 {type:'p7_insert',diff:4,q:"In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong?\n\"Applicants with café experience are especially encouraged to apply.\"",opts:["[1]","[2]","[3]","[4]"],ans:2,exp:"삽입 문장의 Applicants/apply는 채용(hire, interviews) 이야기 바로 뒤에 와야 자연스럽습니다 → [3]."}]},
{id:'p7-04',part:7,passage:"Mina Choi (10:12 A.M.)\nHi Tom, are you still at the printer's? The client just called—they want 200 brochures instead of 150.\n\nTom Baker (10:14 A.M.)\nYes, I'm here. They haven't started the job yet, so I can change the quantity. It'll push the price up by about $60, though.\n\nMina Choi (10:15 A.M.)\nThat's fine. The client approved the extra cost. Can they still have everything ready by 3?\n\nTom Baker (10:17 A.M.)\nI'll ask. If not, I'll wait and bring them straight to the client's office myself.\n\nMina Choi (10:18 A.M.)\nPerfect. Let me know either way.",
 qs:[{type:'p7_detail',diff:2,q:"Why does Ms. Choi contact Mr. Baker?",opts:["To ask him to change an order","To tell him a client has canceled","To request a price list","To confirm a meeting time"],ans:0,exp:"'they want 200 brochures instead of 150' → 수량 변경 요청."},
 {type:'p7_intent',diff:3,q:"At 10:18 A.M., what does Ms. Choi most likely mean when she writes, \"Let me know either way\"?",opts:["She wants to know whether the brochures will be ready on time.","She has not decided on the quantity.","She wants Mr. Baker to choose a printer.","She will contact the client herself."],ans:0,exp:"바로 앞 Tom의 메시지 '3시까지 되는지 물어보겠다, 안 되면 직접 가져가겠다'에 대한 답 → 어느 쪽이든(either way) 결과를 알려 달라는 뜻."}]},
{id:'p7-05',part:7,passage:"Customer Review — Lakeside Inn, Room 312\nPosted by J. Whitfield · Stayed 2 nights\n\nI chose the Lakeside Inn for a work trip because of its location—just ten minutes from the convention center—and the free airport shuttle, which ran exactly on time both ways. The room was clean and quiet, and the desk area was large enough to work comfortably.\n\nMy only complaint is the breakfast. It is advertised as \"complimentary,\" but the hot items cost extra; only coffee, toast, and fruit are actually free. Also, the Wi-Fi in my room was slow in the evenings, although it worked fine in the lobby.\n\nOverall, I would stay here again for business, but I'd recommend eating breakfast elsewhere.",
 qs:[{type:'p7_detail',diff:2,q:"Why did Mr. Whitfield choose the hotel?",opts:["Because of its low price","Because of its restaurant","Because of its location and shuttle","Because a colleague recommended it"],ans:2,exp:"첫 문단 'because of its location ... and the free airport shuttle'."},
 {type:'p7_detail',diff:3,q:"What does Mr. Whitfield say about the breakfast?",opts:["It was served too early.","Some items were not free.","It was not available on weekends.","It was better than expected."],ans:1,exp:"'the hot items cost extra; only coffee, toast, and fruit are actually free' → 일부는 유료."},
 {type:'p7_infer',diff:3,q:"What can be inferred about the hotel's Wi-Fi?",opts:["It is not available in guest rooms.","Its speed varies by location and time.","It requires an additional fee.","It was recently upgraded."],ans:1,exp:"'slow in the evenings ... worked fine in the lobby' → 장소·시간에 따라 속도가 다름을 추론."}]},
];

// ===================== 진단 테스트 세트 =====================
const DIAG_SET = ['p2-01','p2-08','p2-10','p3-01','p4-02','p5-09','p5-13','p5-24','p5-28','p6-01','p7-02'];

// ===================== 개념 강의 =====================
const LESSONS = {
  p2_wh:{title:'의문사 의문문 — 첫 단어가 답을 정한다',body:`Part 2의 40% 이상이 의문사 의문문입니다. 첫 단어(Who/When/Where/Why/How/Which/What)만 정확히 들으면 보기 셋 중 둘은 바로 지울 수 있습니다.`,formula:`Who → 사람·부서   When → 시점   Where → 장소·출처\nWhy → Because / To V   How many → 수량   How long → 기간\n의문사 의문문에 Yes/No 답 = 무조건 오답`,tips:['질문의 단어가 그대로 반복되는 보기는 90% 함정(copies ↔ copier)','Which + 명사 → "The one ~"으로 특정하는 답이 자주 정답','"I don\'t know / Let me check / Ask Ms. Kim" 같은 우회 응답도 정답이 될 수 있음'],ex:'Q: Where did you put the report?  →  A: It\'s on your desk.'},
  p2_yn:{title:'일반 의문문 — Yes/No보다 뒤가 중요',body:`Do/Did/Have/Is로 시작하는 질문은 Yes/No로 답할 수 있지만, 정답은 "Not yet", "I'll check" 같은 우회 응답인 경우가 많습니다.`,formula:`Yes/No + 부연 설명  |  Not yet  |  Actually, ~  |  I haven't had time`,tips:['Yes인데 뒤 내용이 질문과 안 맞는 보기 주의(Yes, I\'d like one.)','질문 속 동사·명사의 파생어(review → reviewed)가 들리면 의심'],ex:'Q: Have you finished the contract?  →  A: Not yet, I\'m still on page five.'},
  p2_choice:{title:'선택 의문문 — Yes/No는 절대 오답',body:`A or B? 형태는 (1) 둘 중 하나 선택, (2) 둘 다/둘 다 아님, (3) 상관없음(Either is fine)이 정답입니다.`,formula:`A or B?  →  A / B / Either / Neither / Whichever is cheaper\n"Yes" "No"로 시작하는 보기 = 오답`,tips:['선택지가 길면(order now or wait until ~) 뒤쪽 선택지 어휘(wait)가 정답에 반복되는 일이 많음','"It doesn\'t matter"도 정답 패턴'],ex:'Q: Train or drive?  →  A: The train would be faster.'},
  p2_neg:{title:'부정·부가 의문문 — 긍정 의문문처럼 처리',body:`Isn't ~? / Didn't ~? / ~, haven't you? 는 "~이지 않아?"라는 확인 질문입니다. not을 무시하고 사실 그대로 Yes(그렇다)/No(아니다)로 답하거나 우회 응답을 고릅니다.`,formula:`Isn't the printer fixed?  =  Is the printer fixed?  (not 무시)\nShouldn't we ~? / Why don't we ~?  =  제안 → 수락·거절`,tips:['우회 응답: "The technician is coming at three."(아직 안 고쳐짐)','부가 의문문은 앞 평서문 내용만 들으면 됨'],ex:'Q: You\'ve met the clients, haven\'t you?  →  A: Yes, at the trade show.'},
  p2_stmt:{title:'평서문·제안·요청 — 상황에 맞는 반응 찾기',body:`평서문은 질문이 아니므로 "반응"을 고릅니다. 문제 제기 → 해결책, 좋은 소식 → 축하, 의견 → 동의/반대. 제안·요청(Why don't we / Could you)은 수락·거절·조건이 정답입니다.`,formula:`문제 상황 → 해결책·대안   소식 → I'm glad / That's great\nCould you ~?  →  Sure / Of course / Sorry, I'm busy\nWhy don't we ~?  →  Good idea / That would help`,tips:['Why don\'t we ~?는 이유를 묻는 것이 아님 — Because로 시작하는 보기는 함정','평서문 뒤 단어 반복 보기는 대부분 오답'],ex:'S: I can\'t find the key.  →  A: Ms. Chen has a spare one.'},
  p3_topic:{title:'대화 주제·목적·장소 — 첫 두 대사에서 결정',body:`"What are the speakers discussing / Why is the woman calling / Where are they?"는 거의 항상 첫 1~2 대사에 답이 있습니다. 음원이 나오기 전에 질문을 먼저 읽고 첫 대사를 집중해서 들으세요.`,formula:`목적: I'm calling to ~ / I was hoping to ~ / I'd like to ~\n장소: 직업·사물 어휘 조합으로 추론 (receipt + refund → 매장)`,tips:['한 단어(coffee)로 장소를 고르지 말고 전체 상황(구매·환불)으로 판단','질문은 대화 순서대로 출제됨: 1번 답 = 앞부분'],ex:'"Hi, this is Laura from Benton Office Supplies. I\'m calling about the order..." → 전화 목적'},
  p3_detail:{title:'대화 세부사항 — 패러프레이즈를 잡아라',body:`세부사항 문제의 정답은 대화의 표현을 바꿔 말한(paraphrase) 보기입니다. 들린 단어 그대로인 보기는 오히려 의심하세요.`,formula:`ten percent off → a discount    reimburse → cover expenses\nshow how to set up → demonstrate    sign up → register`,tips:['질문의 키워드(offer, ask for, say about)를 미리 표시하고 해당 화자의 대사에 집중','숫자·요일은 메모 없이 보기와 바로 대조'],ex:'"I can take ten percent off" → What does the woman offer? → A discount'},
  p3_intent:{title:'화자 의도 파악 — 앞 대사와의 연결',body:`"Why does the man say, '...'?" 문제는 인용문 자체보다 바로 앞 대사(상대의 제안·질문)와 뒤 대사를 보고 '왜 그 말을 했는지'를 찾습니다.`,formula:`상대 제안 → 인용문(사정 설명) → 거절/대안 요청\n=  To explain why ~ will not work`,tips:['인용문 글자 뜻 그대로 해석한 보기(여행비 환급 요청 등)는 함정','보기는 대개 To explain / To suggest / To express concern 형태'],ex:'"Room is free after one." → "Staff are flying back in the afternoon." → 오후 불가 이유 설명'},
  p3_next:{title:'다음 행동·요청 — 대화 끝 3초',body:`"What will the man do next?" "What does the woman ask the man to do?"는 마지막 1~2 대사에 답이 있습니다. 마지막 문제라도 끝까지 집중하세요.`,formula:`Let me ~ / I'll ~ / I'm going to ~  →  다음 행동\nCould you ~? / Would you mind ~?  →  요청 사항`,tips:['"확인해 보겠다(confirm with my manager)" = speak with a manager','미래 표현이 두 개면 질문이 묻는 화자(man/woman)를 구분'],ex:'"Let me confirm with my manager" → Speak with his manager'},
  p4_topic:{title:'담화 주제·목적·장소 — 도입부 공식',body:`안내 방송·음성 메시지·연설은 시작 1~2문장에 종류와 목적이 드러납니다. "Attention, shoppers" / "This is ~ from ~ calling to ~" / "Before we wrap up"을 들으면 담화 종류를 바로 분류하세요.`,formula:`Attention, ~ shoppers/passengers → 안내 방송(매장·공항)\nThis is A from B. I'm calling to ~ → 음성 메시지 목적\nI want to share some news about ~ → 회의·발표`,tips:['매장 안내에서 특정 코너(bakery)가 들려도 장소는 전체(grocery store)','purpose 문제: to remind / to confirm / to announce 중 동사에 주목'],ex:'"Attention, Greenway Market shoppers" → At a grocery store'},
  p4_detail:{title:'담화 세부사항 — 질문 순서 = 담화 순서',body:`3문제는 담화 순서대로 출제됩니다. 1번 답을 찾았으면 바로 2번 질문의 키워드로 귀를 옮기세요.`,formula:`Why ~? → because / since / due to 뒤\nWhat should ~ do if ~? → If 절 뒤의 명령문`,tips:['24 hours → a day, fill out → complete 같은 패러프레이즈','숫자(시간·날짜)가 여러 개 나오면 질문이 묻는 것 하나만 골라 듣기'],ex:'"call us at least twenty-four hours in advance" → Call a day in advance'},
  p4_next:{title:'요청·다음 행동 — 마지막 문장을 끝까지',body:`"What are listeners asked to do?" "What will the speaker do next?"는 거의 항상 담화 마지막 1~2문장입니다.`,formula:`Please ~ / Be sure to ~ / Don't forget to ~  →  청자 요청\nI'll ~ / Now, let's ~  →  화자의 다음 행동`,tips:['sign up at the desk → register, let your team leader know → inform a supervisor','마지막 문제라고 긴장을 풀면 바로 놓침'],ex:'"please sign up at the customer service desk" → Register at a desk'},
  p5_pos_n:{title:'명사 자리 — 관사·소유격·전치사 뒤',body:`빈칸 앞에 the/a/our/any 또는 전치사가 있고 뒤에 of/for 등 전치사나 동사가 오면 명사 자리입니다. 보기에서 -tion, -ment, -ance, -ity, -ness, -er/-ee, -ing 꼴을 찾으세요.`,formula:`the ______ of  /  our ______  /  any ______  /  for ______\n가산·불가산:  experience(경력, 불가산)  information, equipment, advice`,tips:['사람 명사 vs 사물 명사: applicant / application, employer / employment','형용사 뒤(extensive ___)도 명사 자리','복수형이 보기에 있으면 가산·불가산과 수일치 확인'],ex:'The opening of the new branch will take place next spring.'},
  p5_pos_adj:{title:'형용사 자리 — 명사 앞, be동사 뒤',body:`관사/소유격과 명사 사이(a ___ decision), be·become·remain 뒤 보어 자리가 형용사입니다. 분사(-ed/-ing)도 형용사 역할을 하므로 의미(수동/능동)로 고릅니다.`,formula:`a/the/our + [형용사] + 명사\nbe / remain / seem + [형용사]\n수동 의미 → p.p. (reduced rates)   능동·진행 → -ing (a growing market)`,tips:['부사(-ly)는 보어가 될 수 없음','-ed vs -ing: 감정 동사는 사람 → -ed, 사물 → -ing (interested / interesting)'],ex:'The hotel offers reduced rates to long-stay guests.'},
  p5_pos_adv:{title:'부사 자리 — 동사·형용사·문장 수식',body:`be동사와 분사 사이(was ___ installed), 주어와 동사 사이(she ___ reviews), 자동사 뒤(risen ___), 형용사 앞(___ confidential)은 부사 자리입니다. 토익 Part 5에서 가장 쉽고 빈출인 유형이므로 틀리면 바로 복습하세요.`,formula:`be + [부사] + p.p.   주어 + [부사] + 동사   자동사 + [부사]\n[부사] + 형용사   문장 전체, [부사]`,tips:['완전한 문장에 빈칸이 남으면 부사','빈출 부사: conveniently located, strictly confidential, highly recommended'],ex:'The software was successfully installed.'},
  p5_tense:{title:'시제·수일치 — 단서 어휘로 결정',body:`시제 문제는 문장 속 시간 표현이 답을 정합니다. ago/last → 과거, since/for/over the past → 현재완료, next/tomorrow → 미래, by the time + 현재 → 미래완료.`,formula:`ago, last year, yesterday  →  과거\nsince 2019, for ten years, recently  →  현재완료\nnext week, tomorrow, soon  →  미래\nBy the time + 현재  →  will have p.p.  /  By the time + 과거  →  had p.p.\n시간·조건 부사절(when/if/once)  →  현재시제가 미래 대신`,tips:['Every/Each + 단수 → 단수동사. 주어 뒤 of ~ 수식어는 무시','현재완료 + ago 조합은 불가'],ex:'Since 2019, Dalton has increased its capacity by 40%.'},
  p5_voice:{title:'태 — 목적어가 있으면 능동, 없으면 수동',body:`빈칸 뒤에 목적어(명사)가 있으면 능동, 없고 by/to가 오거나 주어가 동작을 '받는' 쪽이면 수동(be + p.p.)입니다.`,formula:`주어 + be + p.p. (+ by 행위자)\n빈출 수동 표현: be required to V, be expected to V, be scheduled to V,\nbe located in, be dedicated to N, be committed to N`,tips:['보기에 과거분사 단독(conducted)이 있으면 문장에 동사가 있는지 확인','4형식·5형식 수동(be given a bonus, be asked to V)은 뒤에 명사가 남을 수 있음'],ex:'Applicants are required to submit two letters.'},
  p5_prep:{title:'전치사 — 시간·기간·장소 핵심 구분',body:`by(완료 기한) vs until(지속), within(이내) vs in(후에), during + 명사 vs for + 숫자 기간, on + 요일/날짜/플랫폼, at + 시각.`,formula:`submit by Friday (완료)   be away until Friday (지속)\nwithin 30 days (이내)   in two weeks (2주 후에)\nduring the meeting   for three hours\non the Web site / on Monday   at 5 P.M.`,tips:['동사와 짝: comply with, participate in, result in, contribute to','전치사 뒤에는 명사·동명사만 (절이 오면 접속사 문제)'],ex:'Please submit your timesheet by 5 P.M.'},
  p5_conj:{title:'접속사 vs 전치사 — 빈칸 뒤를 보라',body:`빈칸 뒤가 '주어+동사'(절)이면 접속사, 명사구면 전치사입니다. 의미(양보/인과/조건/시간)는 그다음에 따집니다.`,formula:`양보:  Although / Even though / While + 절   ↔   Despite / In spite of + 명사\n인과:  Because / Since / As + 절   ↔   Because of / Due to / Owing to + 명사\n시간:  While / When / Until + 절   ↔   During + 명사\n조건:  If / Unless / As long as / Provided that + 절`,tips:['접속부사(However, Therefore)는 두 절을 연결 못 함 — Part 5에서는 대부분 오답','in order to + 동사원형, rather than + 명사/동명사'],ex:'Although the weather was bad, the event attracted a crowd.'},
  p5_rel:{title:'관계사 — 선행사와 빈칸 뒤 구조',body:`선행사가 사람이면 who/whom/whose, 사물이면 which/that. 빈칸 뒤에 동사가 바로 오면 주격, 명사가 오면 소유격(whose), 주어+동사가 오면 목적격.`,formula:`사람 + [who] + 동사      사람·사물 + [whose] + 명사\n콤마(,) 뒤에는 that 불가 → which / who\n전치사 + which / whom  (in which, to whom)`,tips:['what은 선행사를 포함하므로 선행사가 있으면 오답','관계부사 where/when은 뒤가 완전한 절'],ex:'Employees whose schedules change must inform payroll.'},
  p5_pron:{title:'대명사 — 격과 재귀 강조',body:`주어 자리 → 주격, 목적어·전치사 뒤 → 목적격, 명사 앞 → 소유격, 이미 완전한 문장 → 재귀대명사(강조 용법).`,formula:`she / her / her(s) / herself\n주어=목적어 → 재귀 (introduced himself)\n완전한 문장 + [재귀] = "직접" (reviewed it themselves)`,tips:['those who ~ (~하는 사람들), one another / each other','소유대명사(hers, theirs)는 명사 없이 단독'],ex:'The managers reviewed the proposal themselves.'},
  p5_vocab_v:{title:'동사 어휘 — 목적어와의 연어(collocation)',body:`어휘 문제는 빈칸 뒤 목적어와 자주 붙는 동사를 고릅니다. 뜻이 비슷해 보여도 짝이 정해져 있습니다.`,formula:`conduct a survey / research     complete a form     approve a proposal\ntrack an order     encourage A to V     address a problem     meet a deadline\nattend a meeting     implement a policy     reach an agreement`,tips:['자동사(arrive, appear, comply)는 목적어를 가질 수 없음','뒤 구조 확인: prevent A from V-ing, inform A of, remind A to V'],ex:'The team will conduct a survey to gather feedback.'},
  p5_vocab_n:{title:'명사 어휘 — 관용 표현으로 외우기',body:`철자가 비슷한 명사(conflict/contract/contact)를 구분하는 문제가 많습니다. 앞뒤 단어와 함께 덩어리로 기억하세요.`,formula:`within walking distance of     scheduling conflict     full refund\nin advance     at no cost     on a regular basis     a wide range of`,tips:['형용사와 짝: extensive experience, valid license, prior approval','가산·불가산도 함께 확인(equipment, information은 복수 불가)'],ex:'Due to a scheduling conflict, the meeting was moved.'},
  p5_vocab_adj:{title:'형용사·부사 어휘 — 수식 대상과 전치사',body:`형용사는 뒤에 오는 전치사까지(compatible with, responsible for, eligible for), 부사는 수식하는 단어와의 어울림(primarily responsible, still available)으로 고릅니다.`,formula:`compatible with   comparable to   responsible for   eligible for   aware of\nstill available   highly recommended   currently unavailable   approximately 20`,tips:['yet은 부정·의문문에서 "아직", still은 긍정문에서 "여전히"','shortly(곧) ≠ short, lately(최근에) ≠ late'],ex:'The printer is compatible with most operating systems.'},
  p5_inf:{title:'준동사 — 동사별 목적어 형태',body:`plan/hope/decide/intend/expect/want + to V, consider/enjoy/avoid/suggest/recommend/finish + V-ing. 문두 To V, 콤마는 목적(~하기 위해).`,formula:`to V 목적어:  plan, decide, hope, intend, expect, agree, refuse\nV-ing 목적어:  consider, enjoy, avoid, suggest, recommend, finish, postpone\n목적:  To V, 주어 + 동사  (= In order to V)`,tips:['전치사 뒤에는 동명사: look forward to V-ing, be committed to V-ing','명사 + to V (ability to, effort to, plan to)'],ex:'Mr. Kim is considering applying for the position.'},
  p5_comp:{title:'비교급·최상급 — than과 the',body:`than이 있으면 비교급, the + 범위(of all, in the company)가 있으면 최상급. 비교급 강조는 much/far/even/still, 원급 강조는 very.`,formula:`[비교급] + than       the + [최상급] + of / in\nmuch / far / even + 비교급     very + 원급\nas + 원급 + as`,tips:['the more ~, the more ~ (~할수록 더 ~)','more가 보기에 있으면 than을 찾고, most가 있으면 the를 찾기'],ex:'The new model is much more efficient than the old one.'},
  p6_vocab:{title:'Part 6 문맥 어휘 — 앞뒤 문장이 근거',body:`Part 5 어휘와 달리 한 문장만 보면 여러 답이 가능합니다. 반드시 앞 문장(또는 뒤 문장)의 내용과 연결해 고르세요.`,formula:`빈칸 문장 → 앞 문장 확인 → 뒤 문장 확인 → 지문 종류(공지/편지/광고)와 어울리는지`,tips:['waive a fee, appreciate your business, due to maintenance 등 서신 관용구','전치사 문제(between A and B)는 짝(and)을 찾기'],ex:'We have arranged to waive parking fees for anyone with an ID badge.'},
  p6_connector:{title:'접속부사 — 앞뒤 관계를 판별',body:`역접(However), 결과(Therefore), 추가(In addition, Also), 예시(For example), 대안(Otherwise, Instead). 앞 문장과 뒤 문장의 논리 관계부터 정합니다.`,formula:`앞 ↔ 뒤 반대  →  However / Nevertheless\n앞 → 뒤 결과  →  Therefore / As a result\n앞 + 뒤 추가  →  In addition / Moreover / Also\n앞 조건 안 지키면  →  Otherwise`,tips:['접속부사는 문장을 연결하지 못하므로 Part 5에서 두 절 사이 빈칸이면 오답','Part 6에서는 문장 첫머리 + 콤마 형태로 등장'],ex:'The work should finish on time. However, if weather causes a delay, we will notify you.'},
  p6_insert:{title:'문장 삽입 — 지시어와 흐름',body:`삽입 문장의 지시어(this, the garage, such, these)와 대명사가 가리키는 대상이 앞 문장에 있어야 합니다. 앞 문장과 뒤 문장 사이에서 자연스러운 다리 역할을 하는지 확인하세요.`,formula:`앞 문장에 처음 언급된 명사  →  삽입 문장에서 the + 명사 / this + 명사로 재언급\n삽입 문장의 내용이 뒤 문장의 전제가 되는가?`,tips:['지문의 주제(주차장 공지)와 무관한 보기(구내식당 메뉴)는 즉시 소거','불일치 시제·분위기(감사 편지 속 불만 접수)도 소거 기준'],ex:'...park in the public garage. [The garage is a five-minute walk.] We arranged with the garage to...'},
  p6_gram:{title:'Part 6 문법 — 시제는 문맥으로',body:`Part 6의 시제·품사 문제는 빈칸 문장만으로 부족하고 지문 전체의 시점(이미 일어난 일인지, 앞으로 할 일인지)을 봐야 합니다.`,formula:`편지의 목적(inform you that ~) → 현재 사실 = 현재시제\n앞으로 할 일(will open, is scheduled) → 미래\n품사: any ___ → 명사,  be ___ → 형용사`,tips:['inconvenience(명사) / inconvenient(형용사) 구분은 매회 출제 수준','주어가 상황(this)이면 형용사 보어, any 뒤면 명사'],ex:'Your product qualifies for our extended warranty program.'},
  p7_main:{title:'주제·목적 — 제목·첫 문단·Subject',body:`이메일은 Subject와 첫 문장, 기사는 제목과 첫 문단, 광고는 가장 큰 글씨가 주제입니다. 세부 내용을 다 읽기 전에 답을 정하세요.`,formula:`I am writing to ~ / This letter is to ~ / Thank you for ~ but ~\n기사 제목 = 주제     광고 첫 줄 = 목적`,tips:['"두 가지 논의할 점이 있다 + Could you confirm" = 확인 요청','전체 지문 중 한 부분만 다루는 보기(채용 행사)는 오답'],ex:'Subject: Re: Proposal → "two points I\'d like to discuss" → To request clarification'},
  p7_detail:{title:'세부사항 — 키워드 스캔 후 패러프레이즈',body:`질문의 고유명사·숫자·키워드를 지문에서 찾고(scanning), 그 문장을 바꿔 말한 보기를 고릅니다. 단어가 똑같은 보기는 함정일 확률이 높습니다.`,formula:`질문 키워드 → 지문 위치 → 그 문장 정독 → 보기와 대조`,tips:['Unlike A, B will ~ → A와 B의 차이점 문제의 근거','숫자가 여러 개면 질문이 묻는 대상(current member?)을 정확히'],ex:'"refer a friend receive one month free" → By referring a friend'},
  p7_infer:{title:'추론 — 근거 문장은 반드시 있다',body:`suggested/indicated/inferred 문제도 상상이 아니라 지문의 한 문장을 한 단계 바꿔 말한 것입니다. 근거 없는 보기는 그럴듯해도 오답입니다.`,formula:`busiest season begins in mid-October → busiest in the autumn\ndecision came after customer requests → responded to demand`,tips:['지문 사실과 모순되는 보기(close the Elm Street store)부터 소거','"recently", "before"처럼 지문에 없는 시간 정보가 들어간 보기 주의'],ex:'"our busiest season begins in mid-October" → It is busiest in the autumn.'},
  p7_syn:{title:'동의어 — 사전 뜻이 아닌 문맥 뜻',body:`해당 단어를 빈칸으로 만들고 각 보기를 넣어 문장이 성립하는지 봅니다. 가장 흔한 뜻(running = 달리기)이 정답인 경우는 드뭅니다.`,formula:`system fully running → operating     address a problem → deal with\ncover costs → pay for     meet a deadline → satisfy`,tips:['문단·줄 번호를 이용해 정확한 위치 찾기','동사·명사 등 품사가 같은 보기만 후보'],ex:'"the system fully running by October 1" → operating'},
  p7_not:{title:'NOT 문제 — 보기 4개를 소거',body:`"NOT mentioned / NOT true" 문제는 보기 하나씩 지문에서 찾아 체크합니다. 셋이 확인되면 남은 하나가 답. 시간이 걸리므로 다른 문제를 먼저 풀어도 됩니다.`,formula:`보기 (A)(B)(C)(D) → 지문에서 각각 확인 → 못 찾는 것 = 정답`,tips:['광고·공지의 불릿 리스트는 NOT 문제의 단골 출처','패러프레이즈된 표현(indoor pool = swimming pool)을 놓치지 않기'],ex:'Personal training은 혜택 목록에 없음 → 정답'},
  p7_insert:{title:'문장 위치 — 연결어와 지시어',body:`삽입 문장의 Applicants/apply 같은 핵심어가 지문의 어느 화제(채용) 바로 뒤에 어울리는지 찾습니다. 삽입 후 앞뒤가 자연스럽게 이어져야 합니다.`,formula:`삽입 문장 핵심어 → 같은 화제의 문장 찾기 → 그 바로 뒤 [번호]`,tips:['this/these/such + 명사가 있으면 그 명사가 바로 앞에 있어야 함','문단 첫 문장 자리는 보통 오답(주제문이 먼저)'],ex:'"interviews are being held this week. [3]" ← Applicants with café experience...'},
  p7_intent:{title:'의도 파악(문자 대화) — 바로 앞 메시지',body:`"At 10:18, what does she mean when she writes '...'?"는 바로 앞 상대 메시지에 대한 반응입니다. 인용문 글자 뜻보다 대화 흐름 속 역할을 보세요.`,formula:`상대 메시지(제안·질문) → 인용문(반응) → 의미\n"Let me know either way" = 결과가 어떻든 알려 달라`,tips:['채팅은 짧은 표현(Sounds good / Not a problem)이 많아 문맥 의존도가 높음','보기 중 대화에 없는 새 정보(printer 선택)는 오답'],ex:'"I\'ll ask. If not, I\'ll bring them myself." → "Let me know either way." → 준비 여부를 알고 싶다'},
};

{id:'p2-21',part:2,script:"Who's going to replace Ms. Jenkins when she retires?",qs:[{type:'p2_wh',err:48,opts:["The decision hasn't been made yet.","She retired last March.","Yes, she's been here for twenty years."],ans:0,exp:"Who 질문에 사람 이름 대신 '아직 결정되지 않았다'는 우회 응답. 고득점자도 자주 놓치는 패턴입니다. (C) 의문사 의문문에 Yes 불가."}]},
{id:'p2-22',part:2,script:"Where can I find the sales figures for last quarter?",qs:[{type:'p2_wh',err:25,opts:["They're in the shared folder.","Sales were up five percent.","Next quarter, probably."],ans:0,exp:"Where → 위치(shared folder). (B)는 sales 반복 함정, (C)는 quarter 반복 함정."}]},
{id:'p2-23',part:2,script:"Are you going to the product launch on Thursday?",qs:[{type:'p2_yn',err:38,opts:["It launched successfully.","I haven't decided yet.","The product is very popular."],ans:1,exp:"일반 의문문에 '아직 못 정했다'는 우회 응답이 정답. (A)(C)는 launch/product 반복 함정."}]},
{id:'p2-24',part:2,script:"Is the cafeteria still open?",qs:[{type:'p2_yn',err:44,opts:["I think it closes at two.","Yes, I had the pasta.","It's open to suggestions."],ans:0,exp:"'2시에 닫는 것 같다' = 지금 시각에 따라 열려 있는지 알려 주는 우회 응답. (B)는 Yes 뒤 내용이 질문과 불일치, (C)는 open 반복 함정."}]},
{id:'p2-25',part:2,script:"Do you want the report printed in color or in black and white?",qs:[{type:'p2_choice',err:32,opts:["Yes, please print it.","Color, if it isn't too expensive.","The printer is out of paper."],ans:1,exp:"선택 의문문 → 한쪽(Color) 선택 + 조건. (A) Yes/No 응답은 선택 의문문에 오답."}]},
{id:'p2-26',part:2,script:"Didn't Mr. Lee say the budget would be approved by Monday?",qs:[{type:'p2_neg',err:55,opts:["He's going to Seoul on Monday.","It was, but we're still waiting for the funds.","No, the budget is in dollars."],ans:1,exp:"부정 의문문에 '승인은 됐지만(It was) 아직 자금을 기다린다'는 응답. (A)는 Monday 반복, (C)는 budget 반복 함정."}]},
{id:'p2-27',part:2,script:"The shipment arrived on time, didn't it?",qs:[{type:'p2_neg',err:40,opts:["Actually, it came a day late.","Yes, it's time to ship.","At the loading dock."],ans:0,exp:"부가 의문문에 'Actually, ~'로 사실을 바로잡는 응답이 정답. (B)는 time/ship 반복, (C)는 Where에 대한 답."}]},
{id:'p2-28',part:2,script:"We're running low on printer toner.",qs:[{type:'p2_stmt',err:42,opts:["I'll order some this afternoon.","The printer is very fast.","It runs on Tuesdays."],ans:0,exp:"문제 상황을 알리는 평서문 → 해결 행동(주문하겠다)이 정답. (B)(C)는 printer/run 반복 함정."}]},
{id:'p2-29',part:2,script:"Let's schedule the interviews for next week.",qs:[{type:'p2_stmt',err:35,opts:["The candidates were very interesting.","Good idea—I'll check the calendar.","It took about an hour."],ans:1,exp:"Let's ~ 제안 → 수락(Good idea) + 후속 행동. (A)(C)는 과거 시제로 아직 잡지 않은 면접과 맞지 않음."}]},
{id:'p2-30',part:2,script:"Would you mind reviewing my presentation before the meeting?",qs:[{type:'p2_stmt',err:50,opts:["Not at all. Send it over.","The meeting room is booked.","Yes, it was very informative."],ans:0,exp:"Would you mind ~?에 대한 수락은 'Not at all / Of course not'(꺼리지 않는다). Yes는 거절 의미라 (C)는 오답이며 시제도 맞지 않음."}]},

// ---------- Part 3 ----------
{id:'p3-05',part:3,script:[["W","Thanks for calling Summit Travel. How can I help you?"],["M","Hi, I booked a flight to Denver for the sales conference next month, but my manager just told me the conference dates have changed. It's now the twelfth to the fourteenth instead of the fifth to the seventh."],["W","I see. Let me pull up your reservation... I can move your flights to those dates, but the fare is about eighty dollars higher for that week."],["M","That's fine—the company will cover it. Could you also check whether the hotel can change my reservation? I booked it through you as well."],["W","Of course. I'll contact the hotel and send you a confirmation e-mail by the end of the day."]],
 qs:[{type:'p3_topic',err:20,q:"Why is the man calling?",opts:["To cancel a trip","To change travel dates","To request a refund","To book a conference room"],ans:1,exp:"'the conference dates have changed' + 'move your flights to those dates' → 여행 날짜 변경."},
 {type:'p3_detail',err:35,q:"What does the woman say about the new flights?",opts:["They are fully booked.","They cost more.","They depart earlier.","They require a layover."],ans:1,exp:"'the fare is about eighty dollars higher' → 요금이 더 비쌈(cost more)."},
 {type:'p3_next',err:30,q:"What will the woman do next?",opts:["Call a hotel","Issue a refund","Print a ticket","Speak with a manager"],ans:0,exp:"마지막 대사 'I'll contact the hotel' → contact = call."}]},
{id:'p3-06',part:3,script:[["M","Hi, Rachel. I wanted to talk to you about the schedule for next week. We're short-staffed on Saturday night because two servers requested the day off."],["W","I could take the Saturday shift, but I'm already scheduled for Friday night and Sunday brunch. That would be three days in a row."],["M","I know it's a lot to ask. If you take Saturday, I can give you Wednesday off instead, and you'd get the weekend bonus rate."],["W","In that case, I'll do it. Should I let Carlos know that he doesn't need to cover for me on Wednesday?"],["M","I'll take care of that. Thanks, Rachel."]],
 qs:[{type:'p3_topic',err:25,q:"Where do the speakers most likely work?",opts:["At a hotel","At a restaurant","At a hospital","At a retail store"],ans:1,exp:"servers(서빙 직원), Sunday brunch → 식당. 직업·장소는 어휘 조합으로 추론합니다."},
 {type:'p3_intent',err:50,q:"Why does the woman say, \"That would be three days in a row\"?",opts:["To express a concern","To confirm a schedule","To request a promotion","To decline a bonus"],ans:0,exp:"토요일 근무 요청에 '그러면 3일 연속'이라고 말한 것은 부담을 표현(concern)하는 것. 뒤에 조건(수요일 휴무)을 받고 수락한 흐름이 근거."},
 {type:'p3_detail',err:35,q:"What does the man offer the woman?",opts:["A different day off","A pay raise","Additional training","An earlier shift"],ans:0,exp:"'I can give you Wednesday off instead' → 대체 휴무일. bonus rate는 '급여 인상(raise)'이 아니라 주말 수당."}]},
{id:'p3-07',part:3,script:[["W","Hello, IT help desk. This is Dana."],["M","Hi, Dana. This is Kevin in Accounting. I can't log in to the expense system. It keeps saying my password has expired, but I changed it just two weeks ago."],["W","That's strange. Oh—I see the problem. The system was upgraded over the weekend, and everyone has to reset their password once more after the upgrade. There was an e-mail about it on Friday."],["M","I must have missed it. So how do I reset it?"],["W","Click \"Forgot password\" on the login page, and you'll get a link by e-mail. If it doesn't arrive within ten minutes, call me back and I'll reset it manually."]],
 qs:[{type:'p3_topic',err:20,q:"What problem does the man have?",opts:["He lost his ID card.","He cannot access a system.","His computer is slow.","He received a wrong invoice."],ans:1,exp:"'I can't log in to the expense system' → 시스템 접근 불가. log in → access 패러프레이즈."},
 {type:'p3_detail',err:30,q:"According to the woman, what caused the problem?",opts:["A system upgrade","A typing error","A power outage","An expired account"],ans:0,exp:"'The system was upgraded over the weekend, and everyone has to reset their password' → 업그레이드가 원인."},
 {type:'p3_next',err:35,q:"What does the woman tell the man to do?",opts:["Restart his computer","Visit the IT office","Use a link on the login page","Contact his manager"],ans:2,exp:"'Click Forgot password on the login page, and you'll get a link' → 로그인 페이지의 링크 이용. 전화는 10분 내 안 올 때의 대안."}]},
{id:'p3-08',part:3,script:[["M","Priya, did you get a chance to look at the two logo designs the agency sent for the spring campaign?"],["W","I did. I prefer the second one—the colors match our packaging better. But the font is hard to read when it's small, like on social media icons."],["M","I had the same thought. Why don't we ask them to keep the second design but try a bolder font?"],["W","Sounds good. The agency said they need final feedback by Wednesday, so could you e-mail them today? I have client meetings all afternoon."],["M","Sure, I'll do it right after lunch."]],
 qs:[{type:'p3_topic',err:20,q:"What are the speakers discussing?",opts:["A hiring decision","A logo design","A product price","A client complaint"],ans:1,exp:"첫 대사 'the two logo designs the agency sent'."},
 {type:'p3_detail',err:30,q:"What does the woman like about the second design?",opts:["Its size","Its font","Its colors","Its cost"],ans:2,exp:"'the colors match our packaging better'. 폰트(B)는 오히려 불만 사항."},
 {type:'p3_next',err:28,q:"What will the man do after lunch?",opts:["Meet with clients","Send an e-mail","Visit the agency","Redesign a logo"],ans:1,exp:"'could you e-mail them today?' → 'I'll do it right after lunch'. 고객 미팅(A)은 여자의 일정."}]},
