<script>
// ===================== 유틸 =====================
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L = ['A','B','C','D'];
const todayKey = (d = new Date()) => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pct = (c,n) => n ? Math.round(c/n*100) : null;
const fmtMin = s => s < 60 ? Math.round(s)+'초' : Math.floor(s/60)+'분 '+Math.round(s%60)+'초';
let toastTimer; function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2600); }

// ===================== 난이도 = 수험생 추정 오답률 =====================
// 유형별 평균 오답률(%) 기준값. 문항에 err가 없으면 기준값 ± 문항 난이도로 산출.
const ERR_BASE = {p2_wh:25,p2_yn:35,p2_choice:30,p2_neg:45,p2_stmt:55,p3_topic:25,p3_detail:40,p3_intent:55,p3_next:35,p4_topic:25,p4_detail:40,p4_next:35,
  p5_pos_n:25,p5_pos_adj:25,p5_pos_adv:20,p5_tense:40,p5_voice:35,p5_prep:45,p5_conj:40,p5_rel:40,p5_pron:35,p5_vocab_v:50,p5_vocab_n:50,p5_vocab_adj:55,p5_inf:35,p5_comp:35,
  p6_vocab:50,p6_connector:45,p6_insert:60,p6_gram:40,p7_main:25,p7_detail:35,p7_infer:55,p7_syn:45,p7_not:50,p7_insert:60,p7_intent:50};
const errToDiff = e => e<28?1:e<38?2:e<48?3:e<58?4:5;
const DIFF_LABEL = {1:'쉬움',2:'쉬움',3:'보통',4:'어려움',5:'어려움'};
BANK.forEach(g=>g.qs.forEach(q=>{ if(q.err==null) q.err=Math.max(10,Math.min(85,ERR_BASE[q.type]+((q.diff||3)-3)*7)); q.diff=errToDiff(q.err); }));
const groupErr = g => Math.round(g.qs.reduce((a,q)=>a+q.err,0)/g.qs.length);

// ===================== 인덱스 =====================
const QINDEX = {}, GINDEX = {};
BANK.forEach(g => { GINDEX[g.id]=g; g.sec = PART_INFO[g.part].sec; g.qs.forEach((q,i)=>{ q.id=g.id+'-'+i; q.gid=g.id; q.part=g.part; q.sec=TYPES[q.type].sec; q.idx=i; QINDEX[q.id]=q; }); });
const ALLQ = Object.values(QINDEX);

// ===================== 상태 & 저장 =====================
const LS_KEY = 'toeic-trainer-v1';
const DEFAULT = { goal:800, responses:[], bookmarks:[], vocab:{}, scoreHistory:[], diagDone:false, lessonsRead:{}, updatedAt:0 };
let S = JSON.parse(JSON.stringify(DEFAULT));
function loadLocal(){ try{ const j=localStorage.getItem(LS_KEY); if(j){ const d=JSON.parse(j); if(d && typeof d==='object') Object.assign(S, d); } }catch(e){} }
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }
let db=null, SAMPLE=null, saveTimer=null;
async function initCaps(){
  try{ db = await window.claude?.use?.('db'); }catch(e){ db=null; }
  if(db){ try{ const snap = await db.doc('progress/main').get(); if(snap.exists){ const d=snap.data(); if((d.updatedAt||0) > (S.updatedAt||0)){ Object.assign(S, d); saveLocal(); renderAll(); } } }catch(e){} }
  try{ SAMPLE = await window.claude?.use?.('sample'); }catch(e){ SAMPLE=null; }
}
function persist(){ S.updatedAt=Date.now(); saveLocal(); if(!db) return; clearTimeout(saveTimer); saveTimer=setTimeout(async()=>{ try{ await db.doc('progress/main').set(JSON.parse(JSON.stringify(S))); }catch(e){} }, 1200); }

// ===================== 점수 추정 (1-모수 로지스틱) =====================
const DIFF_B = {1:-1.5, 2:-0.75, 3:0, 4:0.75, 5:1.5};
function estimateTheta(sec, responses = S.responses){
  const rs = responses.filter(r => QINDEX[r.qid] && QINDEX[r.qid].sec===sec).slice(-80);
  if(!rs.length) return null;
  let best=0, bestL=-Infinity;
  for(let t=-3; t<=3.0001; t+=0.05){
    let ll = -0.1*t*t;
    for(const r of rs){ const b=DIFF_B[QINDEX[r.qid].diff]; const p=1/(1+Math.exp(-1.3*(t-b))); ll += r.correct ? Math.log(p) : Math.log(1-p); }
    if(ll>bestL){ bestL=ll; best=t; }
  }
  return best;
}
const thetaToScore = t => t===null ? null : Math.max(5, Math.min(495, Math.round((100 + (t+2.5)/5*395)/5)*5));
function scores(responses = S.responses){
  const tl=estimateTheta('LC',responses), tr=estimateTheta('RC',responses);
  const lc=thetaToScore(tl), rc=thetaToScore(tr);
  return { lc, rc, total:(lc!==null&&rc!==null)?lc+rc:null, tl, tr };
}
function typeStats(){ const st={}; for(const r of S.responses){ const q=QINDEX[r.qid]; if(!q) continue; (st[q.type]=st[q.type]||{n:0,c:0,t:0}); st[q.type].n++; st[q.type].t+=r.t||0; if(r.correct) st[q.type].c++; } return st; }
function partStats(){ const st={}; for(const r of S.responses){ const q=QINDEX[r.qid]; if(!q) continue; (st[q.part]=st[q.part]||{n:0,c:0}); st[q.part].n++; if(r.correct) st[q.part].c++; } return st; }
function pWrong(q, sc, ts){
  const th = (q.sec==='LC' ? sc.tl : sc.tr) ?? 0;
  let b = DIFF_B[q.diff]; const s=ts[q.type];
  if(s && s.n>=2) b += (0.5 - s.c/s.n)*1.4;
  const p = 1/(1+Math.exp(-1.3*(th-b)));
  return Math.min(.95, Math.max(.05, 1-p));
}
function weakTypes(limit=3){
  const ts=typeStats();
  return Object.entries(ts).filter(([,s])=>s.n>=2).map(([type,s])=>({type,acc:s.c/s.n,n:s.n})).filter(w=>w.acc<0.8).sort((a,b)=>a.acc-b.acc || b.n-a.n).slice(0,limit);
}
function latestOutcome(){ const m={}; for(const r of S.responses) m[r.qid]=r; return m; }
function lastSeen(){ const m={}; for(const r of S.responses){ const q=QINDEX[r.qid]; if(q) m[q.gid]=Math.max(m[q.gid]||0, r.ts); } return m; }

// ===================== 추천 학습 =====================
function groupPriority(g, sc, ts, weak, seen){
  const now=Date.now();
  let s=0;
  for(const q of g.qs){ const pw=pWrong(q,sc,ts); s += pw*(1-pw)*4 + (weak.has(q.type)?0.6:0); }
  s/=g.qs.length;
  if(!seen[g.id]) s+=0.35; else if(now-seen[g.id] < 2*864e5) s-=1.2;
  return s + Math.random()*0.15;
}
function recommendGroups(targetLC=4, targetRC=6){
  const sc=scores(), ts=typeStats(), weak=new Set(weakTypes().map(w=>w.type)), seen=lastSeen();
  const ranked = BANK.map(g=>({g,p:groupPriority(g,sc,ts,weak,seen)})).sort((a,b)=>b.p-a.p);
  const pick=[]; let lc=0, rc=0;
  for(const {g} of ranked){ if(g.sec==='LC' && lc<targetLC){ pick.push(g.id); lc+=g.qs.length; } else if(g.sec==='RC' && rc<targetRC){ pick.push(g.id); rc+=g.qs.length; } }
  return pick.sort((a,b)=>GINDEX[a].part-GINDEX[b].part);
}
let STUDY_DIFF='all';
const groupMaxErr = g => Math.max(...g.qs.map(q=>q.err));
const diffMatch = (g,d) => d==='all' || (d==='easy' && groupMaxErr(g)<38) || (d==='hard' && groupMaxErr(g)>=48) || (d==='mid' && groupMaxErr(g)>=38 && groupMaxErr(g)<48);
function groupsForPart(part, nq, d=STUDY_DIFF){
  const sc=scores(), ts=typeStats(), weak=new Set(weakTypes().map(w=>w.type)), seen=lastSeen();
  let pool = BANK.filter(g=>g.part===part && diffMatch(g,d)); if(!pool.length) pool = BANK.filter(g=>g.part===part);
  const ranked = pool.map(g=>({g,p:groupPriority(g,sc,ts,weak,seen)})).sort((a,b)=>b.p-a.p);
  const pick=[]; let n=0; for(const {g} of ranked){ if(n>=nq) break; pick.push(g.id); n+=g.qs.length; } return pick;
}
function groupsForType(type, max=8){
  const seen=lastSeen();
  return BANK.filter(g=>g.qs.some(q=>q.type===type)).sort((a,b)=>(seen[a.id]||0)-(seen[b.id]||0)).slice(0,max).map(g=>g.id);
}

// ===================== 학습 기록 통계 =====================
function dayKeys(){ const s=new Set(); for(const r of S.responses) s.add(todayKey(new Date(r.ts))); return s; }
function streak(){ const days=dayKeys(); let n=0; const d=new Date(); if(!days.has(todayKey(d))) d.setDate(d.getDate()-1); while(days.has(todayKey(d))){ n++; d.setDate(d.getDate()-1); } return n; }
function todayCount(){ const k=todayKey(); return S.responses.filter(r=>todayKey(new Date(r.ts))===k).length; }
function totalTime(){ return S.responses.reduce((a,r)=>a+(r.t||0),0); }
function recordScore(){ const sc=scores(); if(sc.total===null) return; const k=todayKey(); const i=S.scoreHistory.findIndex(h=>h.day===k); const e={day:k,ts:Date.now(),lc:sc.lc,rc:sc.rc,total:sc.total}; if(i>=0) S.scoreHistory[i]=e; else S.scoreHistory.push(e); }

// ===================== 음성 (LC) =====================
const TTS = ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window);
let voices=[];
function loadVoices(){ if(!TTS) return; voices = speechSynthesis.getVoices().filter(v=>/^en[-_]?/i.test(v.lang)); }
if(TTS){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(g){
  const fem=/female|samantha|zira|victoria|karen|moira|tessa|fiona|allison|ava|susan|aria|jenny|emma|michelle|sara|google us english/i, mal=/\bmale|daniel|alex|david|fred|tom|mark|guy|ryan|christopher|eric|google uk english male/i;
  const us=voices.filter(v=>/en[-_]US/i.test(v.lang)); const pool = us.length?us:voices;
  if(g==='W'){ return pool.find(v=>fem.test(v.name)) || voices.find(v=>fem.test(v.name)) || pool[0]; }
  return pool.find(v=>mal.test(v.name)&&!/female/i.test(v.name)) || voices.find(v=>mal.test(v.name)&&!/female/i.test(v.name)) || pool[1] || pool[0];
}
let playBtnEl=null;
function speakSeq(items){
  if(!TTS) return;
  speechSynthesis.cancel();
  const vw=pickVoice('W'), vm=pickVoice('M');
  const sameVoice = vw && vm && vw.name===vm.name;
  let i=0;
  const setPlaying=on=>{ if(playBtnEl) playBtnEl.classList.toggle('playing',on); };
  const next=()=>{
    if(i>=items.length){ setPlaying(false); timerStart(); return; }
    const it=items[i++]; const u=new SpeechSynthesisUtterance(it.text);
    u.lang='en-US'; u.rate=0.92; const v = it.g==='W'?vw:vm; if(v) u.voice=v;
    if(sameVoice || !v) u.pitch = it.g==='W'?1.15:0.85;
    u.onend=()=>setTimeout(next, it.pause||350); u.onerror=()=>{ setPlaying(false); timerStart(); };
    speechSynthesis.speak(u);
  };
  setPlaying(true); next();
}
function stopSpeech(){ if(TTS) speechSynthesis.cancel(); }
function audioItems(g){
  if(g.part===2){ const q=g.qs[0]; return [{text:g.script,g:'M',pause:900}, ...q.opts.map((o,i)=>({text:L[i]+'. '+o, g:'W', pause:700}))]; }
  return g.script.map(([sp,text])=>({text,g:sp,pause:400}));
}
function scriptText(g){ if(g.part===2){ const q=g.qs[0]; return 'Q: '+g.script+'\n'+q.opts.map((o,i)=>'('+L[i]+') '+o).join('\n'); } return g.script.map(([sp,t])=>(sp==='W'?'W: ':'M: ')+t).join('\n\n'); }

// ===================== 탭 & 전체 렌더 =====================
let VIEW='home';
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>showView(b.dataset.view)));
function showView(v){ VIEW=v; document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===v)); document.querySelectorAll('.view').forEach(s=>s.hidden = s.id!=='view-'+v); renderAll(); window.scrollTo(0,0); }
function renderAll(){ ({home:renderHome, study:renderStudy, analysis:renderAnalysis, notes:renderNotes, guide:renderGuide})[VIEW](); }

// ===================== 홈 =====================
function scoreBand(t){ if(t===null) return null; if(t<550) return 0; if(t<700) return 1; if(t<800) return 2; if(t<900) return 3; return 4; }
const BANDS=['기초 다지기','중급 도약','상위권 진입','고득점','만점 도전'];
function renderHome(){
  const sc=scores(), weak=weakTypes(), ps=partStats();
  const goal=S.goal; const prog = sc.total===null?0:Math.min(100, Math.round(sc.total/goal*100));
  const rec=recommendGroups(); const recN=rec.reduce((a,id)=>a+GINDEX[id].qs.length,0);
  const lastH = S.scoreHistory.length>1 ? S.scoreHistory[S.scoreHistory.length-2] : null;
  const delta = (lastH && sc.total!==null) ? sc.total-lastH.total : null;
  const weakest = weak[0] ? weak[0].type : null;
  const todayK=todayKey();
  $('#view-home').innerHTML = `
  <div class="row between" style="align-items:center"><div><div class="brand-top">TOEIC Trainer</div><h1 class="brand">${S.diagDone?'오늘의 학습':'진단으로 시작'}</h1></div><div class="avatar-tile"><span class="emoji">🔥</span><span class="lbl num">${streak()}일 연속</span></div></div>
  <div class="score-hero">
    <div>
      <div class="sub">AI 예상 점수 ${delta!==null?`<span class="num delta ${delta>=0?'up':'down'}">${delta>=0?'▲':'▼'} ${Math.abs(delta)}</span>`:''}</div>
      <div class="big">${sc.total===null?'—':sc.total}</div>
      <div class="sub num" style="margin-top:4px">/ 990${sc.total!==null?' · '+BANDS[scoreBand(sc.total)]:''}</div>
      <button class="btn ink" style="margin-top:16px" data-act="${S.diagDone?'rec':'diag'}">${S.diagDone?'추천 학습 시작':'진단 테스트 시작'}</button>
    </div>
    <div style="text-align:center"><div class="sub" style="margin-bottom:8px">LC · RC · 목표</div>
      <div class="pillstack">
        <div class="pill-item lc"><b>${sc.lc??'—'}</b><small>LC</small></div>
        <div class="pill-item rc"><b>${sc.rc??'—'}</b><small>RC</small></div>
        <div class="pill-item goal"><input id="goal" type="number" min="300" max="990" step="5" value="${goal}" aria-label="목표 점수"><small>목표</small></div>
      </div>
    </div>
    <div class="full"><div class="goalbar"><i style="width:${prog}%"></i></div>
    <div class="sub num" style="margin-top:8px">${sc.total===null?'진단 테스트(LC 9 · RC 12문항, 약 12분)를 마치면 예상 점수가 계산됩니다':`목표까지 ${Math.max(0,goal-sc.total)}점 남았어요 · ${prog}% 달성`}</div></div>
  </div>

function scoreChart(){
  const H=S.scoreHistory.slice(-20); if(H.length<1) return '';
  const W=600,Hh=200,pl=36,pr=12,pt=14,pb=26; const vals=H.map(h=>h.total).concat([S.goal]);
  let lo=Math.max(10,Math.min(...vals)-60), hi=Math.min(990,Math.max(...vals)+60); if(hi-lo<100){hi=Math.min(990,lo+100);}
  const x=i=>H.length===1?(W-pl-pr)/2+pl:pl+i*(W-pl-pr)/(H.length-1), y=v=>pt+(hi-v)/(hi-lo)*(Hh-pt-pb);
  const ticks=[]; const step=(hi-lo)>300?100:50; for(let v=Math.ceil(lo/step)*step; v<=hi; v+=step) ticks.push(v);
  const path=H.map((h,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(h.total).toFixed(1)).join(' ');
  const area=H.length>1?path+` L${x(H.length-1).toFixed(1)} ${y(lo).toFixed(1)} L${x(0).toFixed(1)} ${y(lo).toFixed(1)} Z`:'';
  return `<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="예상 점수 추이">
    ${ticks.map(v=>`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text x="${pl-6}" y="${(y(v)+4).toFixed(1)}" text-anchor="end">${v}</text>`).join('')}
    ${S.goal>=lo&&S.goal<=hi?`<line class="goal" x1="${pl}" x2="${W-pr}" y1="${y(S.goal).toFixed(1)}" y2="${y(S.goal).toFixed(1)}"/><text x="${W-pr}" y="${(y(S.goal)-4).toFixed(1)}" text-anchor="end" style="fill:var(--good)">목표 ${S.goal}</text>`:''}
    ${area?`<path class="area" d="${area}"/>`:''}<path class="ln" d="${path}"/>
    ${H.map((h,i)=>`<circle class="dot" cx="${x(i).toFixed(1)}" cy="${y(h.total).toFixed(1)}" r="${i===H.length-1?5:3}"/>`).join('')}
    ${H.map((h,i)=>(H.length<=8||i===0||i===H.length-1||i%Math.ceil(H.length/6)===0)?`<text x="${x(i).toFixed(1)}" y="${Hh-8}" text-anchor="middle">${h.day.slice(5)}</text>`:'').join('')}
    <text x="${x(H.length-1).toFixed(1)}" y="${(y(H[H.length-1].total)-10).toFixed(1)}" text-anchor="middle" style="fill:var(--accent);font-weight:700;font-size:15px">${H[H.length-1].total}</text>
  </svg>`;
}

// ===================== 문제 타이머 (실전 권장 시간) =====================
const TIME_LIMIT = {2:5,3:8,4:8,5:20,6:30,7:60}; // 초/문항 (LC는 음원 종료 후)
const fmtClock = s => { s=Math.max(0,Math.floor(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
let TIMER=null, timerIv=null;
function timerSetup(g){ clearInterval(timerIv); TIMER={part:g.part,n:g.qs.length,limit:TIME_LIMIT[g.part]*g.qs.length,start:null,stopped:null,waiting:g.sec==='LC'&&TTS,overToasted:false}; if(!TIMER.waiting) TIMER.start=Date.now(); timerIv=setInterval(timerTick,200); }
function timerStart(){ if(TIMER&&TIMER.waiting){ TIMER.waiting=false; TIMER.start=Date.now(); if(SES) SES.qStart=Date.now(); timerTick(); } }
function timerStop(){ if(TIMER&&TIMER.start&&!TIMER.stopped){ TIMER.stopped=Date.now(); timerTick(); } }
function timerClear(){ clearInterval(timerIv); timerIv=null; TIMER=null; }
function timerTick(){
  const el=$('#tgauge'); if(!el||!TIMER) return; const i=el.querySelector('i'), t=$('#ttime'), lbl=$('#tlabel');
  if(TIMER.waiting){ i.style.width='0%'; t.textContent='0:00 / '+fmtClock(TIMER.limit); lbl.textContent='음원이 끝나면 시작 · 문항당 '+TIME_LIMIT[TIMER.part]+'초'; el.classList.remove('over'); return; }
  const e=((TIMER.stopped||Date.now())-TIMER.start)/1000; const over=e>TIMER.limit;
  i.style.width=Math.min(100,e/TIMER.limit*100)+'%'; t.textContent=fmtClock(e)+' / '+fmtClock(TIMER.limit); el.classList.toggle('over',over);
  lbl.textContent = TIMER.stopped ? (over?`권장 시간 초과 +${Math.round(e-TIMER.limit)}초`:'시간 내 완료') : (over?'권장 시간 초과':`Part ${TIMER.part} 권장 ${TIME_LIMIT[TIMER.part]}초/문항${TIMER.n>1?' × '+TIMER.n:''}`);
  if(over&&!TIMER.stopped&&!TIMER.overToasted){ TIMER.overToasted=true; toast('권장 시간을 넘겼어요. 실전에서는 표시하고 넘어가세요.'); }
}

  const Ls=LESSONS[type]; const T=TYPES[type]; const s=typeStats()[type];
  return `<div class="qhead"><button class="iconbtn" data-act="quit" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="grow" style="flex:1"><span class="chip ${T.sec==='LC'?'lc':'rc'}">Part ${T.part} 개념 강의</span></div></div>
  <div class="lesson"><div class="eyebrow">${esc(T.name)}${s?' · 내 정답률 '+pct(s.c,s.n)+'%':''}</div><h3>${esc(Ls.title)}</h3><p>${esc(Ls.body)}</p><div class="formula">${esc(Ls.formula)}</div><div class="bold small">체크 포인트</div><ul class="small">${Ls.tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul><div class="ex">예) ${esc(Ls.ex)}</div></div>
  <div style="margin-top:14px">${footer}</div>`;
}
function openLesson(type){
  S.lessonsRead[type]=Date.now(); persist();
  SES={mode:'lesson',title:'강의',gids:[],idx:0,ans:{},stage:'lessononly',lesson:type};
  $('#quiz').hidden=false; document.body.style.overflow='hidden';
  $('#quiz-inner').innerHTML = lessonHTML(type, `<div class="row"><button class="btn primary" style="flex:1" data-act="lesson-practice" data-type="${type}">이 유형 문제 풀기</button><button class="btn ghost" data-act="quit">닫기</button></div>`);
  $('#quiz').scrollTop=0;
}
function answer(qid, choice){
  const q=QINDEX[qid]; if(!SES || SES.ans[qid]) return;
  const t=(Date.now()-SES.qStart)/1000; SES.qStart=Date.now();
  timerStart();
  const correct = choice===q.ans; SES.ans[qid]={choice,correct,t};
  if(GINDEX[q.gid].qs.every(x=>SES.ans[x.id])) timerStop();
  S.responses.push({qid,correct,t:Math.round(t),ts:Date.now()}); if(S.responses.length>3000) S.responses=S.responses.slice(-3000); persist();
  if(q.sec==='RC' && t<3) toast('너무 빨리 풀었어요. 찍지 말고 근거를 찾아보세요.');
  else if(q.part===5 && t>45) toast('Part 5는 20초 안에 끝내는 연습을 해보세요.');
  QSCROLL=$('#quiz').scrollTop; renderQuiz(); $('#quiz').scrollTop=QSCROLL;
}
function finishSession(){
  stopSpeech(); timerClear(); SES.stage='result'; S.diagDone = S.diagDone || SES.mode==='diag'; recordScore(); persist(); renderQuiz(); $('#quiz').scrollTop=0;
}
function resultHTML(){
  const after=scores(); const before=SES.before; const ans=Object.values(SES.ans); const qids=Object.keys(SES.ans);
  const c=ans.filter(a=>a.correct).length, n=ans.length; const time=ans.reduce((a,b)=>a+b.t,0);
  const byPart={}; qids.forEach(id=>{const q=QINDEX[id]; (byPart[q.part]=byPart[q.part]||{n:0,c:0}); byPart[q.part].n++; if(SES.ans[id].correct) byPart[q.part].c++;});
  const wrongTypes=[...new Set(qids.filter(id=>!SES.ans[id].correct).map(id=>QINDEX[id].type))];
  const d = (after.total!==null&&before.total!==null)?after.total-before.total:null;
  const weak=weakTypes();
  return `<div class="qhead"><div class="grow" style="flex:1"><span class="eyebrow">${SES.mode==='diag'?'진단 결과':'학습 결과'}</span></div><button class="iconbtn" data-act="quit" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="score-hero"><div><div class="sub">${SES.mode==='diag'?'AI 예상 점수':'학습 후 예상 점수'}</div><div class="row" style="align-items:flex-end;gap:10px"><span class="big">${after.total??'—'}</span>${d!==null&&SES.mode!=='diag'?`<span class="num bold" style="padding-bottom:10px;font-size:18px">${d>=0?'▲':'▼'} ${Math.abs(d)}</span>`:''}</div>
    <div class="sub num" style="margin-top:8px">이번 세션 <b>${c}/${n}</b> 정답 · ${fmtMin(time)}</div></div>
    <div class="pillstack"><div class="pill-item lc"><b>${after.lc??'—'}</b><small>LC</small></div><div class="pill-item rc"><b>${after.rc??'—'}</b><small>RC</small></div></div></div>
  ${SES.mode==='diag'?`<div class="banner">진단 완료! 이제 홈의 <b>추천 학습</b>이 당신의 약점에 맞춰 문제를 골라 줍니다. 예상 점수는 풀이가 쌓일수록 정확해집니다.</div>`:''}
  <div class="card" style="margin-top:12px"><div class="bold" style="margin-bottom:6px">파트별 결과</div>${Object.entries(byPart).map(([p,s])=>{const a=pct(s.c,s.n); const cls=a<60?'bad':a<80?'warn':'good'; return `<div class="typerow"><div class="name">Part ${p} ${PART_INFO[p].sub}</div><span class="pct" style="color:var(--${cls})">${s.c}/${s.n}</span><div class="bar"><i class="${cls}" style="width:${a}%"></i></div></div>`}).join('')}</div>
  ${wrongTypes.length?`<div class="card" style="margin-top:12px"><div class="bold" style="margin-bottom:6px">이번에 틀린 유형</div>${wrongTypes.map(t=>`<div class="item"><div class="grow"><div class="title">${esc(TYPES[t].name)}</div><div class="desc">${esc(LESSONS[t]?LESSONS[t].title:'')}</div></div><button class="btn small ghost" data-act="lesson-open" data-type="${t}">강의</button><button class="btn small navy" data-act="type" data-type="${t}">더 풀기</button></div>`).join('')}</div>`:`<div class="card" style="margin-top:12px"><div class="bold">전부 맞혔어요!</div><p class="small muted">${weak.length?'다음은 취약 유형 <b>'+esc(TYPES[weak[0].type].name)+'</b>을 풀어 보세요.':'난이도가 더 높은 문제를 추천할게요.'}</p></div>`}
  <div class="stack" style="margin-top:14px">
    ${SES.mode==='rec'?`<button class="btn primary block" data-act="vocab">오늘의 단어 5개 외우기</button>`:''}
    ${wrongTypes.length?`<button class="btn navy block" data-act="retry-session">틀린 문제 다시 풀기</button>`:''}
    <button class="btn ghost block" data-act="quit">홈으로</button>
  </div>`;
}

// ===================== 단어 퀴즈 / 플래시카드 =====================
let VQ=null;
function pickVocab(n){ const scored=VOCAB.map(v=>{const s=S.vocab[v[0]]||{n:0,c:0,learned:false}; return {v,p:(s.learned?-5:0)+(s.n-s.c)*2-(s.c*0.5)+Math.random()*1.2};}).sort((a,b)=>b.p-a.p); return scored.slice(0,n).map(s=>s.v); }
function startVocabQuiz(n, flash=false){
  VQ={items:pickVocab(n),idx:0,c:0,flash,flipped:false,picked:null};
  $('#quiz').hidden=false; document.body.style.overflow='hidden'; renderVocab(); $('#quiz').scrollTop=0;
}
function renderVocab(){
  const inner=$('#quiz-inner'); const [w,p,m,ex]=VQ.items[VQ.idx]; const n=VQ.items.length;
  const head=`<div class="qhead"><button class="iconbtn" data-act="vquit" aria-label="종료"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="prog"><i style="width:${Math.round(VQ.idx/n*100)}%"></i></div><span class="cnt">${VQ.idx+1} / ${n}</span></div>`;
  if(VQ.flash){
    inner.innerHTML = head+`<div class="vocabcard" style="min-height:220px;display:flex;flex-direction:column;justify-content:center;text-align:center"><div class="w">${esc(w)}<span class="pos">${esc(p)}</span></div>${VQ.flipped?`<div class="m">${esc(m)}</div><div class="ex">${esc(ex)}</div>`:'<div class="muted small" style="margin-top:8px">탭해서 뜻 보기</div>'}</div>
    <div class="row" style="margin-top:12px">${VQ.flipped?`<button class="btn ghost" style="flex:1" data-act="vflash-next" data-ok="0">아직 몰라요</button><button class="btn primary" style="flex:1" data-act="vflash-next" data-ok="1">알아요</button>`:`<button class="btn navy block" data-act="vflip">뜻 보기</button>`}</div>`;
    return;
  }
  if(!VQ.opts){ const others=VOCAB.filter(v=>v[0]!==w).sort(()=>Math.random()-.5).slice(0,3).map(v=>v[2]); VQ.opts=[m,...others].sort(()=>Math.random()-.5); }
  inner.innerHTML = head+`<div class="vocabcard"><div class="eyebrow">뜻을 고르세요</div><div class="w">${esc(w)}<span class="pos">${esc(p)}</span></div>${VQ.picked!==null?`<div class="ex">${esc(ex)}</div>`:''}</div>
  <div class="opts" style="margin-top:12px">${VQ.opts.map((o,i)=>{let cls='opt'; if(VQ.picked!==null){ if(o===m) cls+=' correct'; else if(i===VQ.picked) cls+=' wrong'; } return `<button class="${cls}" data-act="vpick" data-i="${i}" ${VQ.picked!==null?'disabled':''}><span class="k">${L[i]}</span><span class="t">${esc(o)}</span></button>`}).join('')}</div>
  ${VQ.picked!==null?`<button class="btn primary block" style="margin-top:12px" data-act="vnext">${VQ.idx+1>=n?'결과 보기':'다음'}</button>`:''}`;
}
function vocabRecord(w, ok){ const s=S.vocab[w]=S.vocab[w]||{n:0,c:0,learned:false}; s.n++; if(ok) s.c++; if(s.c>=2 && ok) s.learned=true; if(!ok) s.learned=false; persist(); }
function vocabResult(){ const n=VQ.items.length; $('#quiz-inner').innerHTML=`<div class="qhead"><div style="flex:1"><span class="eyebrow">단어 퀴즈 결과</span></div><button class="iconbtn" data-act="vquit"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="card" style="text-align:center;padding:28px"><div class="result-big num">${VQ.c}<span class="muted" style="font-size:20px"> / ${n}</span></div><p class="muted small" style="margin-top:6px">외운 단어 ${Object.values(S.vocab).filter(v=>v.learned).length} / ${VOCAB.length}</p></div><div class="stack" style="margin-top:12px"><button class="btn primary block" data-act="vocab10">10개 더 풀기</button><button class="btn ghost block" data-act="vquit">닫기</button></div>`; }

// ===================== 이벤트 위임 =====================
document.addEventListener('click', async e=>{
  const b=e.target.closest('[data-act]'); if(!b) return; const act=b.dataset.act;
  switch(act){
    case 'diag': startSession('diag','진단 테스트',DIAG_SET); break;
    case 'rec': { const w=weakTypes(); startSession('rec','추천 학습',recommendGroups(),{lesson:w[0]?w[0].type:null}); break; }
    case 'part': { const p=+b.dataset.part; const nq={2:10,3:6,4:6,5:12,6:4,7:7}[p]; startSession('part','Part '+p,groupsForPart(p,nq)); break; }
    case 'type': { const t=b.dataset.type; if(SES){ stopSpeech(); } startSession('type',TYPES[t].name,groupsForType(t)); break; }
    case 'group': startSession('one','문제',[b.dataset.gid]); break;
    case 'retry-wrong': { const lo=latestOutcome(); const gids=[...new Set(Object.values(lo).filter(r=>!r.correct&&QINDEX[r.qid]).map(r=>QINDEX[r.qid].gid))]; startSession('wrong','오답 다시 풀기',gids); break; }
    case 'retry-bm': startSession('bm','북마크',S.bookmarks.slice()); break;
    case 'unbm': S.bookmarks=S.bookmarks.filter(id=>id!==b.dataset.gid); persist(); renderNotes(); break;
    case 'go-analysis': showView('analysis'); break;
    case 'lesson': openLesson(b.dataset.type); break;
    case 'lesson-open': openLesson(b.dataset.type); break;
    case 'lesson-practice': startSession('type',TYPES[b.dataset.type].name,groupsForType(b.dataset.type)); break;
    case 'lesson-done': S.lessonsRead[SES.lesson]=Date.now(); persist(); SES.stage='q'; SES.qStart=Date.now(); renderQuiz(); $('#quiz').scrollTop=0; break;
    case 'quit': { if(SES && SES.stage==='q' && Object.keys(SES.ans).length && SES.idx<SES.gids.length){ finishSession(); } else endSession(); break; }
    case 'bm': { const id=SES.gids[SES.idx]; const i=S.bookmarks.indexOf(id); if(i>=0){S.bookmarks.splice(i,1); toast('책갈피 해제');} else {S.bookmarks.push(id); toast('책갈피에 저장했어요');} persist(); QSCROLL=$('#quiz').scrollTop; renderQuiz(); $('#quiz').scrollTop=QSCROLL; break; }
    case 'play': { const g=GINDEX[SES.gids[SES.idx]]; speakSeq(audioItems(g)); break; }
    case 'script': { const id=SES.gids[SES.idx]; SES.showScript[id]=!SES.showScript[id]; QSCROLL=$('#quiz').scrollTop; renderQuiz(); $('#quiz').scrollTop=QSCROLL; break; }
    case 'showtext': { const id=SES.gids[SES.idx]; SES.showText[id]=!SES.showText[id]; QSCROLL=$('#quiz').scrollTop; renderQuiz(); $('#quiz').scrollTop=QSCROLL; break; }
    case 'ans': answer(b.dataset.qid, +b.dataset.choice); break;
    case 'next': { stopSpeech(); if(SES.idx+1>=SES.gids.length) finishSession(); else { SES.idx++; SES.qStart=Date.now(); renderQuiz(); $('#quiz').scrollTop=0; } break; }
    case 'retry-session': { const gids=[...new Set(Object.keys(SES.ans).filter(id=>!SES.ans[id].correct).map(id=>QINDEX[id].gid))]; startSession('wrong','오답 다시 풀기',gids); break; }
    case 'ai-toggle': { const el=$('#ai-'+b.dataset.qid); el.hidden=!el.hidden; break; }
    case 'ai-ask': { const qid=b.dataset.qid; const q=QINDEX[qid], g=GINDEX[q.gid]; const out=$('#ai-out-'+qid); const userQ=$('#ai-in-'+qid).value.trim()||'이 문제를 더 자세히 설명해 줘.'; out.hidden=false; out.textContent='생각 중...'; b.disabled=true;
      const ctx = g.passage ? '지문:\n'+g.passage+'\n\n' : g.script ? '스크립트:\n'+scriptText(g)+'\n\n' : '';
      const prompt=`당신은 토익 강사입니다. 아래 문제에 대한 학생의 질문에 한국어로 간결하게(5문장 이내) 답하세요. 마크다운 굵게 표시는 쓰지 마세요.\n\n${ctx}문제: ${q.q||'(Part 2 응답 고르기)'}\n보기: ${q.opts.map((o,i)=>'('+L[i]+') '+o).join(' / ')}\n정답: (${L[q.ans]})\n기존 해설: ${q.exp}\n학생이 고른 답: (${L[SES.ans[qid].choice]})\n\n학생 질문: ${userQ}`;
      try{ const {text}=await SAMPLE(prompt,{modelTier:'quick',onText:({text})=>{out.textContent=text;}}); out.textContent=text; }catch(err){ out.textContent = err.code==='not_granted'?'AI 튜터 사용이 허용되지 않았습니다.':(err.text||'답변을 받지 못했어요. 잠시 후 다시 시도해 주세요.'); } b.disabled=false; break; }
    case 'ai-guide': askGuide(false); break;
    case 'ai-guide-auto': askGuide(true); break;
    case 'vocab': startVocabQuiz(VIEW==='notes'?10:5); break;
    case 'vocab10': startVocabQuiz(10); break;
    case 'vocab-flash': startVocabQuiz(10,true); break;
    case 'vlearn': { const w=b.dataset.word; const s=S.vocab[w]=S.vocab[w]||{n:0,c:0,learned:false}; s.learned=!s.learned; persist(); renderNotes(); break; }
    case 'vpick': { const i=+b.dataset.i; VQ.picked=i; const [w,,m]=VQ.items[VQ.idx]; const ok=VQ.opts[i]===m; if(ok) VQ.c++; vocabRecord(w,ok); renderVocab(); break; }
    case 'vnext': VQ.idx++; VQ.opts=null; VQ.picked=null; if(VQ.idx>=VQ.items.length) vocabResult(); else renderVocab(); break;
    case 'vflip': VQ.flipped=true; renderVocab(); break;
    case 'vflash-next': { const [w]=VQ.items[VQ.idx]; const ok=b.dataset.ok==='1'; if(ok) VQ.c++; vocabRecord(w,ok); VQ.idx++; VQ.flipped=false; if(VQ.idx>=VQ.items.length) vocabResult(); else renderVocab(); break; }
    case 'vquit': VQ=null; $('#quiz').hidden=true; document.body.style.overflow=''; renderAll(); break;
  }
});
document.addEventListener('keydown', e=>{
  if(!SES || SES.stage!=='q' || $('#quiz').hidden) return;
  const k=e.key.toUpperCase(); const i=L.indexOf(k);
  if(i>=0){ const btn=document.querySelector(`#quiz .opt[data-choice="${i}"]:not([disabled])`); if(btn) btn.click(); }
  if(e.key==='Enter'){ const n=document.querySelector('#quiz [data-act="next"]:not([disabled])'); if(n) n.click(); }
  if(e.key===' ' && GINDEX[SES.gids[SES.idx]].sec==='LC'){ e.preventDefault(); const p=document.querySelector('#quiz [data-act="play"]'); if(p) p.click(); }
});

// ===================== 시작 =====================
loadLocal(); renderAll(); initCaps();
</script>
</body></html>
