    }
  } else if(g.passage){
    const mono = g.part===7&&/^From:|^To:|A\.M\.\)/m.test(g.passage);
    html += `<div class="passage${mono?' mono':''}" style="margin-bottom:10px">${passageHTML(g.passage,rich)}</div>`;
    if(allAnswered && tr.p) html += `<div class="passage tr-block" id="trblock" style="margin-bottom:10px" ${SES.hideTr[g.id]?'hidden':''}><div class="eyebrow" style="margin-bottom:6px">지문 해석</div>${esc(tr.p).replace(/___\((\d)\)___/g,'<span class="blank">___($1)___</span>').replace(/\[(\d)\]/g,'<span class="pos">[$1]</span>')}</div><div class="row" style="margin:-4px 0 10px"><button class="btn small ghost" data-act="trtoggle">${SES.hideTr[g.id]?'지문 해석 보기':'지문 해석 숨기기'}</button></div>`;
  }
  html += '<div class="stack">'+g.qs.map((q,qi)=>{
    const a=SES.ans[q.id]; const hideText = g.part===2 && TTS && !a && !SES.showText[g.id];
    const tq = tr.qs&&tr.qs[qi]; 
    return `<div class="qblock" id="qb-${q.id}">${q.q?`<div class="qtext"><span class="n">${g.qs.length>1?qi+1+'.':''}</span>${richText(q.q,!!a)}${a&&tq&&tq.q?`<div class="tr">${esc(tq.q)}</div>`:''}</div>`:''}
      ${g.part===2&&!a&&TTS?`<div class="row between" style="margin-bottom:8px"><span class="small muted">음원을 듣고 알맞은 응답을 고르세요</span><button class="btn small ghost" data-act="showtext">${SES.showText[g.id]?'보기 숨기기':'보기 텍스트'}</button></div>`:''}
      <div class="opts">${q.opts.map((o,oi)=>{ let cls='opt'; if(a){ if(oi===q.ans) cls+=' correct'; else if(oi===a.choice) cls+=' wrong'; } if(hideText) cls+=' hiddentext'; return `<button class="${cls}" data-act="ans" data-qid="${q.id}" data-choice="${oi}" ${a?'disabled':''}><span class="k">${L[oi]}</span><span class="t">${hideText?'(음원에서 확인)':richText(o,!!a)}${a&&tq&&tq.o&&tq.o[oi]?`<small class="otr">${esc(tq.o[oi])}</small>`:''}</span></button>`; }).join('')}</div>
      ${a?`<div class="verdict ${a.correct?'ok':'no'}"><div class="vh">${a.correct?'정답입니다':'오답 · 정답은 ('+L[q.ans]+')'} <span class="tiny num" style="font-weight:600;color:${a.t>TIME_LIMIT[g.part]?'var(--bad)':'var(--muted)'}">· ${Math.round(a.t)}초${a.t>TIME_LIMIT[g.part]?' (권장 '+TIME_LIMIT[g.part]+'초 초과)':''}</span></div><div>${esc(q.exp)}</div>
        ${SAMPLE?`<div class="ai-box"><button class="btn small ghost" data-act="ai-toggle" data-qid="${q.id}">AI 튜터에게 질문</button><div id="ai-${q.id}" hidden style="margin-top:8px"><textarea id="ai-in-${q.id}" placeholder="예: 왜 (B)는 안 되나요? / 이 표현 다른 예문도 알려 줘"></textarea><div class="row" style="margin-top:6px"><button class="btn small navy" data-act="ai-ask" data-qid="${q.id}">질문 보내기</button></div><div class="ai-ans" id="ai-out-${q.id}" hidden></div></div></div>`:''}</div>`:''}
    </div>`;}).join('')+'</div>';
  html += `<div class="row" style="margin-top:14px;gap:8px"><button class="btn primary block" data-act="next" ${allAnswered?'':'disabled'}>${SES.idx+1>=SES.gids.length?'결과 보기':'다음 문제'}</button></div>`;
  inner.innerHTML=html; playBtnEl=inner.querySelector('.play'); timerTick();
}
function lessonHTML(type, footer){
  const Ls=LESSONS[type]; const T=TYPES[type]; const s=typeStats()[type];
  return `<div class="qhead"><button class="iconbtn" data-act="quit" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="grow" style="flex:1"><span class="chip ${T.sec==='LC'?'lc':'rc'}">Part ${T.part} 개념 강의</span></div></div>
  <div class="lesson"><div class="eyebrow">${esc(T.name)}${s?' · 내 정답률 '+pct(s.c,s.n)+'%':''}</div><h3>${esc(Ls.title)}</h3><p>${esc(Ls.body)}</p><div class="formula">${esc(Ls.formula)}</div><div class="bold small">체크 포인트</div><ul class="small">${Ls.tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul><div class="ex">예) ${esc(Ls.ex)}</div></div>
  <div style="margin-top:14px">${footer}</div>`;
}
function openLesson(type){
  S.lessonsRead[type]=Date.now(); persist();
  SES={mode:'lesson',title:'강의',gids:[],idx:0,ans:{},stage:'lessononly',lesson:type};
  $('#quiz').hidden=false; document.body.style.overflow='hidden';
  $('#quiz-inner').innerHTML = lessonHTML(type, `<div class="row"><button class="btn primary" style="flex:1" data-act="lesson-practice" data-type="${type}">이 유형 문제 풀기</button><button class="btn ghost" data-act="quit">닫기</button></div>`);
  $('#quiz').scrollTop=0;
}
function answer(qid, choice){
  const q=QINDEX[qid]; if(!SES || SES.ans[qid]) return;
  const t=(Date.now()-SES.qStart)/1000; SES.qStart=Date.now();
  timerStart();
  const correct = choice===q.ans; SES.ans[qid]={choice,correct,t};
  if(GINDEX[q.gid].qs.every(x=>SES.ans[x.id])) timerStop();
  S.responses.push({qid,correct,t:Math.round(t),ts:Date.now()}); if(S.responses.length>3000) S.responses=S.responses.slice(-3000); persist();
  if(q.sec==='RC' && t<3) toast('너무 빨리 풀었어요. 찍지 말고 근거를 찾아보세요.');
  else if(q.part===5 && t>45) toast('Part 5는 20초 안에 끝내는 연습을 해보세요.');
  QSCROLL=$('#quiz').scrollTop; renderQuiz(); $('#quiz').scrollTop=QSCROLL;
}
function finishSession(){
  stopSpeech(); timerClear(); SES.stage='result'; S.diagDone = S.diagDone || SES.mode==='diag'; recordScore(); persist(); renderQuiz(); $('#quiz').scrollTop=0;
}
function resultHTML(){
  const after=scores(); const before=SES.before; const ans=Object.values(SES.ans); const qids=Object.keys(SES.ans);
  const c=ans.filter(a=>a.correct).length, n=ans.length; const time=ans.reduce((a,b)=>a+b.t,0);
  const byPart={}; qids.forEach(id=>{const q=QINDEX[id]; (byPart[q.part]=byPart[q.part]||{n:0,c:0}); byPart[q.part].n++; if(SES.ans[id].correct) byPart[q.part].c++;});
  const wrongTypes=[...new Set(qids.filter(id=>!SES.ans[id].correct).map(id=>QINDEX[id].type))];
  const d = (after.total!==null&&before.total!==null)?after.total-before.total:null;
  const weak=weakTypes();
  return `<div class="qhead"><div class="grow" style="flex:1"><span class="eyebrow">${SES.mode==='diag'?'진단 결과':'학습 결과'}</span></div><button class="iconbtn" data-act="quit" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="score-hero"><div><div class="sub">${SES.mode==='diag'?'AI 예상 점수':'학습 후 예상 점수'}</div><div class="row" style="align-items:flex-end;gap:10px"><span class="big">${after.total??'—'}</span>${d!==null&&SES.mode!=='diag'?`<span class="num bold" style="padding-bottom:10px;font-size:18px">${d>=0?'▲':'▼'} ${Math.abs(d)}</span>`:''}</div>
    <div class="sub num" style="margin-top:8px">이번 세션 <b>${c}/${n}</b> 정답 · ${fmtMin(time)}</div></div>
    <div class="pillstack"><div class="pill-item lc"><b>${after.lc??'—'}</b><small>LC</small></div><div class="pill-item rc"><b>${after.rc??'—'}</b><small>RC</small></div></div></div>
  ${SES.mode==='diag'?`<div class="banner">진단 완료! 이제 홈의 <b>추천 학습</b>이 당신의 약점에 맞춰 문제를 골라 줍니다. 예상 점수는 풀이가 쌓일수록 정확해집니다.</div>`:''}
  <div class="card" style="margin-top:12px"><div class="bold" style="margin-bottom:6px">파트별 결과</div>${Object.entries(byPart).map(([p,s])=>{const a=pct(s.c,s.n); const cls=a<60?'bad':a<80?'warn':'good'; return `<div class="typerow"><div class="name">Part ${p} ${PART_INFO[p].sub}</div><span class="pct" style="color:var(--${cls})">${s.c}/${s.n}</span><div class="bar"><i class="${cls}" style="width:${a}%"></i></div></div>`}).join('')}</div>
  ${wrongTypes.length?`<div class="card" style="margin-top:12px"><div class="bold" style="margin-bottom:6px">이번에 틀린 유형</div>${wrongTypes.map(t=>`<div class="item"><div class="grow"><div class="title">${esc(TYPES[t].name)}</div><div class="desc">${esc(LESSONS[t]?LESSONS[t].title:'')}</div></div><button class="btn small ghost" data-act="lesson-open" data-type="${t}">강의</button><button class="btn small navy" data-act="type" data-type="${t}">더 풀기</button></div>`).join('')}</div>`:`<div class="card" style="margin-top:12px"><div class="bold">전부 맞혔어요!</div><p class="small muted">${weak.length?'다음은 취약 유형 <b>'+esc(TYPES[weak[0].type].name)+'</b>을 풀어 보세요.':'난이도가 더 높은 문제를 추천할게요.'}</p></div>`}
  <div class="stack" style="margin-top:14px">
    ${SES.mode==='rec'?`<button class="btn primary block" data-act="vocab">오늘의 단어 5개 외우기</button>`:''}
    ${wrongTypes.length?`<button class="btn navy block" data-act="retry-session">틀린 문제 다시 풀기</button>`:''}
    <button class="btn ghost block" data-act="quit">홈으로</button>
  </div>`;
}

// ===================== 단어 퀴즈 / 플래시카드 =====================
let VQ=null;
function pickVocab(n){ const scored=VOCAB.map(v=>{const s=S.vocab[v[0]]||{n:0,c:0,learned:false}; return {v,p:(s.learned?-5:0)+(s.n-s.c)*2-(s.c*0.5)+Math.random()*1.2};}).sort((a,b)=>b.p-a.p); return scored.slice(0,n).map(s=>s.v); }
function startVocabQuiz(n, flash=false){
  VQ={items:pickVocab(n),idx:0,c:0,flash,flipped:false,picked:null};
  $('#quiz').hidden=false; document.body.style.overflow='hidden'; renderVocab(); $('#quiz').scrollTop=0;
}
function renderVocab(){
  const inner=$('#quiz-inner'); const [w,p,m,ex]=VQ.items[VQ.idx]; const n=VQ.items.length;
  const head=`<div class="qhead"><button class="iconbtn" data-act="vquit" aria-label="종료"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="prog"><i style="width:${Math.round(VQ.idx/n*100)}%"></i></div><span class="cnt">${VQ.idx+1} / ${n}</span></div>`;
  if(VQ.flash){
    inner.innerHTML = head+`<div class="vocabcard" style="min-height:220px;display:flex;flex-direction:column;justify-content:center;text-align:center"><div class="w">${esc(w)}<span class="pos">${esc(p)}</span></div>${VQ.flipped?`<div class="m">${esc(m)}</div><div class="ex">${esc(ex)}</div>`:'<div class="muted small" style="margin-top:8px">탭해서 뜻 보기</div>'}</div>
    <div class="row" style="margin-top:12px">${VQ.flipped?`<button class="btn ghost" style="flex:1" data-act="vflash-next" data-ok="0">아직 몰라요</button><button class="btn primary" style="flex:1" data-act="vflash-next" data-ok="1">알아요</button>`:`<button class="btn navy block" data-act="vflip">뜻 보기</button>`}</div>`;
    return;
  }
  if(!VQ.opts){ const others=VOCAB.filter(v=>v[0]!==w).sort(()=>Math.random()-.5).slice(0,3).map(v=>v[2]); VQ.opts=[m,...others].sort(()=>Math.random()-.5); }
  inner.innerHTML = head+`<div class="vocabcard"><div class="eyebrow">뜻을 고르세요</div><div class="w">${esc(w)}<span class="pos">${esc(p)}</span></div>${VQ.picked!==null?`<div class="ex">${esc(ex)}</div>`:''}</div>
  <div class="opts" style="margin-top:12px">${VQ.opts.map((o,i)=>{let cls='opt'; if(VQ.picked!==null){ if(o===m) cls+=' correct'; else if(i===VQ.picked) cls+=' wrong'; } return `<button class="${cls}" data-act="vpick" data-i="${i}" ${VQ.picked!==null?'disabled':''}><span class="k">${L[i]}</span><span class="t">${esc(o)}</span></button>`}).join('')}</div>
  ${VQ.picked!==null?`<button class="btn primary block" style="margin-top:12px" data-act="vnext">${VQ.idx+1>=n?'결과 보기':'다음'}</button>`:''}`;
}
function vocabRecord(w, ok){ const s=S.vocab[w]=S.vocab[w]||{n:0,c:0,learned:false}; s.n++; if(ok) s.c++; if(s.c>=2 && ok) s.learned=true; if(!ok) s.learned=false; persist(); }
function vocabResult(){ const n=VQ.items.length; $('#quiz-inner').innerHTML=`<div class="qhead"><div style="flex:1"><span class="eyebrow">단어 퀴즈 결과</span></div><button class="iconbtn" data-act="vquit"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="card" style="text-align:center;padding:28px"><div class="result-big num">${VQ.c}<span class="muted" style="font-size:20px"> / ${n}</span></div><p class="muted small" style="margin-top:6px">외운 단어 ${Object.values(S.vocab).filter(v=>v.learned).length} / ${VOCAB.length}</p></div><div class="stack" style="margin-top:12px"><button class="btn primary block" data-act="vocab10">10개 더 풀기</button><button class="btn ghost block" data-act="vquit">닫기</button></div>`; }

// ===================== 이벤트 위임 =====================
document.addEventListener('click', async e=>{
  const b=e.target.closest('[data-act]'); if(!b) return; const act=b.dataset.act;
  switch(act){
    case 'diag': startSession('diag','진단 테스트',DIAG_SET); break;
    case 'rec': { const w=weakTypes(); startSession('rec','추천 학습',recommendGroups(),{lesson:w[0]?w[0].type:null}); break; }
    case 'part': { const p=+b.dataset.part; const nq={2:10,3:6,4:6,5:12,6:4,7:7}[p]; startSession('part','Part '+p,groupsForPart(p,nq)); break; }
    case 'type': { const t=b.dataset.type; if(SES){ stopSpeech(); } startSession('type',TYPES[t].name,groupsForType(t)); break; }
    case 'group': startSession('one','문제',[b.dataset.gid]); break;
    case 'retry-wrong': { const lo=latestOutcome(); const gids=[...new Set(Object.values(lo).filter(r=>!r.correct&&QINDEX[r.qid]).map(r=>QINDEX[r.qid].gid))]; startSession('wrong','오답 다시 풀기',gids); break; }
    case 'retry-bm': startSession('bm','북마크',S.bookmarks.slice()); break;
    case 'unbm': S.bookmarks=S.bookmarks.filter(id=>id!==b.dataset.gid); persist(); renderNotes(); break;
    case 'go-analysis': showView('analysis'); break;
    case 'lesson': openLesson(b.dataset.type); break;
    case 'lesson-open': openLesson(b.dataset.type); break;
    case 'lesson-practice': startSession('type',TYPES[b.dataset.type].name,groupsForType(b.dataset.type)); break;
    case 'lesson-done': S.lessonsRead[SES.lesson]=Date.now(); persist(); SES.stage='q'; SES.qStart=Date.now(); renderQuiz(); $('#quiz').scrollTop=0; break;
    case 'quit': { if(SES && SES.stage==='q' && Object.keys(SES.ans).length && SES.idx<SES.gids.length){ finishSession(); } else endSession(); break; }
    case 'bm': { const id=SES.gids[SES.idx]; const i=S.bookmarks.indexOf(id); if(i>=0){S.bookmarks.splice(i,1); toast('책갈피 해제');} else {S.bookmarks.push(id); toast('책갈피에 저장했어요');} persist(); QSCROLL=$('#quiz').scrollTop; renderQuiz(); $('#quiz').scrollTop=QSCROLL; break; }
    case 'play': { const g=GINDEX[SES.gids[SES.idx]]; const done=g.qs.every(q=>SES.ans[q.id]); if(!done && (SES.played[g.id]||0)>=1){ toast('실전처럼 한 번만 들을 수 있어요. 답을 고른 뒤 다시 들으세요.'); break; } SES.played[g.id]=(SES.played[g.id]||0)+1; if(!done){ const b=document.querySelector('#quiz [data-act="play"]'); if(b) b.disabled=true; const t=document.querySelector('#quiz .audio .txt'); if(t) t.innerHTML='<b>실전처럼 한 번만</b><br><span class="muted">답을 고른 뒤에 다시 들을 수 있어요</span>'; } if(LC_AUDIO) playGroupAudio(g); else speakSeq(audioItems(g)); break; }
    case 'trtoggle': { const id=SES.gids[SES.idx]; SES.hideTr[id]=!SES.hideTr[id]; QSCROLL=$('#quiz').scrollTop; renderQuiz(); $('#quiz').scrollTop=QSCROLL; break; }
    case 'script': { const id=SES.gids[SES.idx]; SES.showScript[id]=!SES.showScript[id]; QSCROLL=$('#quiz').scrollTop; renderQuiz(); $('#quiz').scrollTop=QSCROLL; break; }
    case 'showtext': { const id=SES.gids[SES.idx]; SES.showText[id]=!SES.showText[id]; QSCROLL=$('#quiz').scrollTop; renderQuiz(); $('#quiz').scrollTop=QSCROLL; break; }
    case 'ans': answer(b.dataset.qid, +b.dataset.choice); break;
    case 'next': { stopSpeech(); if(SES.idx+1>=SES.gids.length) finishSession(); else { SES.idx++; SES.qStart=Date.now(); renderQuiz(); $('#quiz').scrollTop=0; } break; }
    case 'retry-session': { const gids=[...new Set(Object.keys(SES.ans).filter(id=>!SES.ans[id].correct).map(id=>QINDEX[id].gid))]; startSession('wrong','오답 다시 풀기',gids); break; }
    case 'ai-toggle': { const el=$('#ai-'+b.dataset.qid); el.hidden=!el.hidden; break; }
    case 'ai-ask': { const qid=b.dataset.qid; const q=QINDEX[qid], g=GINDEX[q.gid]; const out=$('#ai-out-'+qid); const userQ=$('#ai-in-'+qid).value.trim()||'이 문제를 더 자세히 설명해 줘.'; out.hidden=false; out.textContent='생각 중...'; b.disabled=true;
      const ctx = g.passage ? '지문:\n'+g.passage+'\n\n' : g.script ? '스크립트:\n'+scriptText(g)+'\n\n' : '';
      const prompt=`당신은 토익 강사입니다. 아래 문제에 대한 학생의 질문에 한국어로 간결하게(5문장 이내) 답하세요. 마크다운 굵게 표시는 쓰지 마세요.\n\n${ctx}문제: ${q.q||'(Part 2 응답 고르기)'}\n보기: ${q.opts.map((o,i)=>'('+L[i]+') '+o).join(' / ')}\n정답: (${L[q.ans]})\n기존 해설: ${q.exp}\n학생이 고른 답: (${L[SES.ans[qid].choice]})\n\n학생 질문: ${userQ}`;
      try{ const {text}=await SAMPLE(prompt,{modelTier:'quick',onText:({text})=>{out.textContent=text;}}); out.textContent=text; }catch(err){ out.textContent = err.code==='not_granted'?'AI 튜터 사용이 허용되지 않았습니다.':(err.text||'답변을 받지 못했어요. 잠시 후 다시 시도해 주세요.'); } b.disabled=false; break; }
    case 'ai-guide': askGuide(false); break;
    case 'ai-guide-auto': askGuide(true); break;
    case 'vocab': startVocabQuiz(VIEW==='notes'?10:5); break;
    case 'vocab10': startVocabQuiz(10); break;
    case 'vocab-flash': startVocabQuiz(10,true); break;
    case 'vlearn': { const w=b.dataset.word; const s=S.vocab[w]=S.vocab[w]||{n:0,c:0,learned:false}; s.learned=!s.learned; persist(); renderNotes(); break; }
    case 'vpick': { const i=+b.dataset.i; VQ.picked=i; const [w,,m]=VQ.items[VQ.idx]; const ok=VQ.opts[i]===m; if(ok) VQ.c++; vocabRecord(w,ok); renderVocab(); break; }
    case 'vnext': VQ.idx++; VQ.opts=null; VQ.picked=null; if(VQ.idx>=VQ.items.length) vocabResult(); else renderVocab(); break;
    case 'vflip': VQ.flipped=true; renderVocab(); break;
    case 'vflash-next': { const [w]=VQ.items[VQ.idx]; const ok=b.dataset.ok==='1'; if(ok) VQ.c++; vocabRecord(w,ok); VQ.idx++; VQ.flipped=false; if(VQ.idx>=VQ.items.length) vocabResult(); else renderVocab(); break; }
    case 'vquit': VQ=null; $('#quiz').hidden=true; document.body.style.overflow=''; renderAll(); break;
  }
});
document.addEventListener('keydown', e=>{
  if(!SES || SES.stage!=='q' || $('#quiz').hidden) return;
  const k=e.key.toUpperCase(); const i=L.indexOf(k);
  if(i>=0){ const btn=document.querySelector(`#quiz .opt[data-choice="${i}"]:not([disabled])`); if(btn) btn.click(); }
  if(e.key==='Enter'){ const n=document.querySelector('#quiz [data-act="next"]:not([disabled])'); if(n) n.click(); }
  if(e.key===' ' && GINDEX[SES.gids[SES.idx]].sec==='LC'){ e.preventDefault(); const p=document.querySelector('#quiz [data-act="play"]'); if(p) p.click(); }
});

// ===================== 시작 =====================
loadLocal(); renderAll(); initCaps();
</script>
</body></html>
