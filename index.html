{id:'p3-05',part:3,script:[["W","Thanks for calling Summit Travel. How can I help you?"],["M","Hi, I booked a flight to Denver for the sales conference next month, but my manager just told me the conference dates have changed. It's now the twelfth to the fourteenth instead of the fifth to the seventh."],["W","I see. Let me pull up your reservation... I can move your flights to those dates, but the fare is about eighty dollars higher for that week."],["M","That's fine—the company will cover it. Could you also check whether the hotel can change my reservation? I booked it through you as well."],["W","Of course. I'll contact the hotel and send you a confirmation e-mail by the end of the day."]],
 qs:[{type:'p3_topic',err:20,q:"Why is the man calling?",opts:["To cancel a trip","To change travel dates","To request a refund","To book a conference room"],ans:1,exp:"'the conference dates have changed' + 'move your flights to those dates' → 여행 날짜 변경."},
 {type:'p3_detail',err:35,q:"What does the woman say about the new flights?",opts:["They are fully booked.","They cost more.","They depart earlier.","They require a layover."],ans:1,exp:"'the fare is about eighty dollars higher' → 요금이 더 비쌈(cost more)."},
 {type:'p3_next',err:30,q:"What will the woman do next?",opts:["Call a hotel","Issue a refund","Print a ticket","Speak with a manager"],ans:0,exp:"마지막 대사 'I'll contact the hotel' → contact = call."}]},
{id:'p3-06',part:3,script:[["M","Hi, Rachel. I wanted to talk to you about the schedule for next week. We're short-staffed on Saturday night because two servers requested the day off."],["W","I could take the Saturday shift, but I'm already scheduled for Friday night and Sunday brunch. That would be three days in a row."],["M","I know it's a lot to ask. If you take Saturday, I can give you Wednesday off instead, and you'd get the weekend bonus rate."],["W","In that case, I'll do it. Should I let Carlos know that he doesn't need to cover for me on Wednesday?"],["M","I'll take care of that. Thanks, Rachel."]],
 qs:[{type:'p3_topic',err:25,q:"Where do the speakers most likely work?",opts:["At a hotel","At a restaurant","At a hospital","At a retail store"],ans:1,exp:"servers(서빙 직원), Sunday brunch → 식당. 직업·장소는 어휘 조합으로 추론합니다."},
 {type:'p3_intent',err:50,q:"Why does the woman say, \"That would be three days in a row\"?",opts:["To express a concern","To confirm a schedule","To request a promotion","To decline a bonus"],ans:0,exp:"토요일 근무 요청에 '그러면 3일 연속'이라고 말한 것은 부담을 표현(concern)하는 것. 뒤에 조건(수요일 휴무)을 받고 수락한 흐름이 근거."},
 {type:'p3_detail',err:35,q:"What does the man offer the woman?",opts:["A different day off","A pay raise","Additional training","An earlier shift"],ans:0,exp:"'I can give you Wednesday off instead' → 대체 휴무일. bonus rate는 '급여 인상(raise)'이 아니라 주말 수당."}]},
{id:'p3-07',part:3,script:[["W","Hello, IT help desk. This is Dana."],["M","Hi, Dana. This is Kevin in Accounting. I can't log in to the expense system. It keeps saying my password has expired, but I changed it just two weeks ago."],["W","That's strange. Oh—I see the problem. The system was upgraded over the weekend, and everyone has to reset their password once more after the upgrade. There was an e-mail about it on Friday."],["M","I must have missed it. So how do I reset it?"],["W","Click \"Forgot password\" on the login page, and you'll get a link by e-mail. If it doesn't arrive within ten minutes, call me back and I'll reset it manually."]],
 qs:[{type:'p3_topic',err:20,q:"What problem does the man have?",opts:["He lost his ID card.","He cannot access a system.","His computer is slow.","He received a wrong invoice."],ans:1,exp:"'I can't log in to the expense system' → 시스템 접근 불가. log in → access 패러프레이즈."},
 {type:'p3_detail',err:30,q:"According to the woman, what caused the problem?",opts:["A system upgrade","A typing error","A power outage","An expired account"],ans:0,exp:"'The system was upgraded over the weekend, and everyone has to reset their password' → 업그레이드가 원인."},
 {type:'p3_next',err:35,q:"What does the woman tell the man to do?",opts:["Restart his computer","Visit the IT office","Use a link on the login page","Contact his manager"],ans:2,exp:"'Click Forgot password on the login page, and you'll get a link' → 로그인 페이지의 링크 이용. 전화는 10분 내 안 올 때의 대안."}]},
{id:'p3-08',part:3,script:[["M","Priya, did you get a chance to look at the two logo designs the agency sent for the spring campaign?"],["W","I did. I prefer the second one—the colors match our packaging better. But the font is hard to read when it's small, like on social media icons."],["M","I had the same thought. Why don't we ask them to keep the second design but try a bolder font?"],["W","Sounds good. The agency said they need final feedback by Wednesday, so could you e-mail them today? I have client meetings all afternoon."],["M","Sure, I'll do it right after lunch."]],
 qs:[{type:'p3_topic',err:20,q:"What are the speakers discussing?",opts:["A hiring decision","A logo design","A product price","A client complaint"],ans:1,exp:"첫 대사 'the two logo designs the agency sent'."},
 {type:'p3_detail',err:30,q:"What does the woman like about the second design?",opts:["Its size","Its font","Its colors","Its cost"],ans:2,exp:"'the colors match our packaging better'. 폰트(B)는 오히려 불만 사항."},
 {type:'p3_next',err:28,q:"What will the man do after lunch?",opts:["Meet with clients","Send an e-mail","Visit the agency","Redesign a logo"],ans:1,exp:"'could you e-mail them today?' → 'I'll do it right after lunch'. 고객 미팅(A)은 여자의 일정."}]},

{id:'p4-04',part:4,script:[["M","Good morning, everyone, and welcome to the Harland Glassworks factory tour. My name is Oliver, and I'll be your guide for the next ninety minutes. We'll start in the furnace room, where you'll see our artisans shaping molten glass by hand, and then move on to the design studio and the packaging area. Please stay behind the yellow lines at all times—the furnaces reach over one thousand degrees. Photography is welcome everywhere except in the design studio, where we're working on products that haven't been released yet. At the end of the tour, you'll receive a voucher for twenty percent off anything in our gift shop. Now, please follow me."]],
 qs:[{type:'p4_topic',err:18,q:"Who most likely is the speaker?",opts:["A factory tour guide","A safety inspector","A glass artist","A store manager"],ans:0,exp:"'welcome to the ... factory tour ... I'll be your guide' → 공장 견학 가이드."},
 {type:'p4_detail',err:35,q:"What are listeners asked NOT to do in the design studio?",opts:["Touch the products","Take photographs","Talk loudly","Use their phones"],ans:1,exp:"'Photography is welcome everywhere except in the design studio' → 디자인 스튜디오에서는 사진 촬영 금지."},
 {type:'p4_detail',err:25,q:"What will listeners receive at the end of the tour?",opts:["A free sample","A discount voucher","A map","A certificate"],ans:1,exp:"'a voucher for twenty percent off' → 할인 쿠폰."}]},
{id:'p4-05',part:4,script:[["W","You're listening to Metro Radio, and here's your afternoon traffic update. Drivers heading downtown should avoid the Fifth Avenue Bridge, which is closed in both directions due to emergency repairs. City officials say the bridge is expected to reopen by Friday morning. In the meantime, use the Riverside Tunnel or Lincoln Boulevard as alternate routes. Also, the eastbound lanes of Highway 20 are moving slowly near exit 14 because of a stalled truck, but crews are on the scene and the lane should be cleared shortly. We'll have another update in thirty minutes. Now, back to the music."]],
 qs:[{type:'p4_topic',err:15,q:"What is the broadcast mainly about?",opts:["A weather forecast","Road conditions","A construction project","A music festival"],ans:1,exp:"'traffic update' → 도로 상황(road conditions). traffic → road 패러프레이즈."},
 {type:'p4_detail',err:25,q:"Why is the Fifth Avenue Bridge closed?",opts:["For a parade","Because of flooding","For emergency repairs","Because of an accident"],ans:2,exp:"'closed in both directions due to emergency repairs'. 트럭 고장(stalled truck)은 Highway 20 상황."},
 {type:'p4_detail',err:30,q:"When will the next update be given?",opts:["In ten minutes","In thirty minutes","In one hour","On Friday"],ans:1,exp:"'We'll have another update in thirty minutes'. Friday는 다리 재개통 시점."}]},
{id:'p4-06',part:4,script:[["M","Good evening, and thank you all for coming. Tonight we're here to honor this year's recipient of the Community Service Award, Ms. Elena Torres. Over the past five years, Ms. Torres has organized our annual food drive, which collected more than ten tons of food for local families last year alone. She has also recruited over two hundred volunteers for the city's literacy program. What makes her work remarkable is that she did all of this while running her own accounting firm. Ms. Torres, please come up to the stage to accept your award. And after her remarks, I invite everyone to join us for a reception in the garden."]],
 qs:[{type:'p4_topic',err:15,q:"What is the purpose of the talk?",opts:["To introduce a new employee","To present an award","To announce a fundraising goal","To open a new facility"],ans:1,exp:"'we're here to honor this year's recipient of the ... Award' → 시상."},
 {type:'p4_detail',err:40,q:"What does the speaker say is remarkable about Ms. Torres?",opts:["She moved to the city recently.","She has her own business.","She is a professional chef.","She won the award before."],ans:1,exp:"'she did all of this while running her own accounting firm' → 자기 사업체를 운영하면서 봉사. accounting firm → business."},
 {type:'p4_next',err:25,q:"What will happen after Ms. Torres speaks?",opts:["Dinner will be served.","A video will be shown.","A reception will be held.","Volunteers will be recognized."],ans:2,exp:"'after her remarks, I invite everyone to join us for a reception' → 리셉션."}]},

{id:'p5-51',part:5,qs:[{type:'p5_pos_n',err:22,q:"Mr. Delgado will give a brief ______ of the new safety procedures at tomorrow's meeting.",opts:["overview","overviewed","overviews","overviewing"],ans:0,exp:"a brief ___ of → 관사+형용사 뒤 단수 명사. a가 있으므로 복수형(C)은 불가."}]},
{id:'p5-52',part:5,qs:[{type:'p5_pos_n',err:20,q:"The ______ of the merger was announced to employees via e-mail.",opts:["complete","completion","completely","completed"],ans:1,exp:"The ___ of → 명사 자리. completion(완료)."}]},
{id:'p5-53',part:5,qs:[{type:'p5_pos_n',err:35,q:"Our ______ in the Asian market has grown substantially over the past decade.",opts:["present","presence","presently","presented"],ans:1,exp:"소유격 Our 뒤 + 동사 has grown의 주어 → 명사 presence(존재감, 입지). present는 형용사/동사/명사(선물)로 의미 불일치."}]},
{id:'p5-54',part:5,qs:[{type:'p5_pos_adj',err:22,q:"The committee praised the intern for her ______ attention to detail.",opts:["exception","exceptional","exceptionally","except"],ans:1,exp:"소유격 her와 명사 attention 사이 → 형용사 exceptional."}]},
{id:'p5-55',part:5,qs:[{type:'p5_pos_adj',err:40,q:"The results of the customer survey were ______ to the management team.",opts:["encourage","encouraged","encouraging","encouragement"],ans:2,exp:"be동사 뒤 보어. 주어가 사물(results)이고 '고무적인'(감정을 유발하는) 의미 → 현재분사 encouraging. 사람이 주어면 encouraged."}]},
{id:'p5-56',part:5,qs:[{type:'p5_pos_adv',err:18,q:"The product launch has been ______ delayed because of supply issues.",opts:["temporary","temporarily","temporaries","temporariness"],ans:1,exp:"has been ___ delayed: 조동사/be와 과거분사 사이 → 부사 temporarily."}]},
{id:'p5-57',part:5,qs:[{type:'p5_pos_adv',err:25,q:"Employees are reminded to lock their computers ______ when leaving their desks.",opts:["secure","security","securely","secured"],ans:2,exp:"lock their computers(완전한 구) 뒤에서 동사를 수식 → 부사 securely."}]},
{id:'p5-58',part:5,qs:[{type:'p5_pos_adv',err:30,q:"The factory's output has ______ doubled since the new equipment was installed.",opts:["near","nearly","nearness","nearing"],ans:1,exp:"has ___ doubled: 조동사와 과거분사 사이 → 부사. nearly(거의)."}]},
{id:'p5-59',part:5,qs:[{type:'p5_tense',err:20,q:"The marketing director ______ the new campaign at the shareholders' meeting last Tuesday.",opts:["presents","presented","has presented","will present"],ans:1,exp:"last Tuesday → 과거시제."}]},
{id:'p5-60',part:5,qs:[{type:'p5_tense',err:35,q:"If the shipment ______ by Friday, please contact our logistics department.",opts:["will not arrive","does not arrive","did not arrive","not arriving"],ans:1,exp:"조건 부사절(If ~)에서는 현재시제가 미래를 대신 → does not arrive. will은 조건절에 쓰지 않음."}]},
{id:'p5-61',part:5,qs:[{type:'p5_tense',err:45,q:"The number of online orders ______ significantly during the holiday season.",opts:["increase","increases","are increasing","have increased"],ans:1,exp:"The number of + 복수명사는 단수 취급(주어는 number) → increases. A number of(많은)는 복수 취급 — 자주 틀리는 구분."}]},
{id:'p5-62',part:5,qs:[{type:'p5_voice',err:25,q:"All visitors ______ to wear identification badges while in the building.",opts:["ask","are asked","asking","have asked"],ans:1,exp:"be asked to V(~하도록 요청받다). 방문객은 요청을 받는 쪽 → 수동태."}]},
{id:'p5-63',part:5,qs:[{type:'p5_voice',err:22,q:"The documents ______ to the legal department for review yesterday.",opts:["sent","were sent","have sent","sending"],ans:1,exp:"목적어 없이 to ~가 이어지고 서류는 '보내지는' 대상 → 수동태. yesterday → 과거."}]},
{id:'p5-64',part:5,qs:[{type:'p5_prep',err:35,q:"The conference will take place ______ the week of November 10.",opts:["during","while","at","along"],ans:0,exp:"명사구(the week ~) 앞 '~동안' → 전치사 during. while은 접속사."}]},
{id:'p5-65',part:5,qs:[{type:'p5_prep',err:25,q:"Mr. Chen has been working for the company ______ 2015.",opts:["for","since","from","during"],ans:1,exp:"현재완료진행 + 시작 시점(2015) → since. for 뒤에는 기간(for ten years)."}]},
{id:'p5-66',part:5,qs:[{type:'p5_prep',err:40,q:"The new policy applies to all employees ______ exception.",opts:["with","without","except","beyond"],ans:1,exp:"without exception(예외 없이) 관용구. except는 '~을 제외하고'로 뒤에 제외 대상이 와야 함."}]},
{id:'p5-67',part:5,qs:[{type:'p5_conj',err:45,q:"______ the contract has been signed, the construction work can begin.",opts:["Now that","In spite of","Due to","As a result"],ans:0,exp:"절(the contract has been signed) 앞 → 접속사. '~이므로 이제' Now that. 나머지는 전치사/접속부사."}]},
{id:'p5-68',part:5,qs:[{type:'p5_conj',err:40,q:"The product was recalled ______ several customers reported safety problems.",opts:["because of","due to","after","despite"],ans:2,exp:"절 앞이므로 접속사만 가능 → after(~한 뒤에). because of/due to/despite는 전치사."}]},
{id:'p5-69',part:5,qs:[{type:'p5_rel',err:45,q:"The warehouse ______ the company stores its inventory is located outside the city.",opts:["which","where","what","whom"],ans:1,exp:"빈칸 뒤가 완전한 절(the company stores its inventory) → 관계부사 where. which는 뒤가 불완전해야 함."}]},
{id:'p5-70',part:5,qs:[{type:'p5_rel',err:22,q:"Customers ______ purchase more than $100 of merchandise will receive free shipping.",opts:["who","whose","which","whom"],ans:0,exp:"선행사 Customers(사람) + 빈칸 뒤 동사(purchase) → 주격 who."}]},
{id:'p5-71',part:5,qs:[{type:'p5_pron',err:18,q:"Employees should contact Ms. Ruiz if they have questions about ______ benefits.",opts:["they","them","their","theirs"],ans:2,exp:"명사 benefits 앞 → 소유격 their."}]},
{id:'p5-72',part:5,qs:[{type:'p5_pron',err:50,q:"Mr. Patel's design was selected because it was more innovative than ______ of the other candidates.",opts:["that","those","these","them"],ans:1,exp:"비교 대상 '다른 후보들의 디자인들(designs)'을 대신하는 지시대명사. 복수 → those (of ~). 단수면 that of."}]},
{id:'p5-73',part:5,qs:[{type:'p5_vocab_v',err:30,q:"The hotel ______ a complimentary shuttle service to and from the airport.",opts:["provides","produces","proceeds","protects"],ans:0,exp:"provide a service(서비스를 제공하다)."}]},
{id:'p5-74',part:5,qs:[{type:'p5_vocab_v',err:32,q:"Please ______ your supervisor immediately if you notice any safety hazards.",opts:["notify","notice","note","notion"],ans:0,exp:"notify + 사람(~에게 알리다). notice는 '알아차리다', note는 '유의하다', notion은 명사."}]},
{id:'p5-75',part:5,qs:[{type:'p5_vocab_v',err:42,q:"The company has ______ a new policy to reduce paper waste.",opts:["implemented","impressed","imported","improved"],ans:0,exp:"implement a policy(정책을 시행하다). improve는 '개선하다'로 new policy와 어색."}]},
{id:'p5-76',part:5,qs:[{type:'p5_vocab_v',err:48,q:"Ms. Alvarez will ______ as interim director until a permanent replacement is found.",opts:["serve","save","seek","settle"],ans:0,exp:"serve as(~로서 일하다, 역할을 하다). serve as interim director = 임시 이사로 재직하다."}]},
{id:'p5-77',part:5,qs:[{type:'p5_vocab_n',err:45,q:"Employees must obtain ______ from their manager before purchasing new equipment.",opts:["authorization","authority","author","authorize"],ans:0,exp:"obtain authorization(허가를 받다). authority는 '권한·당국'으로 obtain과 어울리지 않음."}]},
{id:'p5-78',part:5,qs:[{type:'p5_vocab_n',err:35,q:"The company's annual ______ has increased by 15 percent compared to last year.",opts:["revenue","receipt","review","reward"],ans:0,exp:"annual revenue(연 매출). 숫자 증가와 어울리는 명사."}]},
{id:'p5-79',part:5,qs:[{type:'p5_vocab_n',err:25,q:"Please keep a copy of your ______ in case you need to return the item.",opts:["receipt","recipe","reception","receiver"],ans:0,exp:"return the item(반품)과 연결되는 receipt(영수증). recipe(조리법)와 철자 혼동 주의."}]},
{id:'p5-80',part:5,qs:[{type:'p5_vocab_adj',err:45,q:"Only employees with ______ training are permitted to operate the forklift.",opts:["proper","prompt","partial","previous"],ans:0,exp:"proper training(적절한 교육). 안전 장비 조작 자격 문맥. previous(이전의)는 '교육을 받았으면'의 의미로 쓰려면 다른 구조 필요."}]},
{id:'p5-81',part:5,qs:[{type:'p5_vocab_adj',err:35,q:"The museum is ______ closed for renovations and will reopen in May.",opts:["currently","lately","formerly","usually"],ans:0,exp:"currently(현재) closed + will reopen. lately는 현재완료와, formerly는 과거와 쓰임."}]},
{id:'p5-82',part:5,qs:[{type:'p5_vocab_adj',err:55,q:"The two laptops are ______ identical except for the screen size.",opts:["virtually","closely","highly","severely"],ans:0,exp:"virtually identical(사실상 동일한) 연어. highly는 recommended/successful 등과, closely는 related/monitored 등과 어울림."}]},
{id:'p5-83',part:5,qs:[{type:'p5_inf',err:30,q:"Ms. Nakamura was pleased ______ that her proposal had been accepted.",opts:["learn","learning","to learn","learned"],ans:2,exp:"감정 형용사(pleased, happy, glad) + to V(~해서). be pleased to learn that ~."}]},
{id:'p5-84',part:5,qs:[{type:'p5_inf',err:35,q:"We look forward to ______ you at the annual conference.",opts:["see","seeing","be seen","have seen"],ans:1,exp:"look forward to의 to는 전치사 → 동명사 seeing. be committed to V-ing, be used to V-ing도 같은 패턴."}]},
{id:'p5-85',part:5,qs:[{type:'p5_comp',err:25,q:"The new office is ______ to the train station than the old one was.",opts:["close","closer","closest","more closely"],ans:1,exp:"than이 있으므로 비교급 closer. be동사 보어 자리이므로 부사 비교급(D)은 불가."}]},
{id:'p5-86',part:5,qs:[{type:'p5_comp',err:20,q:"This is the ______ sales quarter the company has had in five years.",opts:["good","better","best","well"],ans:2,exp:"the + 최상급 + (that) S has had in + 기간 → the best."}]},

// ---------- Part 6 ----------
{id:'p6-04',part:6,passage:"MEMO\nTo: Sales Department\nFrom: Grace Lin, Director of Sales\nDate: September 2\nRe: New expense reporting procedure\n\nBeginning October 1, all expense reports must be submitted through the new online portal ___(1)___ the paper forms we have used in the past. The portal allows you to upload photos of receipts directly from your phone, which should make the process considerably faster. ___(2)___ Reports submitted after the 5th of the following month will not be ___(3)___.\n\nA thirty-minute training session on the new system will be held on September 20 in Conference Room B. Attendance is strongly ___(4)___, especially for staff who travel frequently.\n\nPlease contact me if you have any questions.",
 qs:[{type:'p6_vocab',err:40,q:"(1)",opts:["instead of","in addition to","according to","as well as"],ans:0,exp:"새 포털로 제출 '종이 양식 대신' → instead of. in addition to/as well as는 둘 다 쓰라는 뜻이 되어 must를 포함한 문맥과 충돌."},
 {type:'p6_insert',err:55,q:"(2)",opts:["Please note that the submission deadline has not changed.","The sales team exceeded its targets last quarter.","Paper forms are available at the reception desk.","The portal will be shut down for maintenance next week."],ans:0,exp:"뒤 문장이 '다음 달 5일 이후 제출분은 ~'이라며 마감을 다루므로, 마감 기한을 언급하는 (A)가 연결 고리. (C)는 종이 양식 폐지 내용과 모순."},
 {type:'p6_gram',err:35,q:"(3)",opts:["reimbursed","reimburse","reimbursing","reimbursement"],ans:0,exp:"will not be + p.p.(수동). 늦게 제출된 보고서는 '환급되지' 않는다 → reimbursed."},
 {type:'p6_vocab',err:30,q:"(4)",opts:["recommended","prohibited","completed","delivered"],ans:0,exp:"Attendance is strongly recommended(참석을 강력히 권장) 관용 표현. 특히 출장 잦은 직원에게 → 권장 문맥."}]},
{id:'p6-05',part:6,passage:"Dear Valued Customer,\n\nWe are pleased to announce that Northbridge Bank's Main Street branch ___(1)___ to a larger location at 45 Commerce Plaza on March 15. The new branch will feature extended weekday hours, additional teller windows, and a dedicated area for small business services. ___(2)___\n\nYour account numbers, online banking login, and debit cards will remain the same. ___(3)___, our safe deposit boxes will be moved to the new location during the weekend of March 13, and access will be unavailable on those two days.\n\nWe ___(4)___ this temporary disruption and look forward to serving you at our new home.\n\nSincerely,\nMarcus Webb\nBranch Manager",
 qs:[{type:'p6_gram',err:40,q:"(1)",opts:["relocated","will relocate","has relocated","relocating"],ans:1,exp:"on March 15라는 앞으로의 날짜 + 'The new branch will feature' → 미래시제 will relocate. 아직 이전 전임을 전체 문맥이 보여 줍니다."},
 {type:'p6_insert',err:55,q:"(2)",opts:["Parking will also be free for customers in the attached garage.","The branch has been open since 1985.","Please bring two forms of identification to open an account.","We regret that the branch will close permanently."],ans:0,exp:"앞 문장이 새 지점의 장점을 나열 → 'also'로 장점을 하나 더 추가하는 (A). (D)는 이전(relocate) 내용과 모순."},
 {type:'p6_connector',err:40,q:"(3)",opts:["However","Similarly","In short","Likewise"],ans:0,exp:"앞: 계좌·카드는 그대로 ↔ 뒤: 대여금고는 이동하며 이용 불가 → 역접 However."},
 {type:'p6_vocab',err:30,q:"(4)",opts:["regret","deny","celebrate","suspect"],ans:0,exp:"We regret this temporary disruption(불편을 드려 유감입니다) 서신 관용구."}]},

// ---------- Part 7 ----------
{id:'p7-06',part:7,passage:"NOTICE TO ALL TENANTS — Oakwood Business Park\n\nBeginning Monday, July 8, the main parking garage will undergo resurfacing. The work will take approximately three weeks and will be done one level at a time, starting with Level 3. While a level is closed, tenants assigned to that level may park in the overflow lot behind Building C. A shuttle will run between the overflow lot and the main entrance every fifteen minutes from 7:00 A.M. to 7:00 P.M.\n\nTenants who need to access the garage outside these hours should contact the property office at extension 400 to arrange a temporary access card. We apologize for the inconvenience and thank you for your patience.\n\n— Oakwood Property Management",
 qs:[{type:'p7_main',err:20,q:"What is the purpose of the notice?",opts:["To announce a change in rent","To inform tenants about construction work","To introduce a new shuttle route","To request feedback about parking"],ans:1,exp:"'the main parking garage will undergo resurfacing' → 공사 안내. 셔틀은 부수 정보."},
 {type:'p7_detail',err:20,q:"According to the notice, how often will the shuttle run?",opts:["Every 5 minutes","Every 15 minutes","Every 30 minutes","Every hour"],ans:1,exp:"'every fifteen minutes'."},
 {type:'p7_infer',err:45,q:"What is suggested about the parking garage?",opts:["It has more than one level.","It is closed on weekends.","It will be demolished.","It is located behind Building C."],ans:0,exp:"'one level at a time, starting with Level 3' → 여러 층이 있음을 추론. Building C 뒤는 임시 주차장(overflow lot)."}]},
{id:'p7-07',part:7,passage:"[지문 1 — 이메일]\nFrom: Hannah Weiss <hweiss@claritybooks.com>\nTo: Workshop Participants\nSubject: Writing Workshop — Final Schedule\nDate: April 2\n\nDear participants,\n\nAttached is the final schedule for the Spring Writing Workshop on April 12. Please note one change from the draft I sent last week: the session on self-publishing has been moved to the afternoon because the presenter, Mr. Okafor, has a conflict in the morning. Lunch will be provided in the lobby, and all sessions will take place in Room 210 unless otherwise noted. If you cannot attend, please let me know by April 9 so that I can offer your seat to someone on the waiting list.\n\nBest,\nHannah Weiss\n\n[지문 2 — 일정표]\nSPRING WRITING WORKSHOP — April 12 — Clarity Books, Room 210\n9:00–10:15    Finding Your Voice — Lydia Chen\n10:30–11:45   Editing Your Own Work — Paul Grant\n11:45–12:45   Lunch (Lobby)\n12:45–2:00    Self-Publishing Today — David Okafor\n2:15–3:30     Working with Literary Agents — Maria Sousa (Room 305)",
 qs:[{type:'p7_main',err:20,q:"Why did Ms. Weiss send the e-mail?",opts:["To cancel a workshop","To provide a schedule","To request payment","To introduce a new presenter"],ans:1,exp:"'Attached is the final schedule' → 일정 제공."},
 {type:'p7_detail',err:35,q:"Which session was originally scheduled for the morning?",opts:["Finding Your Voice","Editing Your Own Work","Self-Publishing Today","Working with Literary Agents"],ans:2,exp:"이중 지문 연계: 이메일 'the session on self-publishing has been moved to the afternoon' + 일정표의 'Self-Publishing Today' → 원래 오전이었던 세션."},
 {type:'p7_detail',err:30,q:"Where will Ms. Sousa's session be held?",opts:["In the lobby","In Room 210","In Room 305","At a bookstore"],ans:2,exp:"일정표의 'Maria Sousa (Room 305)' — 이메일의 'unless otherwise noted'가 예외를 예고."},
 {type:'p7_detail',err:20,q:"By when should participants notify Ms. Weiss if they cannot attend?",opts:["April 2","April 9","April 12","April 15"],ans:1,exp:"'please let me know by April 9'. April 2는 발신일, April 12는 행사일."}]},
{id:'p7-08',part:7,passage:"Tech Firm to Open Research Center in Busan\n\nBUSAN (June 3)—Veltron Systems, a maker of industrial sensors, announced yesterday that it will open a research and development center in Busan early next year. The facility, which will employ about 120 engineers, will focus on sensors for self-driving vehicles.\n\nChief Executive Officer Hana Sato said the city was chosen for its proximity to several automobile manufacturers and its strong engineering universities. \"We looked at four cities,\" Ms. Sato said. \"Busan offered the best combination of talent and partners.\"\n\nThe company currently has research centers in Osaka and Munich. Ms. Sato said the Busan center would collaborate closely with the Osaka team, which developed Veltron's first-generation vehicle sensors in 2019. Construction of the new building is scheduled to begin in August, and the company plans to begin hiring in the fall.",
 qs:[{type:'p7_main',err:18,q:"What is the article mainly about?",opts:["A company's plan to open a new facility","A new product launch","A change in company leadership","A merger between two tech firms"],ans:0,exp:"제목과 첫 문장: 'will open a research and development center'."},
 {type:'p7_detail',err:30,q:"According to Ms. Sato, why was Busan chosen?",opts:["Because of low operating costs","Because of its location near carmakers and universities","Because the company's headquarters are there","Because the city offered tax incentives"],ans:1,exp:"'chosen for its proximity to several automobile manufacturers and its strong engineering universities'."},
 {type:'p7_detail',err:28,q:"What will happen in August?",opts:["The center will open.","Hiring will begin.","Construction will start.","Ms. Sato will visit Busan."],ans:2,exp:"'Construction ... is scheduled to begin in August'. 채용은 가을, 개소는 내년 초."},
 {type:'p7_syn',err:45,q:"The word \"proximity\" in paragraph 2, line 1, is closest in meaning to",opts:["nearness","similarity","popularity","distance"],ans:0,exp:"proximity to = ~에 가까움(nearness). 자동차 제조사 '근처'라는 문맥."}]},
{id:'p7-09',part:7,passage:"Ben Okoro (2:05 P.M.)\nHi Laura, the client moved our presentation from Thursday to tomorrow morning. Can we still get the sample boards done in time?\n\nLaura Kim (2:07 P.M.)\nTomorrow morning? That's tight. The print shop said the large boards wouldn't be ready until Thursday.\n\nBen Okoro (2:08 P.M.)\nWhat if we present with the digital version and bring the boards to the follow-up meeting?\n\nLaura Kim (2:10 P.M.)\nThat could work. I'll call the print shop and see if they can at least do the two small boards by tonight.\n\nBen Okoro (2:11 P.M.)\nGreat. I'll update the slides and send them to you by five.",
 qs:[{type:'p7_detail',err:25,q:"What is the problem?",opts:["A client canceled a meeting.","A presentation has been moved earlier.","The print shop lost an order.","A file cannot be opened."],ans:1,exp:"'the client moved our presentation from Thursday to tomorrow morning' → 발표가 앞당겨짐."},
 {type:'p7_intent',err:45,q:"At 2:10 P.M., what does Ms. Kim most likely mean when she writes, \"That could work\"?",opts:["She agrees to present without the large boards.","She thinks the print shop will finish on time.","She wants to reschedule the follow-up meeting.","She prefers the printed version."],ans:0,exp:"바로 앞 제안 '디지털 버전으로 발표하고 보드는 후속 회의에 가져가자'에 대한 동의."},
 {type:'p7_detail',err:20,q:"What will Mr. Okoro do by 5:00 P.M.?",opts:["Call the client","Visit the print shop","Send updated slides","Pick up the boards"],ans:2,exp:"'I'll update the slides and send them to you by five'."}]},
{id:'p7-10',part:7,passage:"INVOICE — Bluewater Catering\nInvoice #4471    Date: May 20    Due: June 3\nBill to: Pinecrest Dental Group, 88 Oak Street\nEvent: Staff appreciation lunch, May 18\n\nItem                                  Qty   Unit     Total\nSandwich platters (serves 10)          4    $45.00   $180.00\nGarden salad (large)                   2    $28.00    $56.00\nAssorted desserts (serves 10)          3    $35.00   $105.00\nBeverage service (coffee, tea, water)  1    $60.00    $60.00\nDelivery and setup                                    $40.00\nSubtotal                                             $441.00\nDiscount (repeat customer, 10%)                      -$44.10\nTotal due                                            $396.90\n\nPayment by check or bank transfer. A late fee of 2% applies to balances unpaid after the due date. Thank you for choosing Bluewater Catering!",
 qs:[{type:'p7_detail',err:22,q:"When was the event held?",opts:["May 18","May 20","June 3","June 5"],ans:0,exp:"'Event: Staff appreciation lunch, May 18'. May 20은 청구서 발행일, June 3은 납기."},
 {type:'p7_not',err:35,q:"What is NOT included on the invoice?",opts:["A delivery charge","A discount","A tip for staff","Beverages"],ans:2,exp:"Delivery and setup(A), Discount(B), Beverage service(D)는 모두 항목에 있음. 팁(tip)은 없음."},
 {type:'p7_infer',err:40,q:"What is suggested about Pinecrest Dental Group?",opts:["It has used Bluewater Catering before.","It paid the invoice late.","It has more than 40 employees.","It ordered extra desserts."],ans:0,exp:"'Discount (repeat customer, 10%)' → 이전에도 이용한 고객임을 추론."}]}
);

<script>
// ===================== 추가 문제 2차 =====================
BANK.push(
{id:'p2-31',part:2,script:"Who is leading the safety training on Thursday?",qs:[{type:'p2_wh',err:20,opts:["It starts at nine o'clock.","Ms. Alvarez from Human Resources.","Yes, I'll be there."],ans:1,exp:"Who 의문문은 사람으로 답합니다. (A)는 When(시간)에 대한 답이고, (C)처럼 의문사 의문문에는 Yes/No로 답할 수 없습니다."}]},
{id:'p2-32',part:2,script:"When will the new printer be delivered?",qs:[{type:'p2_wh',err:38,opts:["The supplier hasn't confirmed yet.","Next to the copy room.","It prints in color, too."],ans:0,exp:"배송 시점을 묻는 질문에 '공급업체가 아직 확인해 주지 않았다'는 우회 응답이 정답입니다. (B)는 Where에 대한 답, (C)는 printer에서 연상되는 prints를 이용한 함정입니다."}]},
{id:'p2-33',part:2,script:"Why was the product launch postponed?",qs:[{type:'p2_wh',err:28,opts:["In the main auditorium.","About two weeks ago.","The packaging isn't ready yet."],ans:2,exp:"Why 의문문에는 이유로 답합니다. (A)는 장소, (B)는 시점으로 각각 Where/When에 대한 답이며, 연기의 이유를 설명하는 (C)가 정답입니다."}]},
{id:'p2-34',part:2,script:"How many guests have registered for the awards dinner?",qs:[{type:'p2_wh',err:40,opts:["At the Riverside Hotel.","Let me check the spreadsheet.","It was a wonderful evening."],ans:1,exp:"숫자를 묻는 How many 질문에 '확인해 보겠다'는 우회 응답이 정답입니다. (A)는 장소 답변, (C)는 dinner에서 연상되는 evening을 이용한 함정입니다."}]},
{id:'p2-35',part:2,script:"Where can I find the shipping labels?",qs:[{type:'p2_wh',err:18,opts:["In the top drawer of the supply cabinet.","Yes, they shipped yesterday.","Only about five dollars."],ans:0,exp:"Where 의문문은 장소로 답합니다. (B)는 shipping과 발음이 비슷한 shipped를 반복한 함정이며 의문사 의문문에 Yes로 답할 수 없고, (C)는 How much에 대한 답입니다."}]},

{id:'p3-10',part:3,script:[["M","Good morning. I'm checking in for the ten forty-five flight to Denver. Here's my passport."],["W","Thank you, Mr. Okafor. I see you're booked in seat 14C. Will you be checking any bags today?"],["M","Just this one suitcase. Actually, I was hoping to get an aisle seat closer to the front. I have a connecting flight in Denver with only fifty minutes between flights."],["W","Let me look. Row fourteen is already fairly close to the front. The only aisle seats ahead of that are in the extra-legroom section, and those cost an additional forty dollars."],["M","Fifty minutes is tight, though. I'll take it."],["W","All right, your new seat is 6C. I'll also add a note to your booking about the tight connection, so the crew can let you off first if the flight is delayed."]],qs:[

 {type:'p3_next',err:48,q:"What does the woman say she will do?",opts:["Make a note on the man's reservation","Check the man's suitcase for free","Upgrade the man to business class","Contact the airline in Denver"],ans:0,exp:"'I'll also add a note to your booking about the tight connection'을 'Make a note on the man's reservation'으로 패러프레이즈한 (A)가 정답. 좌석은 extra-legroom 구역으로 바뀐 것이지 비즈니스석 업그레이드(C)가 아니며, 수하물 무료 위탁(B)은 언급되지 않습니다."}]},
{id:'p3-11',part:3,script:[["W","Hello, I have a two o'clock appointment with Dr. Lindqvist. My name is Beatriz Moreno."],["M","Welcome, Ms. Moreno. I see you're a new patient here, so I'll need you to fill out these two forms. One is your medical history, and the other is for your insurance information."],["W","Sure. Oh, I changed insurance providers last month. I don't have my new card with me, but I can find the policy number on my phone."],["M","That's fine. Just write down the policy number and the name of the provider, and we'll verify it. Also, the doctor is running about twenty minutes behind this afternoon."],["W","That's all right. Is there somewhere I can get a cup of coffee while I wait?"],["M","There's a café on the ground floor, right next to the elevators. I'll call your mobile as soon as the doctor is ready to see you."]],qs:[

 {type:'p3_detail',err:40,q:"What problem does the woman mention?",opts:["She arrived late for her appointment.","She forgot to bring her phone.","She does not have her insurance card.","She cannot find the doctor's office."],ans:2,exp:"'I don't have my new card with me'에서 새 보험 카드를 가져오지 않았다는 문제를 말합니다. 전화기는 갖고 있어 번호를 찾겠다고 했으므로 (B)는 오답이며, 지각(A)에 대한 언급도 없습니다."},
 {type:'p3_next',err:28,q:"What does the man say he will do?",opts:["Bring the woman a cup of coffee","Call the woman when the doctor is available","Reschedule the woman's appointment","Contact the insurance company"],ans:1,exp:"마지막 대사 'I'll call your mobile as soon as the doctor is ready to see you'가 단서로 (B)가 정답. 커피(A)는 여자가 직접 사러 가는 것이고, 보험 정보 확인(we'll verify it)은 보험사에 연락한다는 의미로 단정할 수 없습니다."}]},
