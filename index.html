{id:'p3-14',part:3,script:[["M","Hi, Ms. Alvarez, this is Tom from Greenfield Farms. I'm calling about tomorrow's delivery to your restaurant. Unfortunately, the heavy rain this week damaged a lot of our lettuce crop, so we can only send you half of what you ordered."],["W","Oh no. We have a large catering event on Saturday, and the salads are on the menu. Is there anything else you can send instead?"],["M","We have plenty of spinach and kale. They were grown in the greenhouse, so the rain didn't affect them. I could substitute those at the same price per kilo."],["W","Spinach would work. Let's do ten kilos of spinach in place of the missing lettuce."],["M","Got it. I'll update your invoice and send you the revised version this afternoon. And the delivery will still arrive by seven tomorrow morning, as usual."],["W","Perfect. Thank you for letting me know in advance."]],qs:[
 {type:'p3_topic',err:24,q:"Why is the man calling?",opts:["To report a problem with an order","To confirm a catering reservation","To introduce a new product line","To request payment for a delivery"],ans:0,exp:"'I'm calling about tomorrow's delivery ... we can only send you half of what you ordered'에서 주문 수량을 다 보낼 수 없다는 문제를 알리는 전화임을 알 수 있어 (A)가 정답. 케이터링 행사(B)는 여자의 상황이지 남자의 전화 목적이 아닙니다."},
 {type:'p3_detail',err:50,q:"What does the man say about the spinach?",opts:["It is cheaper than lettuce.","It was not damaged by the weather.","It will be delivered on Saturday.","It is only available in small quantities."],ans:1,exp:"'They were grown in the greenhouse, so the rain didn't affect them'이 단서. 시금치와 케일은 온실에서 재배되어 비 피해를 입지 않았다는 (B)가 정답. 가격은 '같은 가격'(same price)이므로 (A)는 오답, 수량은 'plenty'이므로 (D)도 오답입니다."},
 {type:'p3_next',err:44,q:"What will the man send the woman this afternoon?",opts:["A product catalog","A delivery schedule","A sample of kale","A revised invoice"],ans:3,exp:"'I'll update your invoice and send you the revised version this afternoon'에서 수정된 청구서를 보내겠다고 하므로 (D)가 정답. 배송 시간(seven tomorrow morning)은 기존과 같다고 말한 것이지 일정표를 보내는 것이 아닙니다."}]},
{id:'p4-07',part:4,script:[["M","Hello, this message is for Ms. Chandra at Weston Consulting. This is Luis from Apex Office Supply. I'm calling about Tuesday's order for twelve boxes of copy paper and two toner cartridges. The paper has shipped and should reach you tomorrow. However, the cartridges for your printer model are on back order from the manufacturer, and we don't expect them for another two weeks. We do have a compatible cartridge from a different brand in stock, which is actually about ten percent cheaper. If you'd like me to substitute those, please call me back at extension 204 before five o'clock today, and I'll make sure they go out with tomorrow's delivery. Otherwise, I'll keep the original cartridges on order and let you know when they arrive. Thanks."]],qs:[
 {type:'p4_topic',err:20,q:"What is the purpose of the message?",opts:["To request a payment","To provide an update on an order","To advertise a new printer","To confirm a meeting time"],ans:1,exp:"'I'm calling about the order you placed on Tuesday'에 이어 배송 현황과 품절 상황을 설명하므로 주문 관련 상황을 알리는 (B)가 정답. 결제 요청이나 회의 확인은 언급되지 않습니다."},
 {type:'p4_detail',err:42,q:"What does the speaker say about the alternative product?",opts:["It is made by the same manufacturer.","It will arrive in two weeks.","It costs less than the original.","It comes with a longer warranty."],ans:2,exp:"'a compatible cartridge from a different brand in stock, which is actually about ten percent cheaper'에서 대체품은 다른 브랜드이고 약 10% 저렴하다고 합니다. 따라서 (C)가 정답이며 (A)는 반대 내용. 2주(B)는 원래 제품의 입고 예상 시기입니다."},
 {type:'p4_next',err:48,q:"What does the speaker ask the listener to do?",opts:["Return his call by a certain time","Visit the store in person","Cancel the original order","Send a copy of the receipt"],ans:0,exp:"'please call me back at extension 204 before five o'clock today'가 요청 사항이므로 (A)가 정답. 주문 취소(C)가 아니라 대체품으로 바꿀지 여부를 알려 달라는 것이며, 답이 없으면 원래 주문을 유지하겠다고 합니다."}]},
{id:'p4-08',part:4,script:[["W","Have you ever wondered what city life was like two thousand years ago? This spring, the Riverside Museum of History invites you to find out. Our new exhibition, Streets of Ancient Rome, opens on April third and features over three hundred objects on loan from museums across Italy, many never before shown outside Europe. Walk through a full-size reconstruction of a Roman market, see coins, jewelry, and tools used by ordinary citizens, and try your hand at writing on a wax tablet. The exhibition runs through August thirty-first. Tickets are fifteen dollars for adults, and children under twelve get in free. And here's a tip: visit on a Wednesday evening, when the museum stays open until nine and admission is half price. Go to riversidemuseum.org to reserve your tickets today."]],qs:[
 {type:'p4_topic',err:16,q:"What is being advertised?",opts:["A guided tour of Italy","A history book","A documentary film","A museum exhibition"],ans:3,exp:"'the Riverside Museum of History', 'Our new exhibition, Streets of Ancient Rome, opens on April third'에서 박물관 특별전 광고임을 알 수 있으므로 (D)가 정답. 이탈리아는 전시품의 대여 출처일 뿐 여행 상품(A)이 아닙니다."},
 {type:'p4_detail',err:50,q:"What does the speaker say about Wednesday evenings?",opts:["Admission is reduced.","A lecture is given.","Children are not admitted.","The museum closes early."],ans:0,exp:"'visit on a Wednesday evening, when the museum stays open until nine and admission is half price'에서 수요일 저녁에는 입장료가 반값이라고 하므로 (A)가 정답. 9시까지 연장 개관하므로 일찍 닫는다는 (D)는 반대 내용입니다."},
 {type:'p4_next',err:26,q:"What does the speaker encourage listeners to do?",opts:["Call the museum for directions","Become a museum member","Reserve tickets online","Donate historical objects"],ans:2,exp:"마지막 문장 'Go to riversidemuseum.org to reserve your tickets today'에서 웹사이트를 통한 예매를 권유하므로 (C)가 정답. 회원 가입이나 기증은 언급되지 않습니다."}]},
{id:'p4-09',part:4,script:[["M","Before we end today's meeting, I want to update everyone on the second assembly line. The new packaging machine was installed last Friday, and the technicians finished calibrating it yesterday. Starting Monday, the line will run at full speed, which means we'll package about forty percent more units per shift than before. That's the good news. The challenge is that the machine uses a different size of carton, so the ones we have in the warehouse won't fit. I've already ordered the new cartons, but they won't arrive until Wednesday. So for the first two days of next week, the second line will package by hand, as we do now. Team leaders, please make sure your staff know about this. I'll send a memo this afternoon with the details."]],qs:[
 {type:'p4_topic',err:36,q:"Where most likely does the speaker work?",opts:["At a shipping company","At a grocery store","At a manufacturing plant","At an electronics retailer"],ans:2,exp:"'assembly line', 'packaging machine', 'units per shift', 'package by hand' 등 생산 라인 관련 어휘로 보아 제조 공장 (C)이 정답. carton(상자)이 언급되지만 배송 업체(A)의 담화는 아닙니다."},
 {type:'p4_detail',err:54,q:"What problem does the speaker mention?",opts:["A machine has not been installed yet.","Some supplies are the wrong size.","A technician is unavailable.","The warehouse is full."],ans:1,exp:"'the machine uses a different size of carton, so the ones we have in the warehouse won't fit'에서 보유 중인 상자 크기가 새 기계와 맞지 않는 문제를 말합니다. 이를 'supplies are the wrong size'로 패러프레이즈한 (B)가 정답. 기계는 이미 설치·조정이 끝났으므로 (A)는 오답입니다."},
 {type:'p4_next',err:25,q:"What will the speaker do this afternoon?",opts:["Inspect the assembly line","Order more cartons","Meet with the technicians","Distribute a memo"],ans:3,exp:"마지막 문장 'I'll send a memo this afternoon with the details'가 단서이므로 (D)가 정답. 상자 주문(B)은 이미 완료했다고(I've already ordered) 말했습니다."}]},
{id:'p4-10',part:4,script:[["W","Attention, passengers waiting on platform four for the three-fifteen express service to Northgate. Due to a signal problem near Elmwood Junction, this train has been delayed by approximately thirty-five minutes and is now expected to depart at three-fifty. We apologize for the inconvenience. Passengers who need to reach Northgate sooner may take the three twenty-five local service from platform two, which stops at all stations and arrives in Northgate at four-forty. Your express ticket will be accepted on that train. If you choose to wait for the express, please note that the café on the upper level is offering free hot drinks to delayed passengers. Just show your ticket at the counter. Once again, the three-fifteen express will now depart at three-fifty from platform four. Thank you for your patience."]],qs:[
 {type:'p4_topic',err:15,q:"Where is the announcement most likely being made?",opts:["At a train station","At an airport","At a bus terminal","On a ferry"],ans:0,exp:"'platform four', 'express service', 'this train has been delayed', 'stops at all stations' 등에서 기차역 안내 방송임을 알 수 있으므로 (A)가 정답입니다."},
 {type:'p4_detail',err:38,q:"What has caused the delay?",opts:["Bad weather","A staff shortage","Track maintenance","A signal problem"],ans:3,exp:"'Due to a signal problem near Elmwood Junction, this train has been delayed'에서 지연 원인이 신호 문제임을 직접 언급하므로 (D)가 정답. 날씨나 선로 정비는 언급되지 않습니다."},
 {type:'p4_next',err:49,q:"What are passengers who wait for the express train advised to do?",opts:["Move to platform two","Show their tickets at a café","Exchange their tickets at the counter","Board the train early"],ans:1,exp:"'If you choose to wait for the express ... the café on the upper level is offering free hot drinks ... Just show your ticket at the counter'에서 기다리는 승객은 카페에서 표를 보여 주면 무료 음료를 받을 수 있다고 하므로 (B)가 정답. 2번 승강장으로 이동(A)은 빨리 가고 싶은 승객을 위한 안내입니다."}]},
{id:'p4-11',part:4,script:[["W","Good morning, and welcome to Harlow Logistics. I'm Meredith Cho, the training coordinator, and I'll be with you for three days. This morning we'll start with a tour of the distribution center, so please put on one of the safety vests on the table by the door. After lunch, you'll receive your employee ID badges, which you'll need to enter the building from tomorrow onward. We'll spend the rest of the afternoon on our inventory software. Don't worry if you've never used it; we'll go through it step by step. Tomorrow and Thursday, you'll shadow an experienced team member in your department. One more thing: the handbook in your folder explains our shift-swap policy. Please read the section on page eight tonight, because we'll discuss it first thing tomorrow."]],qs:[
 {type:'p4_topic',err:18,q:"Who most likely are the listeners?",opts:["Warehouse customers","Software developers","New employees","Safety inspectors"],ans:2,exp:"'welcome to Harlow Logistics', 'I'm the training coordinator', 'you'll receive your employee ID badges', 'shadow an experienced team member'에서 청자들이 신입 직원임을 알 수 있으므로 (C)가 정답입니다."},
 {type:'p4_detail',err:45,q:"What will the listeners receive after lunch?",opts:["Safety vests","A software manual","Identification badges","A building map"],ans:2,exp:"'After lunch, you'll receive your employee ID badges'가 단서이므로 (C)가 정답. 안전 조끼(A)는 오전 견학 전에 착용하는 것이고, 소프트웨어는 교육을 받는 것이지 매뉴얼을 받는다는 언급은 없습니다."},
 {type:'p4_next',err:48,q:"What are the listeners asked to do tonight?",opts:["Choose a department","Submit a shift request","Complete an online course","Read part of a handbook"],ans:3,exp:"'Please read the section on page eight tonight'에서 핸드북의 특정 부분을 읽어 오라고 요청하므로 (D)가 정답. 교대 근무 교환 정책(shift-swap policy)은 읽을 내용의 주제이지 신청서(B)를 내라는 것이 아닙니다."}]},
{id:'p4-12',part:4,script:[["M","Welcome back to Business This Week. Our top story: Lumen Solar, the Arizona-based solar panel installer, reported that its revenue grew by thirty percent in the last quarter. The company credits the increase to a new financing program that lets homeowners pay for their panels in monthly installments instead of all at once. Since the program launched in January, the number of residential installations has nearly doubled. Lumen also announced plans to open three new service centers in Nevada by the end of the year, which will create roughly one hundred and fifty jobs. To learn more about how such programs work, Lumen's chief financial officer will be speaking at our free listener seminar on October twentieth. Seating is limited, so register on our website by Friday."]],qs:[
 {type:'p4_topic',err:37,q:"What is the report mainly about?",opts:["A change in government policy","A company's recent growth","A new type of solar panel","A merger between two companies"],ans:1,exp:"'its revenue grew by thirty percent', 'installations has nearly doubled', 'plans to open three new service centers' 등 한 회사의 성장 소식이 담화의 중심이므로 (B)가 정답. 신제품(C)이나 합병(D)은 언급되지 않습니다."},
 {type:'p4_detail',err:52,q:"According to the speaker, what led to the increase in installations?",opts:["A new payment option","A government subsidy","Lower material costs","A television advertising campaign"],ans:0,exp:"'a new financing program that lets homeowners pay ... in monthly installments'를 'A new payment option'으로 패러프레이즈한 (A)가 정답. 할부 프로그램이 설치 건수 증가의 원인이라고 명시하며, 보조금이나 광고는 언급되지 않습니다."},
 {type:'p4_next',err:46,q:"What does the speaker encourage listeners to do by Friday?",opts:["Apply for a job at Lumen Solar","Submit questions for an interview","Sign up for an event","Install solar panels at home"],ans:2,exp:"'our free listener seminar on October twentieth. Seating is limited, so register on our website by Friday'에서 세미나 등록을 권유하므로 (C)가 정답. 채용(A)은 뉴스 내용일 뿐 청취자에게 지원하라는 말은 없습니다."}]}
);
BANK.push(
{id:'p5-87',part:5,qs:[{type:'p5_pos_n',err:18,q:"The ______ of the new distribution center is scheduled for early March.",opts:["open","opened","opening","openly"],ans:2,exp:"정관사 The 뒤, 전치사 of 앞은 명사 자리입니다. '개장'을 뜻하는 명사 opening이 정답. open은 동사/형용사, opened는 과거형·과거분사, openly는 부사로 주어 자리에 올 수 없습니다."}]},
{id:'p5-88',part:5,qs:[{type:'p5_pos_n',err:30,q:"In ______ with safety regulations, all visitors must wear a hard hat inside the plant.",opts:["comply","compliance","compliant","complied"],ans:1,exp:"전치사 In 뒤에는 명사가 와야 하며 'in compliance with(~을 준수하여)'는 토익 빈출 관용표현입니다. comply는 동사, compliant는 형용사, complied는 동사의 과거형이므로 전치사의 목적어가 될 수 없습니다."}]},
{id:'p5-89',part:5,qs:[{type:'p5_pos_n',err:40,q:"Ms. Alvarez has shown remarkable ______ in handling customer complaints.",opts:["patient","patiently","patients","patience"],ans:3,exp:"타동사 shown의 목적어이자 형용사 remarkable의 수식을 받는 명사 자리입니다. patients(환자들)도 명사이지만 '불만 처리에서 인내심을 보였다'는 문맥상 추상명사 patience가 정답. patient는 형용사(또는 '환자'), patiently는 부사입니다."}]},
{id:'p5-90',part:5,qs:[{type:'p5_pos_n',err:15,q:"Employees should direct any questions about the revised travel policy to their ______.",opts:["supervisors","supervise","supervisory","supervised"],ans:0,exp:"소유격 their 뒤는 명사 자리이므로 '상사'를 뜻하는 supervisors가 정답입니다. supervise는 동사, supervisory는 형용사, supervised는 과거형·과거분사로 소유격 뒤에 올 수 없습니다."}]},
{id:'p5-91',part:5,qs:[{type:'p5_pos_n',err:26,q:"The marketing team's ______ to launch the campaign in May was approved by the board.",opts:["decide","decision","decisive","decisively"],ans:1,exp:"소유격 team's 뒤이고 문장의 동사 was의 주어가 필요하므로 명사 자리입니다. decision to do(~하기로 한 결정)의 구조. decide는 동사, decisive는 형용사, decisively는 부사로 주어가 될 수 없습니다."}]},
{id:'p5-92',part:5,qs:[{type:'p5_pos_adj',err:17,q:"The hotel offers a ______ view of the harbor from every room on the top floor.",opts:["spectacle","spectacularly","spectacles","spectacular"],ans:3,exp:"관사 a와 명사 view 사이는 명사를 수식하는 형용사 자리이므로 spectacular가 정답입니다. spectacle/spectacles는 명사, spectacularly는 부사로 명사를 직접 수식할 수 없습니다."}]},
{id:'p5-93',part:5,qs:[{type:'p5_pos_adj',err:22,q:"Please make sure that all ______ documents are shredded before being discarded.",opts:["confidential","confidence","confidentially","confide"],ans:0,exp:"수량형용사 all과 명사 documents 사이에서 명사를 수식하는 형용사 자리입니다. '기밀 문서'라는 뜻의 confidential이 정답. confidence는 명사, confidentially는 부사, confide는 동사입니다."}]},
{id:'p5-94',part:5,qs:[{type:'p5_pos_adj',err:30,q:"The newly hired technicians are ______ for maintaining the laboratory equipment.",opts:["responsibility","responsibly","responsible","respond"],ans:2,exp:"be동사 are 뒤 주격 보어 자리이며 뒤에 for가 이어지므로 'be responsible for(~을 담당하다)' 구조의 형용사 responsible이 정답입니다. 명사 responsibility는 주어와 동격이 아니고 for와 어울리지 않으며, responsibly는 부사, respond는 동사입니다."}]},
{id:'p5-95',part:5,qs:[{type:'p5_pos_adj',err:40,q:"Any employee ______ in joining the volunteer program should contact Ms. Ito.",opts:["interest","interested","interesting","interestingly"],ans:1,exp:"문장의 동사는 should contact이므로 빈칸은 명사 employee를 뒤에서 수식하는 자리입니다. '~에 관심이 있는'은 사람을 수식하는 과거분사형 형용사 interested in이 정답. interesting은 '흥미를 일으키는'이라는 뜻으로 사람에 쓰면 어색하고, interest는 명사/동사, interestingly는 부사입니다."}]},
{id:'p5-96',part:5,qs:[{type:'p5_pos_adj',err:26,q:"Candidates must have ______ experience in project management to be considered for the position.",opts:["extensive","extend","extension","extensively"],ans:0,exp:"동사 have와 목적어 experience 사이에서 명사를 수식하는 형용사 자리이므로 '폭넓은'을 뜻하는 extensive가 정답입니다. extend는 동사, extension은 명사, extensively는 부사로 명사 앞 수식어가 될 수 없습니다."}]},
{id:'p5-97',part:5,qs:[{type:'p5_pos_adv',err:15,q:"The quarterly figures were ______ reviewed by two independent accountants.",opts:["careful","carefulness","carefully","care"],ans:2,exp:"be동사 were와 과거분사 reviewed 사이는 동사를 수식하는 부사 자리이므로 carefully가 정답입니다. careful은 형용사, carefulness와 care는 명사로 수동태 동사 사이에 들어갈 수 없습니다."}]},
{id:'p5-98',part:5,qs:[{type:'p5_pos_adv',err:18,q:"Sales of the portable heater rose ______ during the unusually cold winter.",opts:["sharp","sharply","sharpness","sharpen"],ans:1,exp:"자동사 rose 뒤에서 동사를 수식하는 부사 자리이므로 '급격히'를 뜻하는 sharply가 정답입니다. rise는 목적어를 취하지 않으므로 명사 sharpness가 올 수 없고, sharp는 형용사, sharpen은 동사입니다."}]},
{id:'p5-99',part:5,qs:[{type:'p5_pos_adv',err:25,q:"The conference organizers ______ announced that the keynote speaker had canceled.",opts:["regret","regretful","regrets","regretfully"],ans:3,exp:"주어 organizers와 동사 announced 사이에 들어가 동사를 수식하는 부사 자리이므로 regretfully가 정답입니다. 문장에 이미 동사 announced가 있으므로 동사 regret/regrets는 올 수 없고, 형용사 regretful은 동사를 수식하지 못합니다."}]},
{id:'p5-100',part:5,qs:[{type:'p5_pos_adv',err:30,q:"Participants should arrive ______ 15 minutes before the seminar begins to check in.",opts:["approximately","approximate","approximation","approximated"],ans:0,exp:"빈칸 뒤 숫자 표현 15 minutes를 수식하는 자리이며, 수치 앞에서 '대략'이라는 뜻으로 쓰이는 것은 부사 approximately입니다. 형용사 approximate는 '15 minutes'와 같은 수치 앞에서 부사처럼 쓰이지 않으며, approximation은 명사, approximated는 과거분사입니다."}]},
{id:'p5-101',part:5,qs:[{type:'p5_pos_adv',err:33,q:"The museum's ______ renovated east wing will reopen to the public on June 3.",opts:["new","newer","newness","newly"],ans:3,exp:"소유격 museum's와 명사 east wing 사이에 과거분사 renovated가 있고, 빈칸은 이 분사형 형용사를 수식하는 부사 자리입니다. '새로 개조된'은 newly renovated. 형용사 new/newer나 명사 newness는 분사를 수식할 수 없습니다."}]},
{id:'p5-102',part:5,qs:[{type:'p5_tense',err:50,q:"By the time the new factory opens next spring, the company ______ more than 200 local workers.",opts:["hires","hired","will have hired","has hired"],ans:2,exp:"'By the time + 현재시제(opens)'가 미래의 기준 시점을 나타내므로 주절은 그때까지 완료될 일을 뜻하는 미래완료 will have hired가 정답입니다. 과거 hired나 현재완료 has hired는 미래 기준 시점과 맞지 않고, 현재 hires는 완료 의미를 전달하지 못합니다."}]},
{id:'p5-103',part:5,qs:[{type:'p5_tense',err:42,q:"Mr. Dubois ______ at Harland Logistics for twelve years before he was promoted to regional director.",opts:["works","had worked","has worked","will work"],ans:1,exp:"before 절의 과거시제(was promoted)보다 앞서 12년간 지속된 일이므로 과거완료 had worked가 정답입니다. 현재완료 has worked는 과거의 한 시점(승진) 이전까지의 기간을 나타낼 수 없고, works와 will work는 과거 사건과 시제가 충돌합니다."}]},
{id:'p5-104',part:5,qs:[{type:'p5_tense',err:35,q:"Each of the applicants ______ required to submit two letters of reference.",opts:["is","are","were","being"],ans:0,exp:"'Each of + 복수명사'는 단수 취급하므로 단수 동사 is가 정답입니다. applicants만 보고 복수 동사 are/were를 고르기 쉬운 함정이며, being은 문장의 본동사가 될 수 없습니다."}]},
{id:'p5-105',part:5,qs:[{type:'p5_tense',err:25,q:"The accounting department ______ its annual budget review every October.",opts:["conduct","conducting","have conducted","conducts"],ans:3,exp:"주어 The accounting department는 단수이고, every October라는 반복 표현이 있으므로 현재시제 단수 동사 conducts가 정답입니다. conduct와 have conducted는 복수 주어에 쓰이고, conducting은 본동사로 쓸 수 없습니다."}]},
{id:'p5-106',part:5,qs:[{type:'p5_tense',err:30,q:"Since its founding in 2009, Brightwell Organics ______ into one of the region's largest produce suppliers.",opts:["grows","grew","has grown","will grow"],ans:2,exp:"'Since + 과거 시점'은 과거부터 현재까지 이어지는 일을 나타내므로 현재완료 has grown이 정답입니다. 단순 과거 grew나 현재 grows, 미래 will grow는 since 2009와 함께 쓰이지 않습니다."}]},
{id:'p5-107',part:5,qs:[{type:'p5_tense',err:38,q:"Once the contract ______ signed by both parties, construction of the new warehouse will begin.",opts:["is","will be","was","being"],ans:0,exp:"시간 부사절(Once ~)에서는 현재시제가 미래를 대신합니다 → is signed. 주절의 will begin이 미래 단서. 부사절에 will은 쓰지 않음."}]},
{id:'p5-108',part:5,qs:[{type:'p5_voice',err:22,q:"All visitors to the plant ______ to wear protective eyewear at all times.",opts:["require","are required","requiring","have required"],ans:1,exp:"방문객은 보안경 착용을 '요구받는' 대상이므로 수동태 are required to가 정답입니다. 능동 require나 have required는 뒤에 목적어가 필요하며, requiring은 본동사가 될 수 없습니다."}]},
{id:'p5-109',part:5,qs:[{type:'p5_voice',err:28,q:"Lunch ______ to all attendees of the full-day training session.",opts:["will provide","provides","providing","will be provided"],ans:3,exp:"주어 Lunch는 제공을 '받는' 대상이고 빈칸 뒤에 목적어 없이 전치사 to가 이어지므로 수동태 will be provided가 정답입니다. will provide와 provides는 능동태라 목적어가 필요하고, providing은 본동사로 쓸 수 없습니다."}]},
{id:'p5-110',part:5,qs:[{type:'p5_voice',err:45,q:"The company ______ a new line of eco-friendly packaging next quarter.",opts:["will introduce","will be introduced","is introduced","introducing"],ans:0,exp:"빈칸 뒤에 목적어 a new line of eco-friendly packaging이 있으므로 능동태가 필요하며, next quarter와 어울리는 미래시제 will introduce가 정답입니다. 수동태 will be introduced와 is introduced는 뒤에 목적어를 취할 수 없고, introducing은 본동사가 아닙니다."}]},
{id:'p5-111',part:5,qs:[{type:'p5_voice',err:42,q:"The documents that ______ to the client yesterday contained outdated pricing.",opts:["sent","have sent","were sent","sending"],ans:2,exp:"관계절의 주어 that(=documents)은 '보내진' 대상이고 뒤에 목적어 없이 to the client가 이어지므로 수동태 were sent가 정답입니다. 능동 sent/have sent는 목적어가 필요하고, have sent는 yesterday와도 맞지 않으며, sending은 관계절의 동사가 될 수 없습니다."}]},
{id:'p5-112',part:5,qs:[{type:'p5_prep',err:30,q:"The annual shareholders' meeting will be held ______ May 12 at the Grand Pavilion Hotel.",opts:["in","on","at","by"],ans:1,exp:"특정 날짜(May 12) 앞에는 전치사 on을 씁니다. in은 월·연도, at은 시각 앞에 쓰이고, by는 '~까지'라는 기한을 뜻해 행사 개최일을 나타내지 못합니다."}]},
{id:'p5-113',part:5,qs:[{type:'p5_prep',err:38,q:"Please submit your expense reports ______ the end of each month.",opts:["since","among","until","by"],ans:3,exp:"submit처럼 한 번에 완료되는 동작의 기한은 '~까지'라는 뜻의 by로 나타냅니다. until은 동작이나 상태가 그 시점까지 '계속'될 때 쓰므로 submit과 어울리지 않고, since와 among은 의미상 맞지 않습니다."}]},
{id:'p5-114',part:5,qs:[{type:'p5_prep',err:33,q:"Erina Textiles has been a leading supplier of upholstery fabrics ______ nearly three decades.",opts:["for","since","within","among"],ans:0,exp:"현재완료와 함께 '~ 동안'이라는 기간(nearly three decades)을 나타내는 전치사는 for입니다. since는 뒤에 시작 시점이 와야 하고, within은 '~ 이내에', among은 '~ 사이에'로 기간 표현과 맞지 않습니다."}]},
{id:'p5-115',part:5,qs:[{type:'p5_prep',err:45,q:"The new fitness center is located directly ______ from the central train station.",opts:["near","beside","across","along"],ans:2,exp:"빈칸 뒤의 from과 결합해 '~의 맞은편에'를 뜻하는 across from이 정답입니다. near, beside, along은 from 없이 바로 명사를 취하는 전치사이므로 from과 함께 쓸 수 없습니다."}]},
{id:'p5-116',part:5,qs:[{type:'p5_prep',err:52,q:"______ the exception of the lobby, all areas of the building will be closed during the renovation.",opts:["By","With","For","On"],ans:1,exp:"'with the exception of(~을 제외하고)'는 정해진 관용표현이므로 With가 정답입니다. by, for, on은 exception과 결합해 이런 뜻을 만들지 못합니다."}]},
{id:'p5-117',part:5,qs:[{type:'p5_prep',err:40,q:"The seminar on export regulations has been postponed ______ further notice.",opts:["until","to","by","for"],ans:0,exp:"'until further notice(추후 공지가 있을 때까지)'는 연기·중단 공지에 쓰이는 고정 표현이므로 until이 정답입니다. postpone 뒤의 to는 구체적 날짜와 함께 쓰이고, by와 for는 further notice와 결합하지 않습니다."}]},
{id:'p5-118',part:5,qs:[{type:'p5_conj',err:28,q:"______ the heavy snowfall, all flights out of Halden Airport were delayed by several hours.",opts:["Because","Although","Even though","Due to"],ans:3,exp:"빈칸 뒤에 주어·동사 없이 명사구 the heavy snowfall만 있으므로 전치사가 필요하며, 지연의 원인을 나타내는 Due to가 정답입니다. Because, Although, Even though는 접속사라 뒤에 절이 와야 합니다."}]},
{id:'p5-119',part:5,qs:[{type:'p5_conj',err:25,q:"The warranty will be void ______ the appliance is serviced by an unauthorized technician.",opts:["despite","during","if","in case of"],ans:2,exp:"빈칸 뒤에 주어(the appliance)와 동사(is serviced)를 갖춘 절이 오므로 접속사가 필요하며, 조건을 나타내는 if가 정답입니다. despite, during, in case of는 전치사(구)라 뒤에 명사만 올 수 있습니다."}]},
{id:'p5-120',part:5,qs:[{type:'p5_conj',err:35,q:"______ the store closes at 9 P.M. on weekdays, it stays open until midnight on Saturdays.",opts:["Although","Despite","In spite of","Nevertheless"],ans:0,exp:"빈칸 뒤에 절(the store closes)이 오고 주절과 대조를 이루므로 양보 접속사 Although가 정답입니다. Despite와 In spite of는 전치사라 절을 이끌 수 없고, Nevertheless는 접속부사라 두 절을 직접 연결하지 못합니다."}]},
{id:'p5-121',part:5,qs:[{type:'p5_conj',err:40,q:"Mr. Tanaka will remain in Osaka ______ the negotiations with the supplier are completed.",opts:["during","until","by","throughout"],ans:1,exp:"빈칸 뒤에 완전한 절(the negotiations ... are completed)이 오므로 접속사가 필요하며, remain과 어울려 '~할 때까지'를 뜻하는 until이 정답입니다. during, by, throughout은 전치사로만 쓰여 절을 이끌 수 없습니다."}]},
{id:'p5-122',part:5,qs:[{type:'p5_conj',err:50,q:"The invoice must be paid within 30 days; ______, a late fee of 2 percent will be applied.",opts:["unless","whereas","in case","otherwise"],ans:3,exp:"세미콜론과 콤마 사이에서 두 독립절을 의미상 연결하는 접속부사 자리이며, '그렇지 않으면'이라는 뜻의 otherwise가 정답입니다. unless, whereas, in case는 종속접속사라 콤마로 분리된 이 위치에 올 수 없습니다."}]},
{id:'p5-123',part:5,qs:[{type:'p5_conj',err:45,q:"______ the merger was announced, the company's stock price rose by almost 15 percent.",opts:["Upon","Following","As soon as","Prior"],ans:2,exp:"빈칸 뒤에 주어와 동사를 갖춘 절(the merger was announced)이 오므로 접속사 As soon as가 정답입니다. Upon과 Following은 전치사라 명사만 취하고, Prior는 to와 함께 전치사구로만 쓰입니다."}]},
{id:'p5-124',part:5,qs:[{type:'p5_rel',err:25,q:"The architect ______ designed the new civic center has won several international awards.",opts:["who","which","whose","whom"],ans:0,exp:"선행사가 사람(The architect)이고 관계절에 주어가 없으므로 주격 관계대명사 who가 정답입니다. which는 사물 선행사에 쓰이고, whose 뒤에는 명사가, whom은 목적어가 빠진 절이 와야 합니다."}]},
{id:'p5-125',part:5,qs:[{type:'p5_rel',err:38,q:"Employees ______ parking permits expire this month should renew them at the security office.",opts:["who","whose","whom","which"],ans:1,exp:"빈칸 뒤에 명사 parking permits가 바로 이어지고 '직원들의 주차권'이라는 소유 관계이므로 소유격 관계대명사 whose가 정답입니다. who나 which 뒤에는 동사가, whom 뒤에는 목적어가 빠진 절이 와야 합니다."}]},
{id:'p5-126',part:5,qs:[{type:'p5_rel',err:45,q:"The conference room ______ the board meets every Monday is being repainted this week.",opts:["which","who","what","where"],ans:3,exp:"선행사가 장소(The conference room)이고 뒤에 주어·동사를 모두 갖춘 완전한 절(the board meets)이 오므로 관계부사 where가 정답입니다. which는 뒤에 불완전한 절이 와야 하고, who는 사람 선행사에, what은 선행사 없이 쓰입니다."}]},
{id:'p5-127',part:5,qs:[{type:'p5_rel',err:48,q:"Ms. Reyes is the consultant ______ the committee hired to evaluate the recycling program.",opts:["whose","who's","whom","where"],ans:2,exp:"선행사가 사람(the consultant)이고 관계절 the committee hired에 hired의 목적어가 빠져 있으므로 목적격 관계대명사 whom이 정답입니다. whose 뒤에는 명사가 와야 하고, who's는 who is의 축약형이라 구조가 맞지 않으며, where는 장소 선행사에 쓰입니다."}]},
{id:'p5-128',part:5,qs:[{type:'p5_pron',err:22,q:"Although the two laptops look similar, ______ have very different battery capacities.",opts:["them","they","their","themselves"],ans:1,exp:"주절의 동사 have 앞 주어 자리이므로 주격 대명사 they가 정답입니다. them은 목적격, their는 소유격이라 주어가 될 수 없고, 재귀대명사 themselves는 단독으로 주어 자리에 쓰이지 않습니다."}]},
{id:'p5-129',part:5,qs:[{type:'p5_pron',err:35,q:"Mr. Lindqvist prepared the entire presentation ______ because his assistant was on leave.",opts:["he","him","his","himself"],ans:3,exp:"prepared의 목적어 the entire presentation이 이미 있고, 빈칸이 없어도 문장이 완전하므로 '직접, 스스로'를 강조하는 재귀대명사 himself가 정답입니다. he, him, his는 문장 안에서 맡을 역할이 없습니다."}]},
{id:'p5-130',part:5,qs:[{type:'p5_pron',err:48,q:"Of the two proposals, the committee found Mr. Chen's to be more practical than ______.",opts:["other","another","the other","others"],ans:2,exp:"두 개(the two proposals) 중 하나를 제외한 '나머지 하나'는 the other로 나타냅니다. another는 셋 이상 중 또 다른 하나, others는 복수의 나머지를 뜻하며, other는 단독으로 대명사처럼 쓰이지 않습니다."}]},
{id:'p5-131',part:5,qs:[{type:'p5_vocab_v',err:35,q:"The regional manager ______ the opening of the new branch to the following month because of construction delays.",opts:["postponed","canceled","attended","reserved"],ans:0,exp:"'to the following month(다음 달로)'와 '공사 지연'이라는 단서로 보아 개장을 '연기했다'는 postponed가 정답입니다. canceled(취소하다)는 다음 달로 옮긴다는 내용과 모순되고, attended(참석하다)와 reserved(예약하다)는 문맥에 맞지 않습니다."}]},
{id:'p5-132',part:5,qs:[{type:'p5_vocab_v',err:40,q:"The committee will ______ the proposals on the basis of cost, feasibility, and environmental impact.",opts:["inform","participate","arrive","evaluate"],ans:3,exp:"'비용·실현 가능성·환경 영향을 기준으로(on the basis of)' 제안서를 '평가한다'는 evaluate가 정답입니다. inform은 사람을 목적어로 취하고, participate와 arrive는 자동사라 proposals를 목적어로 받을 수 없습니다."}]},
{id:'p5-133',part:5,qs:[{type:'p5_vocab_v',err:55,q:"All staff must ______ to the updated dress code starting next Monday.",opts:["obey","adhere","follow","comply"],ans:1,exp:"빈칸 뒤 전치사 to와 결합해 '~을 준수하다'를 뜻하는 자동사 adhere to가 정답입니다. obey와 follow는 전치사 없이 목적어를 바로 취하는 타동사이고, comply는 to가 아닌 with와 함께 쓰입니다."}]},
{id:'p5-134',part:5,qs:[{type:'p5_vocab_v',err:50,q:"The new budgeting software ______ managers to track departmental spending in real time.",opts:["provides","lets","enables","makes"],ans:2,exp:"'목적어 + to부정사' 구조로 '~가 …할 수 있게 하다'를 뜻하는 enable이 정답입니다. let과 make는 목적격 보어로 원형부정사(track)를 취하고, provide는 provide A with B 형태로 쓰여 to부정사를 보어로 받지 않습니다."}]},
{id:'p5-135',part:5,qs:[{type:'p5_vocab_v',err:42,q:"Sales representatives who ______ their quarterly targets will receive a bonus.",opts:["exceed","succeed","overcome","prevail"],ans:0,exp:"'분기 목표를 초과 달성한' 직원이 보너스를 받는다는 문맥이므로 exceed(초과하다)가 정답입니다. succeed와 prevail은 자동사라 targets를 목적어로 취할 수 없고, overcome(극복하다)은 장애물·어려움과 어울리는 동사로 목표와는 쓰이지 않습니다."}]},
{id:'p5-136',part:5,qs:[{type:'p5_vocab_n',err:36,q:"The hotel has received several ______ about noise from the construction site next door.",opts:["complaints","compliments","components","commitments"],ans:0,exp:"receive complaints about(~에 대한 불만을 접수하다). 소음(noise)이라는 부정적 문맥이 단서. compliments(칭찬)는 철자 혼동 함정."}]},
{id:'p5-137',part:5,qs:[{type:'p5_vocab_n',err:38,q:"The ______ of the survey indicate that most customers prefer the online ordering system.",opts:["reasons","results","positions","conditions"],ans:1,exp:"'설문 조사의 ~이 고객 선호를 보여 준다(indicate)'는 문맥이므로 '결과'를 뜻하는 results가 정답입니다. reasons(이유), positions(위치·직위), conditions(조건·상태)는 survey와 결합해 indicate의 주어로 쓰기에 어색합니다."}]},
{id:'p5-138',part:5,qs:[{type:'p5_vocab_n',err:45,q:"Travelers must present a valid form of ______ before boarding the ferry.",opts:["identification","information","instruction","invitation"],ans:0,exp:"'a valid form of identification(유효한 신분증)'은 탑승·출입 상황에서 쓰이는 고정 표현이므로 identification이 정답입니다. information, instruction, invitation은 'a valid form of'와 결합해 제시(present)해야 하는 증명 수단이라는 뜻을 만들지 못합니다."}]},
{id:'p5-139',part:5,qs:[{type:'p5_vocab_n',err:55,q:"In ______ of her twenty years of service, Ms. Haddad was presented with a gold watch.",opts:["attention","exception","recognition","permission"],ans:2,exp:"'in recognition of(~을 인정하여·기리며)'는 공로를 치하하는 상황에 쓰이는 관용표현으로, 20년 근속에 금시계를 수여했다는 문맥과 맞습니다. in attention of는 쓰이지 않는 표현이고, in exception of와 in permission of도 성립하지 않습니다."}]},
{id:'p5-140',part:5,qs:[{type:'p5_vocab_adj',err:50,q:"The hotel's shuttle service is ______ to guests staying at least two nights.",opts:["complementary","complimentary","complete","comparable"],ans:1,exp:"호텔 서비스가 투숙객에게 '무료로 제공되는'이라는 뜻의 complimentary가 정답입니다. 철자가 비슷한 complementary(보완하는)는 대표적인 함정이고, complete(완전한)와 comparable(비슷한)은 to guests와 연결해도 의미가 통하지 않습니다."}]},
{id:'p5-141',part:5,qs:[{type:'p5_vocab_adj',err:48,q:"Despite the rain, the outdoor concert was ______ attended, with more than 3,000 people present.",opts:["high","hard","well","very"],ans:2,exp:"'참석자가 많았다'는 뜻의 고정 표현 well attended가 정답으로, 뒤의 '3,000명 이상 참석'이 단서입니다. high는 형용사라 과거분사를 수식할 수 없고, hard attended와 very attended는 쓰이지 않는 표현입니다."}]},
{id:'p5-142',part:5,qs:[{type:'p5_vocab_adj',err:40,q:"Because the laboratory equipment is extremely ______, it must be handled only by trained technicians.",opts:["flexible","spacious","frequent","fragile"],ans:3,exp:"'숙련된 기술자만 다뤄야 한다'는 결과로 보아 장비가 '깨지기 쉬운' 상태라는 fragile이 정답입니다. flexible(유연한), spacious(넓은), frequent(빈번한)는 취급 주의의 이유가 되지 못합니다."}]},
{id:'p5-143',part:5,qs:[{type:'p5_vocab_adj',err:58,q:"The two job candidates had ______ identical qualifications, so the panel based its decision on the interviews.",opts:["nearly","lately","early","shortly"],ans:0,exp:"형용사 identical을 수식해 '거의 동일한'이라는 뜻을 만드는 부사 nearly가 정답으로, 자격이 거의 같아 면접으로 결정했다는 문맥과 맞습니다. lately(최근에), early(일찍), shortly(곧)는 시간 부사라 identical을 수식할 수 없습니다."}]},
{id:'p5-144',part:5,qs:[{type:'p5_inf',err:28,q:"The committee agreed ______ the vote until all members had reviewed the proposal.",opts:["postponing","to postpone","postpone","postponed"],ans:1,exp:"동사 agree는 to부정사를 목적어로 취하므로(agree to do) to postpone이 정답입니다. agree는 동명사 postponing을 목적어로 받지 않으며, postpone과 postponed는 동사 agreed 뒤에 바로 올 수 없습니다."}]},
{id:'p5-145',part:5,qs:[{type:'p5_inf',err:38,q:"The manager suggested ______ the weekly meeting to Thursday afternoons.",opts:["to move","move","moved","moving"],ans:3,exp:"동사 suggest는 동명사를 목적어로 취하므로(suggest doing) moving이 정답입니다. suggest는 to부정사 to move를 목적어로 받지 않으며, move와 moved는 suggested 뒤에 바로 올 수 없습니다."}]},
{id:'p5-146',part:5,qs:[{type:'p5_inf',err:45,q:"The report ______ by the research team outlines three strategies for reducing energy costs.",opts:["preparing","prepares","prepared","to prepare"],ans:2,exp:"문장의 본동사는 outlines이므로 빈칸은 명사 report를 수식하는 분사 자리이며, 보고서는 연구팀에 의해 '작성된' 대상이고 뒤에 by가 있으므로 과거분사 prepared가 정답입니다. 현재분사 preparing은 능동 의미라 by와 맞지 않고, prepares는 동사가 중복되며, to prepare는 '작성될 예정'이라는 뜻이 되어 outlines와 어울리지 않습니다."}]}
);
BANK.push(
{id:'p6-06',part:6,passage:"NOTICE TO ALL STAFF\n\nBeginning Monday, November 3, the company shuttle between Harlow Station and our Riverside campus will operate on a revised schedule. Morning departures will leave the station every twenty minutes from 7:00 A.M. to 9:40 A.M. ___(1)___ to the current timetable, the last evening shuttle will depart the campus at 7:30 P.M. rather than 6:45 P.M. ___(2)___ ___(3)___, the shuttle will no longer stop at the Maple Street parking area, as that lot is being closed for redevelopment. A copy of the new timetable ___(4)___ on the intranet later this week. Employees who have questions about these changes should contact the Facilities Department at extension 2240.",qs:[
 {type:'p6_vocab',err:42,q:"(1)",opts:["Compared","Referred","Devoted","Accustomed"],ans:0,exp:"뒤에 '현재 시간표'와 '7:30 P.M. rather than 6:45 P.M.'이라는 비교가 이어지므로 'Compared to(~와 비교하여)'가 적절합니다. Referred to는 '~라고 불리는', Devoted to는 '~에 전념하는', Accustomed to는 '~에 익숙한'으로 문맥에 맞지 않습니다."},
 {type:'p6_insert',err:58,q:"(2)",opts:["The shuttle has been in service for more than ten years.","Parking permits must be renewed by the end of the month.","This later departure responds to requests from staff who work extended hours.","Please return the completed survey to the reception desk."],ans:2,exp:"바로 앞 문장에서 마지막 저녁 셔틀이 6:45에서 7:30으로 늦춰진다고 했으므로, 'This later departure(이 늦춰진 출발)'로 그 변경의 이유를 설명하는 (C)가 자연스럽습니다. (A)는 셔틀 역사, (B)는 주차 허가증, (D)는 설문으로 앞뒤 문맥과 연결되지 않습니다."},
 {type:'p6_connector',err:38,q:"(3)",opts:["Otherwise","In addition","For example","Nevertheless"],ans:1,exp:"앞에서 시간표 변경을 설명한 뒤 '메이플 스트리트 주차장에 더 이상 정차하지 않는다'는 또 다른 변경 사항을 덧붙이므로 추가의 접속부사 'In addition'이 정답입니다. Otherwise(그렇지 않으면), Nevertheless(그럼에도 불구하고)는 논리 관계가 맞지 않고, For example은 앞 내용의 예시가 아닙니다."},
 {type:'p6_gram',err:30,q:"(4)",opts:["posted","has posted","posting","will be posted"],ans:3,exp:"주어 'A copy of the new timetable'은 게시되는 대상이므로 수동태가 필요하고, 'later this week(이번 주 후반에)'라는 미래 시점 표현이 있으므로 'will be posted'가 정답입니다. (B) has posted는 능동태라 목적어가 필요하고, (A) posted와 (C) posting은 문장의 동사 역할을 할 수 없습니다."}]},
{id:'p6-07',part:6,passage:"To: Daniel Okafor <d.okafor@brightmail.com>\nFrom: Lena Marsh <l.marsh@corvinproperties.com>\nDate: August 12\nSubject: Lease renewal — Unit 4B\n\nDear Mr. Okafor,\n\nYour current lease for Unit 4B at Corvin Plaza is ___(1)___ to expire on October 31. We would be pleased to offer you a renewal for another twelve months under the same terms, with a modest rent increase of three percent. ___(2)___ If you wish to renew, please sign the attached agreement and return it to our office by September 15. ___(3)___, we will assume that you intend to vacate the unit and will begin advertising it to prospective tenants. Please note that any ___(4)___ to the premises, such as repainting walls, must be approved in writing before work begins.\n\nWe hope to continue serving you.\n\nSincerely,\nLena Marsh\nProperty Manager, Corvin Properties",qs:[
 {type:'p6_vocab',err:36,q:"(1)",opts:["reminded","scheduled","located","prepared"],ans:1,exp:"임대 계약이 10월 31일에 만료될 '예정'이라는 뜻이므로 'be scheduled to + 동사원형(~할 예정이다)'이 정답입니다. reminded는 '상기시키다', located는 '위치하다', prepared는 '준비된'으로 계약 만료 시점과 어울리지 않습니다."},
 {type:'p6_insert',err:62,q:"(2)",opts:["The unit has been vacant since last spring.","Unfortunately, we are unable to offer parking spaces at this time.","Thank you for submitting your maintenance request so promptly.","This adjustment reflects the rise in building maintenance costs over the past year."],ans:3,exp:"앞 문장에서 '3퍼센트의 소폭 임대료 인상(a modest rent increase)'을 언급했으므로 'This adjustment(이 조정)'가 그 인상을 가리키며 이유를 설명하는 (D)가 자연스럽습니다. (A)는 세입자가 거주 중인 사실과 모순되고, (B)와 (C)는 앞뒤 문맥과 관련이 없습니다."},
 {type:'p6_connector',err:40,q:"(3)",opts:["Otherwise","Likewise","Consequently","Similarly"],ans:0,exp:"앞 문장은 '갱신을 원하면 9월 15일까지 계약서를 보내 달라'는 조건이고, 뒤 문장은 '퇴거할 것으로 간주하겠다'는 그 조건을 지키지 않았을 때의 결과이므로 'Otherwise(그렇지 않으면)'가 정답입니다. Likewise, Similarly는 유사한 내용을 덧붙일 때, Consequently는 앞 내용의 직접적 결과일 때 쓰입니다."},
 {type:'p6_gram',err:33,q:"(4)",opts:["alter","altered","alterations","alterable"],ans:2,exp:"한정사 'any' 뒤이자 전치사 'to' 앞에 오는 자리이므로 명사 'alterations(변경, 개조)'가 정답입니다. 뒤에 'such as repainting walls'라는 예시도 명사를 수식합니다. (A)는 동사, (B)는 과거분사, (D)는 형용사로 명사 자리에 올 수 없습니다."}]},
{id:'p6-08',part:6,passage:"GreenDesk Plant Care\n\nAdd life to your workplace with GreenDesk, the region's leading provider of office plant services. Our trained technicians will visit your premises every two weeks to water, trim, and inspect your plants, so your staff can focus on their work ___(1)___ worrying about maintenance. We offer a wide ___(2)___ of plants suited to low-light lobbies, bright conference rooms, and everything in between. ___(3)___, every plant we install is covered by our replacement guarantee: if a plant fails to thrive, we replace it at no charge. Companies that sign a twelve-month contract before December 31 ___(4)___ a complimentary design consultation. Call 555-0148 or visit www.greendeskplants.com to request a quote.",qs:[
 {type:'p6_vocab',err:35,q:"(1)",opts:["in spite of","in case of","instead of","on behalf of"],ans:2,exp:"직원들이 '관리 걱정을 하는 대신' 업무에 집중할 수 있다는 뜻이므로 'instead of(~ 대신에)'가 정답입니다. in spite of(~에도 불구하고), in case of(~의 경우에), on behalf of(~를 대신하여, 대표하여)는 문맥에 맞지 않습니다."},
 {type:'p6_gram',err:25,q:"(2)",opts:["select","selective","selectively","selection"],ans:3,exp:"관사 'a'와 형용사 'wide' 뒤, 전치사 'of' 앞은 명사 자리이므로 'selection'이 정답입니다. 'a wide selection of(다양한 ~)'는 광고문에서 자주 쓰이는 표현입니다. (A)는 동사, (B)는 형용사, (C)는 부사입니다."},
 {type:'p6_connector',err:32,q:"(3)",opts:["Moreover","However","Otherwise","Instead"],ans:0,exp:"앞에서 다양한 식물 선택지를 소개하고 뒤에서 '교체 보증'이라는 또 다른 장점을 덧붙이므로 추가의 접속부사 'Moreover(게다가)'가 정답입니다. However(그러나), Instead(대신에)는 대조·대체를 나타내고, Otherwise(그렇지 않으면)는 조건의 반대 결과를 나타내므로 어울리지 않습니다."},
 {type:'p6_gram',err:28,q:"(4)",opts:["received","will receive","receiving","to receive"],ans:1,exp:"문장의 주어 'Companies'에 대한 본동사가 필요하고, '12월 31일 전에 계약하는 회사는 무료 상담을 받게 될 것'이라는 미래의 혜택이므로 'will receive'가 정답입니다. (C)와 (D)는 본동사가 될 수 없고, (A)는 과거시제라 아직 실행되지 않은 혜택과 맞지 않습니다."}]},
{id:'p6-09',part:6,passage:"BRENTON — The Brenton City Council announced on Tuesday that a bicycle-sharing program will launch next spring, with 300 bicycles ___(1)___ at 25 stations across the downtown area. Riders will be able to unlock a bicycle using a mobile application and return it to any station in the network. ___(2)___ Council member Priya Nandan, who proposed the program, said that the goal is to reduce traffic congestion during peak hours. \"Many residents live within three kilometers of their workplace,\" she said. \"For them, cycling is a ___(3)___ alternative to driving.\" ___(4)___, the city has already received interest from several local businesses that hope to sponsor individual stations. A list of station locations will be published on the city's website in January.",qs:[
 {type:'p6_gram',err:45,q:"(1)",opts:["locate","located","locating","locates"],ans:1,exp:"'with + 명사 + 분사' 구조에서 자전거는 '배치되는' 대상이므로 수동의 의미인 과거분사 'located'가 정답입니다. (C) locating은 능동 의미라 '자전거가 무언가를 위치시킨다'는 뜻이 되어 어색하고, (A)와 (D)는 동사 형태라 with 구문 안에 올 수 없습니다."},
 {type:'p6_insert',err:55,q:"(2)",opts:["A single ride of up to thirty minutes will cost two dollars.","The council meets on the first Tuesday of every month.","Bicycle helmets are available at most sporting goods stores.","The downtown area was recently renovated."],ans:0,exp:"앞 문장에서 앱으로 자전거를 빌리고 반납하는 이용 방법을 설명하고 있으므로, 이용 요금을 안내하는 (A)가 자연스럽게 이어집니다. (B)는 시의회 회의 일정, (C)는 헬멧 판매처, (D)는 도심 재개발로 자전거 공유 프로그램의 이용 설명과 무관합니다."},
 {type:'p6_vocab',err:50,q:"(3)",opts:["temporary","grateful","spacious","practical"],ans:3,exp:"직장까지 3킬로미터 이내에 사는 주민들에게 자전거가 운전의 '현실적인 대안'이라는 뜻이므로 'practical(실용적인)'이 정답입니다. temporary(일시적인), grateful(감사하는), spacious(넓은)는 alternative를 수식하기에 문맥상 부적절합니다."},
 {type:'p6_connector',err:48,q:"(4)",opts:["Nonetheless","Instead","Furthermore","Until then"],ans:2,exp:"프로그램의 목적과 장점을 설명한 뒤 '지역 업체들이 이미 후원 의사를 보였다'는 긍정적 정보를 추가하므로 'Furthermore(게다가)'가 정답입니다. Nonetheless(그럼에도)와 Instead(대신)는 대조 관계가 없어 부적절하고, Until then(그때까지)은 기준 시점이 없습니다."}]},
{id:'p6-10',part:6,passage:"Riverbend Community Garden — Plot Holder Guidelines\n\nWelcome to the Riverbend Community Garden. To ensure that the garden remains a pleasant space for everyone, all plot holders are asked to observe the following rules. Plots must be ___(1)___ throughout the growing season; any plot left untended for more than four weeks may be reassigned to a person on the waiting list. Water is available from the shared taps between 6:00 A.M. and 8:00 P.M. ___(2)___, please turn off the tap completely after use, as leaks have caused high water bills in the past. Tools in the storage shed ___(3)___ by any member but must be cleaned and returned the same day. Finally, we ask that you ___(4)___ your plot number clearly on any items you leave in the garden so that they can be returned to you if misplaced.",qs:[
 {type:'p6_vocab',err:38,q:"(1)",opts:["purchased","approved","delivered","maintained"],ans:3,exp:"세미콜론 뒤에서 '4주 이상 돌보지 않은(left untended) 구획은 재배정될 수 있다'고 했으므로, 구획을 재배 기간 내내 '관리해야 한다'는 뜻의 'maintained'가 정답입니다. purchased(구매된), approved(승인된), delivered(배송된)는 텃밭 구획 관리 규칙과 어울리지 않습니다."},
 {type:'p6_connector',err:30,q:"(2)",opts:["Also","However","Otherwise","Instead"],ans:0,exp:"앞에서 물 사용 가능 시간을 안내하고 뒤에서 '사용 후 수도꼭지를 완전히 잠가 달라'는 또 다른 부탁을 덧붙이므로 'Also(또한)'가 정답입니다. However, Instead는 대조·대체, Otherwise는 '그렇지 않으면'의 뜻으로 문맥에 맞지 않습니다."},
 {type:'p6_gram',err:36,q:"(3)",opts:["may use","may be used","using","have used"],ans:1,exp:"주어 'Tools'는 회원에 의해 '사용되는' 대상이고 뒤에 행위자 'by any member'가 있으므로 수동태 'may be used'가 정답입니다. (A)와 (D)는 능동태라 목적어가 필요하고, (C)는 본동사가 될 수 없습니다."},
 {type:'p6_gram',err:47,q:"(4)",opts:["labeled","labeling","label","to label"],ans:2,exp:"'ask that + 주어 + (should) 동사원형' 구조로, 요청·제안을 나타내는 동사 뒤의 that절에는 동사원형을 씁니다. 따라서 'label'이 정답입니다. (A)는 과거형, (B)와 (D)는 that절의 본동사 자리에 올 수 없습니다."}]},
{id:'p7-11',part:7,passage:"TallyBook Online Accounting\n\nRunning a small business is hard enough without spending your evenings on paperwork. TallyBook is a cloud-based accounting service designed specifically for companies with fewer than 50 employees. Create and send professional invoices in seconds, track expenses by photographing receipts with your phone, and generate tax reports with a single click. Because your data is stored securely online, you and your accountant can view the same up-to-date figures from any device.\n\nOur Starter plan costs $12 per month and includes invoicing, expense tracking, and e-mail support. The Professional plan, at $29 per month, adds payroll processing, inventory management, and telephone support seven days a week. Both plans come with a free 30-day trial, and no credit card is required to begin.\n\nThrough the end of March, new subscribers who choose the Professional plan will receive a free one-hour setup session with one of our certified advisors. To start your trial, visit www.tallybook.com/trial.\n\nTallyBook: Spend less time counting and more time growing.",qs:[
 {type:'p7_main',err:18,q:"What is being advertised?",opts:["A tax preparation firm","A mobile phone plan","An online bookkeeping service","A business training course"],ans:2,exp:"첫 단락의 'TallyBook is a cloud-based accounting service designed specifically for companies with fewer than 50 employees'에서 소규모 기업용 온라인 회계 서비스 광고임을 알 수 있습니다. accounting service를 bookkeeping service로 패러프레이즈했습니다."},
 {type:'p7_detail',err:30,q:"What is included only in the Professional plan?",opts:["Telephone support","Expense tracking","E-mail support","Invoice creation"],ans:0,exp:"둘째 단락에서 Professional plan은 'adds payroll processing, inventory management, and telephone support seven days a week'라고 했으므로 전화 지원은 Professional plan에만 포함됩니다. 나머지 세 항목은 Starter plan에 이미 포함되어 있습니다."},
 {type:'p7_infer',err:46,q:"What is suggested about the free trial?",opts:["It lasts for two weeks.","It is available only to Professional subscribers.","It must be requested by telephone.","It can be started without providing payment details."],ans:3,exp:"'Both plans come with a free 30-day trial, and no credit card is required to begin'에서 결제 정보 없이 체험을 시작할 수 있음을 추론할 수 있습니다. 체험 기간은 30일이고, 두 요금제 모두 제공되며, 웹사이트를 통해 시작하므로 나머지는 오답입니다."},
 {type:'p7_detail',err:33,q:"How can new customers receive a setup session?",opts:["By referring another business","By subscribing to the Professional plan before April","By paying for a full year in advance","By attending an online seminar"],ans:1,exp:"셋째 단락의 'Through the end of March, new subscribers who choose the Professional plan will receive a free one-hour setup session'에서 3월 말까지 Professional plan을 선택하면 설정 세션을 받을 수 있다고 했습니다. 'Through the end of March'를 'before April'로 패러프레이즈했습니다."}]},
{id:'p7-12',part:7,passage:"To: Marcus Ellery <m.ellery@pinecrestoutdoor.com>\nFrom: Sofia Reyes <s.reyes@greatlakesexpo.org>\nDate: May 6\nSubject: Booth assignment — Great Lakes Outdoor Expo\n\nDear Mr. Ellery,\n\nThank you for registering Pinecrest Outdoor Gear as an exhibitor at this year's Great Lakes Outdoor Expo, which will be held at the Duluth Convention Center from July 18 to 20. I am writing to confirm that your company has been assigned Booth 214, a corner location in the Camping and Hiking section of the exhibition hall. As you requested, the booth is near the main entrance, so you should receive strong foot traffic throughout the event.\n\nPlease note a few important dates. Exhibitors may set up their displays on July 17 between 9:00 A.M. and 6:00 P.M. If you need electrical outlets or additional lighting, the request form on our website must be submitted by June 20; requests made after that date will incur a $75 late fee. Finally, each exhibitor receives four staff badges. Should you need more, additional badges can be purchased for $20 each until July 10.\n\nI have attached a floor plan showing your booth location. Please do not hesitate to contact me with any questions.\n\nBest regards,\nSofia Reyes\nExhibitor Services Coordinator",qs:[
 {type:'p7_main',err:22,q:"Why was the e-mail sent?",opts:["To request payment for a booth","To confirm an exhibitor's booth location","To announce a change of venue","To invite a company to give a presentation"],ans:1,exp:"첫 단락의 'I am writing to confirm that your company has been assigned Booth 214'에서 부스 배정을 확인해 주기 위한 이메일임을 알 수 있습니다. 비용 청구나 장소 변경, 발표 요청은 언급되지 않았습니다."},
 {type:'p7_detail',err:36,q:"What is indicated about Booth 214?",opts:["It is larger than most other booths.","It will be shared with another company.","It is located in the center of the hall.","It is close to an entrance."],ans:3,exp:"'As you requested, the booth is near the main entrance'에서 부스가 정문 근처에 있음을 알 수 있습니다. 'near the main entrance'를 'close to an entrance'로 패러프레이즈했습니다. 부스 크기나 공유 여부는 언급되지 않았고, 위치는 홀 중앙이 아니라 Camping and Hiking 구역의 모퉁이입니다."},
 {type:'p7_detail',err:28,q:"By what date should exhibitors request extra lighting to avoid a fee?",opts:["June 20","July 10","July 17","July 18"],ans:0,exp:"'If you need electrical outlets or additional lighting, the request form on our website must be submitted by June 20; requests made after that date will incur a $75 late fee'에서 6월 20일까지 신청해야 연체료가 없음을 알 수 있습니다. 7월 10일은 추가 배지 구매 마감일, 7월 17일은 설치일입니다."},
 {type:'p7_infer',err:52,q:"What is suggested about Pinecrest Outdoor Gear?",opts:["It has exhibited at the expo before.","It will need more than four staff badges.","It expressed a preference about its booth location.","It sells mainly fishing equipment."],ans:2,exp:"'As you requested, the booth is near the main entrance'에서 Pinecrest사가 부스 위치에 대해 요청(선호)을 밝혔음을 추론할 수 있습니다. 이전 참가 여부, 추가 배지 필요 여부, 낚시 장비 판매는 지문에서 확인할 수 없습니다."}]},
{id:'p7-13',part:7,passage:"Orrin Dairy Goes Electric\n\nWESTFIELD (June 3) — Orrin Dairy, a family-owned company that has delivered milk and cheese to homes in the Westfield area since 1952, announced yesterday that it will replace its entire fleet of 24 delivery vans with electric vehicles by the end of next year. The first six electric vans are already in service on routes in the city center.\n\nAccording to company president Thomas Orrin, the decision was driven primarily by cost. \"Fuel and maintenance account for nearly a third of our delivery expenses,\" he said. \"The electric vans cost more to buy, but we expect them to pay for themselves within four years.\" The company has installed charging stations at its Harper Road depot, where the vans are charged overnight.\n\nCustomers appear to welcome the change. Nina Cho, who has received deliveries from Orrin for over a decade, said that the new vans are noticeably quieter. \"The old vans used to wake my children at 5 A.M.,\" she said. \"Now I don't even hear them arrive.\"\n\nOrrin Dairy employs 85 people and serves approximately 6,000 households. The company plans to expand its delivery area to the neighboring town of Calder next spring.",qs:[
 {type:'p7_main',err:20,q:"What is the article mainly about?",opts:["A company's plan to change its delivery vehicles","The opening of a new dairy farm","A rise in the price of milk products","A merger between two local businesses"],ans:0,exp:"첫 단락의 'it will replace its entire fleet of 24 delivery vans with electric vehicles by the end of next year'에서 배달 차량을 전기차로 교체하는 회사의 계획이 기사의 중심 내용임을 알 수 있습니다. 농장 개장, 가격 인상, 합병은 언급되지 않았습니다."},
 {type:'p7_detail',err:34,q:"According to Mr. Orrin, why is the company switching to electric vans?",opts:["To comply with new regulations","To improve its public image","To reduce operating expenses","To attract younger customers"],ans:2,exp:"둘째 단락의 'the decision was driven primarily by cost'와 'Fuel and maintenance account for nearly a third of our delivery expenses'에서 비용 절감이 주된 이유임을 알 수 있습니다. 'delivery expenses'를 'operating expenses'로 패러프레이즈했습니다. 규제, 이미지, 고객층은 언급되지 않았습니다."},
 {type:'p7_syn',err:45,q:"The phrase \"account for\" in paragraph 2, line 2, is closest in meaning to",opts:["explain","make up","pay for","report on"],ans:1,exp:"'Fuel and maintenance account for nearly a third of our delivery expenses'에서 account for는 '(비율을) 차지하다'의 뜻이므로 'make up(구성하다, 차지하다)'이 가장 가깝습니다. account for에는 '설명하다'의 뜻도 있지만 비율과 함께 쓰인 이 문맥에서는 맞지 않습니다."},
 {type:'p7_detail',err:27,q:"What does Ms. Cho say about the new vans?",opts:["They arrive earlier than before.","They are more attractive.","They deliver a wider range of products.","They make less noise."],ans:3,exp:"셋째 단락에서 Nina Cho는 'the new vans are noticeably quieter'라고 말하며 'Now I don't even hear them arrive'라고 덧붙였습니다. 'quieter'를 'make less noise'로 패러프레이즈했습니다. 배달 시간이나 외관, 제품 종류에 대한 언급은 없습니다."},
 {type:'p7_detail',err:33,q:"What is Orrin Dairy planning to do next spring?",opts:["Hire additional drivers","Begin deliveries in another town","Open a second depot","Purchase eighteen more vans"],ans:1,exp:"마지막 단락의 'The company plans to expand its delivery area to the neighboring town of Calder next spring'에서 내년 봄에 이웃 마을로 배달 지역을 확장할 계획임을 알 수 있습니다. 추가 고용이나 두 번째 차고 개설은 언급되지 않았고, 차량 교체는 내년 말까지 완료 예정입니다."}]},
{id:'p7-14',part:7,passage:"MEMO\n\nTo: All Employees, Lakeview Office\nFrom: Rachel Dunmore, Office Manager\nDate: September 9\nSubject: New visitor check-in procedure\n\nStarting Monday, September 15, all visitors to the Lakeview office will be required to check in at the front desk using the new electronic kiosk. Visitors will enter their name, company, and the employee they are meeting, and the system will automatically send a text message to that employee. Visitors will also be given a printed badge, which must be worn visibly while they are in the building and returned to the front desk when they leave.\n\nEmployees who are expecting visitors are encouraged to preregister them on the intranet at least one day in advance. Preregistered visitors will receive an e-mail containing a QR code that they can scan at the kiosk, which will shorten their check-in time to under a minute. Please also remember that visitors must be accompanied by an employee at all times in areas beyond the lobby.\n\nThe previous paper sign-in sheet will be removed on September 12. Brief training sessions on the kiosk will be offered in the lobby on September 10 and 11 at 10:00 A.M. and 2:00 P.M. Questions may be directed to me at extension 318.",qs:[
 {type:'p7_main',err:18,q:"What is the purpose of the memo?",opts:["To announce the relocation of the front desk","To request volunteers for a training session","To remind employees to wear their badges","To explain a new procedure for receiving visitors"],ans:3,exp:"제목 'New visitor check-in procedure'와 첫 문장 'all visitors to the Lakeview office will be required to check in at the front desk using the new electronic kiosk'에서 새로운 방문객 체크인 절차를 안내하는 회람임을 알 수 있습니다. 배지 착용은 방문객에게 해당하는 내용이고, 안내 데스크 이전이나 자원봉사자 모집은 언급되지 않았습니다."},
 {type:'p7_detail',err:32,q:"According to the memo, what will happen when a visitor checks in at the kiosk?",opts:["An employee will be notified by text message.","A security guard will escort the visitor.","The visitor's photograph will be taken.","A parking pass will be printed."],ans:0,exp:"'the system will automatically send a text message to that employee'에서 방문객이 체크인하면 담당 직원에게 문자 메시지가 발송됨을 알 수 있습니다. 'send a text message to that employee'를 'An employee will be notified by text message'로 패러프레이즈했습니다. 사진 촬영이나 주차권 발급은 언급되지 않았습니다."},
 {type:'p7_detail',err:36,q:"How can employees reduce the time their visitors spend checking in?",opts:["By meeting them at the front desk","By calling the front desk in advance","By registering them online beforehand","By giving them a temporary badge"],ans:2,exp:"둘째 단락의 'preregister them on the intranet at least one day in advance'와 'which will shorten their check-in time to under a minute'에서 인트라넷에 미리 등록하면 체크인 시간이 줄어든다고 했습니다. 'preregister on the intranet'을 'registering them online beforehand'로 패러프레이즈했습니다."},
 {type:'p7_infer',err:54,q:"What is suggested about the training sessions?",opts:["They will last approximately one hour.","They will take place before the new system is required.","They are mandatory for all employees.","They will be conducted by the kiosk's manufacturer."],ans:1,exp:"새 절차는 9월 15일부터 시행되고 교육은 'September 10 and 11'에 열리므로, 교육이 새 시스템 의무화 이전에 진행된다는 것을 추론할 수 있습니다. 교육 시간의 길이, 참석 의무 여부, 진행자는 지문에 언급되지 않았습니다."}]},
{id:'p7-15',part:7,passage:"Hana Kim (10:12 A.M.)\nHi, Omar. Are you at the Westgate store yet? The regional manager is coming at 2:00 to see the new autumn display.\n\nOmar Haddad (10:14 A.M.)\nJust got here. The mannequins arrived, but the delivery only has four. We ordered six.\n\nHana Kim (10:15 A.M.)\nThat's a problem. The window design needs all six.\n\nOmar Haddad (10:16 A.M.)\nI called the supplier. They said the other two are still at their warehouse and won't be here until Thursday.\n\nHana Kim (10:18 A.M.)\nThursday is too late. Could we borrow two from the Elm Street store? They changed their display last week.\n\nOmar Haddad (10:19 A.M.)\nGood idea. I'll call Dana there now. If she has them, I can drive over and pick them up before noon.\n\nHana Kim (10:20 A.M.)\nPerfect. In the meantime, can you start setting up the clothing on the four we have? I'll be there by 11:30 to help with the lighting.\n\nOmar Haddad (10:21 A.M.)\nWill do. I'll text you as soon as I hear back from Dana.",qs:[
 {type:'p7_infer',err:42,q:"Where most likely do the writers work?",opts:["At a furniture warehouse","At a delivery company","At a clothing retailer","At an advertising agency"],ans:2,exp:"'the new autumn display', 'mannequins', 'The window design', 'setting up the clothing'과 매장 이름(Westgate store, Elm Street store) 등으로 보아 두 사람은 의류 매장에서 일한다고 추론할 수 있습니다. 배송 업체나 광고 대행사는 마네킹에 옷을 입히는 작업을 하지 않습니다."},
 {type:'p7_detail',err:28,q:"What problem does Mr. Haddad mention?",opts:["A store will open late.","Part of a delivery has not arrived.","A manager has canceled a visit.","Some clothing is damaged."],ans:1,exp:"10:14 메시지의 'The mannequins arrived, but the delivery only has four. We ordered six'에서 주문한 마네킹 6개 중 4개만 도착했다는 문제를 언급했습니다. 매장 개점 지연, 방문 취소, 의류 손상은 언급되지 않았습니다."},
 {type:'p7_intent',err:48,q:"At 10:18 A.M., what does Ms. Kim most likely mean when she writes, \"Thursday is too late\"?",opts:["The supplier should be replaced.","The delivery was scheduled for the wrong day.","The display cannot be changed this week.","The mannequins are needed before a manager's visit today."],ans:3,exp:"10:12 메시지에서 지역 관리자가 오늘 2시에 새 디스플레이를 보러 온다고 했고, 공급업체는 나머지 두 개가 목요일에나 온다고 했으므로, 'Thursday is too late'는 오늘 방문 전에 마네킹이 필요하다는 뜻입니다. 바로 이어서 다른 매장에서 빌리자고 제안한 것도 이를 뒷받침합니다. 공급업체 교체나 배송일 착오는 언급되지 않았습니다."},
 {type:'p7_detail',err:35,q:"What will Mr. Haddad most likely do next?",opts:["Contact an employee at another store","Drive to the supplier's warehouse","Adjust the lighting in the window","Reschedule the regional manager's visit"],ans:0,exp:"10:19 메시지의 'I'll call Dana there now'에서 Elm Street 매장의 Dana에게 전화하겠다고 했으므로 다른 매장 직원에게 연락할 것입니다. 창고 방문은 언급되지 않았고, 조명 작업은 Ms. Kim이 도울 일이며, 관리자 방문 일정 변경은 논의되지 않았습니다."}]},
{id:'p7-16',part:7,passage:"Brightline Signs & Graphics\n18 Foundry Lane, Dalton, OH 44615 · (330) 555-0192\n\nINVOICE #5120\nDate: October 2\nBill to: Harbor View Bistro, 92 Marina Drive, Dalton, OH 44615\nAttention: Claire Fontaine, Owner\n\nDescription | Qty | Unit Price | Amount\nIlluminated storefront sign, 2.4 m x 0.9 m (aluminum frame, LED lighting) | 1 | $1,850.00 | $1,850.00\nWindow lettering, vinyl, front entrance | 2 | $140.00 | $280.00\nA-frame sidewalk sign with changeable panels | 1 | $215.00 | $215.00\nInstallation (storefront sign only) | 1 | $300.00 | $300.00\n\nSubtotal: $2,645.00\nReturning-customer discount (5%): -$132.25\nSales tax (6.5%): $163.33\nTotal due: $2,676.08\n\nTerms: Payment is due within 30 days of the invoice date. A 2% discount applies to invoices paid in full within 10 days. Please include the invoice number on your check or bank transfer.\n\nNotes: Installation of the storefront sign is scheduled for October 9 between 8:00 A.M. and 11:00 A.M. The window lettering and A-frame sign will be delivered on the same visit. The LED components are covered by a three-year manufacturer's warranty. Thank you for choosing Brightline again!",qs:[
 {type:'p7_infer',err:44,q:"What is suggested about Harbor View Bistro?",opts:["It recently moved to a new location.","It has done business with Brightline before.","It is open seven days a week.","It ordered more than one storefront sign."],ans:1,exp:"'Returning-customer discount (5%)'와 마지막의 'Thank you for choosing Brightline again!'에서 Harbor View Bistro가 이전에도 Brightline을 이용한 적이 있음을 추론할 수 있습니다. 이전, 영업일, 여러 개의 간판 주문은 지문에서 확인할 수 없습니다."},
 {type:'p7_not',err:42,q:"What is NOT included in the order?",opts:["A lighted sign","Lettering for a window","A menu board","A portable sign"],ans:2,exp:"송장 항목에는 조명 간판(Illuminated storefront sign), 창문 글자(Window lettering), 이동식 입간판(A-frame sidewalk sign)이 있지만 메뉴판(menu board)은 없습니다. 'Illuminated'를 'lighted'로, 'A-frame sidewalk sign'을 'portable sign'으로 패러프레이즈했습니다."},
 {type:'p7_detail',err:30,q:"How can Harbor View Bistro reduce the total amount due?",opts:["By paying within ten days","By paying by bank transfer","By ordering additional signs","By picking up the items in person"],ans:0,exp:"'A 2% discount applies to invoices paid in full within 10 days'에서 10일 이내에 전액 납부하면 2% 할인을 받을 수 있음을 알 수 있습니다. 결제 방법(수표·계좌이체)에 따른 할인이나 직접 수령 할인은 언급되지 않았습니다."},
 {type:'p7_detail',err:24,q:"What will happen on October 9?",opts:["An invoice will be mailed.","A warranty will expire.","A payment will be due.","A sign will be installed."],ans:3,exp:"Notes의 'Installation of the storefront sign is scheduled for October 9 between 8:00 A.M. and 11:00 A.M.'에서 10월 9일에 매장 간판이 설치될 예정임을 알 수 있습니다. 납부 기한은 송장 날짜로부터 30일 이내이고, 보증은 3년입니다."}]},
{id:'p7-17',part:7,passage:"[지문 1 — 이메일]\nTo: registration@northernlogisticssummit.com\nFrom: Julian Park <j.park@verano-foods.com>\nDate: September 24\nSubject: Registration changes\n\nHello,\n\nI am registered for the full two days of the Northern Logistics Summit. When I registered, I selected the Warehouse Automation workshop, but I would now like to attend the Customs Documentation workshop instead, since my company began shipping products to Europe last month and I need to understand the paperwork involved. Please let me know if this change is possible.\n\nIn addition, my colleague Rena Soto would like to join me, but she can only attend the second day. Is single-day registration available?\n\nFinally, my train arrives at 9:40 A.M. on the first day, so I may be a few minutes late for the first session.\n\nThank you,\nJulian Park\nLogistics Coordinator, Verano Foods\n\n[지문 2 — 일정표]\nNorthern Logistics Summit — Program\nHalden Convention Center, October 15–16\n\nDay 1 (October 15)\n9:00–9:45 Opening Address: The Future of Freight — Grand Hall\n10:00–12:00 Workshops (choose one): Warehouse Automation — Room A; Customs Documentation — Room C; Fleet Fuel Efficiency — Room D\n12:00–1:30 Lunch — Terrace\n1:30–4:00 Panel Discussion: Regional Supply Chains — Grand Hall\n\nDay 2 (October 16)\n9:00–11:30 Exhibitor Showcase — Exhibition Hall\n11:30–1:00 Lunch — Terrace\n1:00–3:30 Workshops (choose one): Cold-Chain Logistics — Room A; Negotiating with Carriers — Room B\n\nRegistration fees: Both days, $340; Day 1 only, $200; Day 2 only, $160. Workshop changes may be requested free of charge until October 1.",qs:[
 {type:'p7_main',err:20,q:"Why did Mr. Park send the e-mail?",opts:["To cancel his registration","To ask for a refund","To request changes to his registration","To volunteer as a workshop speaker"],ans:2,exp:"제목이 'Registration changes'이고, 본문에서 워크숍 변경('I would now like to attend the Customs Documentation workshop instead')과 동료의 하루 등록 가능 여부를 문의하고 있으므로 등록 내용 변경을 요청하는 이메일입니다. 취소나 환불, 연사 지원은 언급되지 않았습니다."},
 {type:'p7_detail',err:46,q:"Where will Mr. Park most likely be at 10:30 A.M. on October 15?",opts:["In Room A","In Room C","In Room D","In the Grand Hall"],ans:1,exp:"이메일에서 Mr. Park은 Customs Documentation 워크숍으로 변경을 원했고, 일정표에 따르면 워크숍 변경은 10월 1일까지 무료로 가능한데 이메일은 9월 24일에 보냈으므로 변경이 가능합니다. 일정표에서 Customs Documentation은 Day 1 10:00–12:00에 Room C에서 열립니다. Room A는 원래 신청했던 Warehouse Automation 장소입니다."},
 {type:'p7_detail',err:48,q:"How much will Ms. Soto most likely pay to attend?",opts:["$120","$200","$340","$160"],ans:3,exp:"이메일에서 Ms. Soto는 'she can only attend the second day'라고 했고, 일정표의 등록비에서 'Day 2 only, $160'이므로 160달러를 지불할 것입니다. 200달러는 Day 1만 참석할 때, 340달러는 이틀 모두 참석할 때의 요금입니다."},
 {type:'p7_infer',err:56,q:"What is suggested about Mr. Park?",opts:["He will probably miss part of the opening address.","He has attended the summit in previous years.","He will give a presentation on Day 2.","He plans to stay at the Halden Convention Center."],ans:0,exp:"이메일에서 'my train arrives at 9:40 A.M. on the first day, so I may be a few minutes late for the first session'이라고 했고, 일정표에서 Day 1 첫 세션은 9:00–9:45 Opening Address이므로 개회 연설의 일부를 놓칠 것으로 추론할 수 있습니다. 이전 참석 경력, 발표, 숙박은 언급되지 않았습니다."},
 {type:'p7_infer',err:50,q:"What is indicated about Verano Foods?",opts:["It is headquartered in Halden.","It manufactures warehouse equipment.","It recently started exporting its products.","It sponsors the summit every year."],ans:2,exp:"이메일의 'my company began shipping products to Europe last month'에서 Verano Foods가 최근 유럽으로 제품 수출을 시작했음을 알 수 있습니다. 'began shipping products to Europe'을 'started exporting its products'로 패러프레이즈했습니다. 본사 위치, 창고 장비 제조, 후원은 언급되지 않았습니다."}]},
{id:'p7-18',part:7,passage:"Pembroke Street Market Returns for Its Tenth Season\n\nHOLLISTER (April 28) — The Pembroke Street Market will open for the season on Saturday, May 10, marking ten years since a handful of local farmers first set up tables in a parking lot on the east side of town. [1] This year, the market will feature more than 60 vendors selling fresh produce, baked goods, handmade crafts, and prepared foods.\n\nMarket manager Leah Brandt said the biggest change this season is the location. [2] \"We simply outgrew the old site,\" Brandt explained. \"The new plaza gives us twice the space, plus covered seating and access to public restrooms.\" The market will operate every Saturday from 8:00 A.M. to 1:00 P.M. through October 25.\n\nTo celebrate the anniversary, the opening day will include live music, cooking demonstrations by chefs from three Hollister restaurants, and a children's gardening activity. [3] Vendors will also offer a tenth-anniversary tote bag free to the first 200 shoppers.\n\nBrandt credited the market's growth to the loyalty of its customers. \"Many of the people who shopped with us that first summer still come every week,\" she said. [4] For a full list of vendors and a map of the new site, visit www.pembrokemarket.org.",qs:[
 {type:'p7_main',err:22,q:"What is the purpose of the article?",opts:["To announce the opening of a seasonal market","To profile a local restaurant owner","To report on a city council decision","To encourage residents to become vendors"],ans:0,exp:"첫 문장 'The Pembroke Street Market will open for the season on Saturday, May 10'에서 계절 시장의 개장을 알리는 기사임을 알 수 있습니다. 식당 주인 소개, 시의회 결정, 판매자 모집은 기사의 목적이 아닙니다."},
 {type:'p7_detail',err:30,q:"What is indicated about the Pembroke Street Market?",opts:["It charges an admission fee.","It is open in the evenings.","It accepts only food vendors.","It operates one day per week."],ans:3,exp:"둘째 단락의 'The market will operate every Saturday from 8:00 A.M. to 1:00 P.M.'에서 매주 토요일 하루만 운영됨을 알 수 있습니다. 운영 시간은 오전이고, 공예품(handmade crafts) 판매자도 있으며, 입장료는 언급되지 않았습니다."},
 {type:'p7_detail',err:38,q:"What is mentioned about the opening day?",opts:["It will begin earlier than usual.","Some activities will be led by professional cooks.","Tote bags will be sold to raise funds.","A city official will give a speech."],ans:1,exp:"셋째 단락의 'cooking demonstrations by chefs from three Hollister restaurants'에서 식당 셰프들이 요리 시연을 한다고 했습니다. 'chefs'를 'professional cooks'로 패러프레이즈했습니다. 토트백은 판매가 아니라 선착순 200명에게 무료로 제공되며, 개장 시간 변경이나 공무원 연설은 언급되지 않았습니다."},
 {type:'p7_insert',err:58,q:"In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong?\n\"The market has moved from the parking lot to the newly renovated Civic Plaza on Linden Avenue.\"",opts:["[1]","[2]","[3]","[4]"],ans:1,exp:"주어진 문장은 시장이 주차장에서 새 광장으로 이전했다는 내용입니다. [2] 바로 앞에서 '이번 시즌 가장 큰 변화는 장소'라고 했고, 바로 뒤에서 'We simply outgrew the old site'와 'The new plaza'가 언급되므로, 'the old site'와 'The new plaza'가 가리키는 대상을 소개하는 [2]가 정답입니다. 다른 위치에서는 'The new plaza'가 무엇인지 알 수 없습니다."}]}
);
