"p2-42": {s:"프랑크푸르트 무역 박람회에 참석하시나요?", qs:[{o:["멋진 쇼였어요.","아니요, 그 주에는 휴가예요.","부스는 입구 근처에 있어요."]}]},
"p2-43": {s:"검사 결과를 전자적으로 보낼 수 있나요?", qs:[{o:["샘플을 두 번 검사했어요.","택배로 보냈어요.","기술자에게 물어볼게요."]}]},
"p2-44": {s:"송장을 우편으로 받으시겠어요, 이메일로 받으시겠어요?", qs:[{o:["이메일이면 돼요, 감사합니다.","네, 맞아요.","우편은 열 시쯤 와요."]}]},
"p2-45": {s:"면접을 오전에 할까요, 점심 이후에 할까요?", qs:[{o:["샌드위치가 맛있었어요.","지원자들에게 편한 쪽으로요.","그중 두 명이 채용됐어요."]}]},
"p2-46": {s:"기조연설자는 오늘 도착하나요, 내일 도착하나요?", qs:[{o:["네, 그래요.","그는 한 시간 넘게 연설했어요.","그녀의 항공편이 취소됐어요."]}]},
"p2-47": {s:"박물관은 월요일에 문을 닫지 않나요?", qs:[{o:["겨울철에만요.","전시가 아주 흥미로웠어요.","여기서 1마일 정도 거리예요."]}]},
"p2-48": {s:"새 지역 책임자를 만나보셨죠, 그렇죠?", qs:[{o:["다음 모퉁이에서 왼쪽으로 도세요.","아직이요, 그녀는 계속 출장 중이었어요.","그 지역에 비가 많이 왔어요."]}]},
"p2-49": {s:"배관공이 정오까지 온다고 하지 않았나요?", qs:[{o:["네, 싱크대는 부엌에 있어요.","저는 치킨으로 할게요.","고속도로가 많이 막혀요."]}]},
"p2-50": {s:"분기 예산이 지난주에 승인되지 않았나요?", qs:[{o:["오카포 씨가 아직 서명을 해야 해요.","우리 숙소는 2층에 있어요.","예산을 조금 초과했어요."]}]},
"p2-51": {s:"전시장 에어컨이 작동하지 않아요.", qs:[{o:["쇼는 여덟 시에 시작해요.","바로 관리업체에 전화할게요.","네, 그 방은 꽤 넓어요."]}]},
"p2-52": {s:"번역 업체에 긴급 견적을 요청합시다.", qs:[{o:["기사에서 그의 말을 인용했어요.","스페인어로 번역됐어요.","그쪽 사무실은 월요일까지 닫혀 있어요."]}]},
"p2-53": {s:"메뉴판에 어떤 글꼴을 써야 할지 모르겠어요.", qs:[{o:["고객이 스타일 가이드를 보내지 않았나요?","오늘의 수프는 렌틸콩이에요.","그 사진작가가 그걸 아주 좋아해요."]}]},
"p2-54": {s:"배송 밴의 보증 기간이 다음 달에 만료돼요.", qs:[{o:["그는 아주 믿을 만한 운전기사예요.","그럼 연장해야 할까요?","소포가 제때 도착했어요."]}]},
"p3-01": {s:["안녕하세요, 벤튼 오피스 서플라이의 로라입니다. 월요일에 주문하신 인체공학 의자 20개 건으로 전화드렸습니다. 안타깝게도 회색 모델은 이달 말까지 재고가 없습니다.","아, 그건 문제네요. 저희가 15일에 새 사무실로 이사하는데, 그때까지 의자가 필요하거든요.","이해합니다. 같은 모델의 검은색은 있어서 목요일까지 배송해 드릴 수 있습니다. 불편을 드린 점을 감안해 주문 금액의 10퍼센트도 할인해 드리겠습니다.","검은색도 괜찮습니다. 매니저에게 확인한 뒤 한 시간 안에 다시 전화드리겠습니다."], qs:[{q:"여자가 전화한 이유는 무엇인가?", o:["배송 주소를 확인하려고","상품이 없다고 알리려고","결제를 요청하려고","설치 일정을 잡으려고"]},{q:"여자는 무엇을 제안하는가?", o:["무료 배송","할인","보증 기간 연장","제품 샘플"]},{q:"남자는 다음에 무엇을 할 것 같은가?", o:["매장을 방문한다","매니저와 이야기한다","주문을 취소한다","사무실 치수를 잰다"]}]},
"p3-02": {s:["실례합니다, 알바레즈 씨. 금요일 오전에 대회의실을 예약하고 싶은데요. 지역 팀에 마케팅 계획을 발표할 예정이라서요.","확인해 볼게요... 금요일 오전은 이미 재무부 예산 검토로 예약되어 있네요. 하지만 한 시 이후에는 비어 있어요.","음, 지역 직원 일부가 오후에 비행기로 돌아가거든요. 프로젝터가 있는 다른 회의실이 있나요?","4B호실에 하나 있고, 열두 명이 앉을 수 있어요. 금요일 하루 종일 비어 있고요. 원하시면 지금 바로 예약해 드릴게요."], qs:[{q:"남자는 무엇을 하고 싶어 하는가?", o:["회의실을 예약하기","프로젝터를 구매하기","항공편을 변경하기","재무부에 합류하기"]},{q:"남자가 \"지역 직원 일부가 오후에 비행기로 돌아가거든요\"라고 말한 이유는 무엇인가?", o:["오후 시간이 안 되는 이유를 설명하려고","출장비 환급을 요청하려고","발표 연기를 제안하려고","일정에 대해 불평하려고"]},{q:"여자는 4B호실에 대해 뭐라고 말하는가?", o:["보수 공사 중이다.","프로젝터가 있다.","스무 명이 앉을 수 있다.","금요일에 예약되어 있다."]}]},
"p3-03": {s:["안녕하세요. 지난주에 여기서 이 커피 메이커를 샀는데, 이틀 만에 작동을 멈췄어요. 환불을 받고 싶습니다.","그런 일이 있으셨다니 죄송합니다. 영수증은 가지고 계신가요?","네, 여기 있어요. 원래 상자도 가져왔습니다.","좋습니다. 30일 이내이니 카드로 전액 환불해 드릴 수 있습니다. 아니면 원하시면, 마침 새 모델이 막 입고되었는데 추가 비용 없이 교환해 드릴 수도 있어요.","사실 새 모델이 괜찮을 것 같네요. 가기 전에 설정 방법을 보여 주실 수 있나요?"], qs:[{q:"화자들은 어디에 있을 것 같은가?", o:["식당에","가전제품 매장에","수리점에","커피숍에"]},{q:"남자는 여자에게 무엇을 요청하는가?", o:["전화번호","영수증","신용카드","보증서"]},{q:"여자는 남자에게 무엇을 해 달라고 요청하는가?", o:["기술자를 부르기","제품을 배송하기","제품 사용법을 시연하기","할인을 해 주기"]}]},
"p3-04": {s:["다음 달 리더십 워크숍에 관한 이메일 보셨어요? 등록이 20일에 마감되던데요.","봤는데, 시카고에서 열리잖아요. 회사에서 출장비를 지원해 줄지 모르겠어요.","사실 오늘 아침에 교육부에 물어봤어요. 지점당 최대 다섯 명까지 항공료와 호텔 2박을 환급해 준다고 하더라고요.","아, 그럼 얘기가 다르죠. 그럼 오늘 등록 양식을 작성할게요. 상사 승인이 필요한지 아세요?","네—양식 맨 아래에 서명란이 있어요."], qs:[{q:"화자들은 주로 무엇에 대해 이야기하고 있는가?", o:["채용 공고","교육 행사","영업 출장","회사 합병"]},{q:"남자는 교육부에서 무엇을 알게 되었는가?", o:["워크숍이 취소되었다.","일부 비용이 지원된다.","마감일이 연장되었다.","관리자만 참석할 수 있다."]},{q:"남자는 양식에 무엇이 필요하다고 말하는가?", o:["사진","결제","상사의 서명","호텔 예약 확인서"]}]},
"p3-05": {s:["서밋 트래블에 전화 주셔서 감사합니다. 무엇을 도와드릴까요?","안녕하세요, 다음 달 영업 콘퍼런스 때문에 덴버행 항공편을 예약했는데, 매니저가 방금 콘퍼런스 날짜가 바뀌었다고 하네요. 5일부터 7일이 아니라 12일부터 14일로요.","그렇군요. 예약을 확인해 보겠습니다... 그 날짜로 항공편을 옮겨 드릴 수 있는데, 그 주는 요금이 80달러 정도 더 비쌉니다.","괜찮아요—회사에서 부담할 겁니다. 호텔도 예약을 변경할 수 있는지 확인해 주시겠어요? 호텔도 그쪽을 통해 예약했거든요.","물론입니다. 호텔에 연락한 뒤 오늘 중으로 확인 이메일을 보내 드리겠습니다."], qs:[{q:"남자가 전화한 이유는 무엇인가?", o:["여행을 취소하려고","여행 날짜를 변경하려고","환불을 요청하려고","회의실을 예약하려고"]},{q:"여자는 새 항공편에 대해 뭐라고 말하는가?", o:["모두 매진되었다.","비용이 더 든다.","더 일찍 출발한다.","경유가 필요하다."]},{q:"여자는 다음에 무엇을 할 것인가?", o:["호텔에 전화한다","환불을 처리한다","티켓을 출력한다","매니저와 이야기한다"]}]},
"p3-06": {s:["안녕하세요, 레이철. 다음 주 근무 일정에 대해 얘기하고 싶었어요. 서버 두 명이 휴가를 신청해서 토요일 밤에 인력이 부족해요.","토요일 근무를 할 수는 있는데, 이미 금요일 밤과 일요일 브런치에 배정되어 있어요. 그러면 사흘 연속이 되는데요.","무리한 부탁인 건 알아요. 토요일에 근무해 주면 대신 수요일에 쉬게 해 줄 수 있고, 주말 보너스 수당도 받게 될 거예요.","그렇다면 할게요. 카를로스에게 수요일에 저 대신 근무할 필요 없다고 알려야 할까요?","그건 제가 처리할게요. 고마워요, 레이철."], qs:[{q:"화자들은 어디에서 일할 것 같은가?", o:["호텔에서","식당에서","병원에서","소매점에서"]},{q:"여자가 \"그러면 사흘 연속이 되는데요\"라고 말한 이유는 무엇인가?", o:["우려를 표현하려고","일정을 확인하려고","승진을 요청하려고","보너스를 거절하려고"]},{q:"남자는 여자에게 무엇을 제안하는가?", o:["다른 날 휴무","급여 인상","추가 교육","더 이른 근무"]}]},
"p3-07": {s:["여보세요, IT 헬프 데스크입니다. 데이나입니다.","안녕하세요, 데이나. 회계부의 케빈입니다. 경비 시스템에 로그인이 안 돼요. 비밀번호가 만료됐다고 계속 나오는데, 2주 전에 바꿨거든요.","이상하네요. 아—문제를 찾았어요. 주말에 시스템이 업그레이드돼서 업그레이드 후에 모두 비밀번호를 한 번 더 재설정해야 해요. 금요일에 이에 관한 이메일이 있었어요.","제가 놓쳤나 봐요. 그럼 어떻게 재설정하죠?","로그인 페이지에서 \"비밀번호 찾기\"를 클릭하면 이메일로 링크가 갈 거예요. 10분 안에 안 오면 다시 전화 주세요. 제가 수동으로 재설정해 드릴게요."], qs:[{q:"남자는 어떤 문제가 있는가?", o:["신분증을 잃어버렸다.","시스템에 접속할 수 없다.","컴퓨터가 느리다.","잘못된 송장을 받았다."]},{q:"여자에 따르면 문제의 원인은 무엇인가?", o:["시스템 업그레이드","입력 오류","정전","만료된 계정"]},{q:"여자는 남자에게 무엇을 하라고 말하는가?", o:["컴퓨터를 재시작하기","IT 사무실을 방문하기","로그인 페이지의 링크를 사용하기","매니저에게 연락하기"]}]},
"p3-08": {s:["프리야, 대행사가 봄 캠페인용으로 보낸 로고 디자인 두 개 볼 시간 있었어요?","봤어요. 저는 두 번째가 더 좋아요—색상이 우리 패키징과 더 잘 어울려요. 그런데 소셜 미디어 아이콘처럼 작게 쓰면 글꼴이 읽기 어렵더라고요.","저도 같은 생각이었어요. 두 번째 디자인은 유지하되 더 굵은 글꼴을 시도해 달라고 요청하는 게 어때요?","좋아요. 대행사에서 수요일까지 최종 피드백이 필요하다고 했으니, 오늘 이메일을 보내 주실 수 있어요? 저는 오후 내내 고객 미팅이 있어서요.","물론이죠, 점심 먹고 바로 할게요."], qs:[{q:"화자들은 무엇에 대해 이야기하고 있는가?", o:["채용 결정","로고 디자인","제품 가격","고객 불만"]},{q:"여자는 두 번째 디자인의 어떤 점이 마음에 드는가?", o:["크기","글꼴","색상","비용"]},{q:"남자는 점심 후에 무엇을 할 것인가?", o:["고객과 만난다","이메일을 보낸다","대행사를 방문한다","로고를 다시 디자인한다"]}]},
"p3-09": {s:["안녕하세요, 귀사 웹사이트에 올라온 하버 스트리트의 사무실 공간 때문에 전화드렸습니다. 아직 임대 가능한가요?","네, 가능합니다. 3층에 있는 2천 제곱피트 규모의 공간이고, 이전 세입자가 바로 지난주에 나갔습니다. 본인 사업을 위한 공간을 찾고 계신가요?","네, 작은 건축 사무소를 운영하는데 현재 사무실이 너무 좁아졌어요. 매물 정보에 주차가 포함된다고 되어 있던데, 몇 대까지 가능한가요?","임대 계약에 지하 주차장 지정 주차 6면이 포함됩니다. 더 필요하시면 옆 건물에서 월 단위로 자리를 임대하고 있어요.","당분간은 여섯 대면 충분할 것 같아요. 이번 주 중에 공간을 볼 수 있을까요?","물론입니다. 목요일 오전에 다른 고객에게 보여 드리기로 되어 있지만, 수요일 두 시에 거기서 뵐 수 있어요. 미리 살펴보실 수 있도록 지금 바로 평면도를 이메일로 보내 드리겠습니다."], qs:[{q:"여자가 전화한 이유는 무엇인가?", o:["임대 계약을 갱신하려고","건물 문제를 신고하려고","부동산 매물에 대해 문의하려고","가구 배송을 준비하려고"]},{q:"여자는 무엇에 대해 묻는가?", o:["주차 공간의 수","월 임대료","건물의 연식","임대 기간"]},{q:"남자는 다음에 무엇을 할 것인가?", o:["다른 고객에게 전화한다","여자의 사무실을 방문한다","주차 자리를 예약한다","이메일로 문서를 보낸다"]}]},
"p3-10": {s:["안녕하세요. 10시 45분 덴버행 항공편 체크인하려고요. 여기 여권입니다.","감사합니다, 오카포 씨. 14C 좌석으로 예약되어 있네요. 오늘 위탁하실 수하물이 있으신가요?","이 여행 가방 하나뿐입니다. 실은 앞쪽에 더 가까운 통로 좌석을 받고 싶었는데요. 덴버에서 환승 항공편이 있는데 환승 시간이 50분밖에 안 돼서요.","확인해 볼게요. 14열도 이미 앞쪽에 꽤 가까운 편이에요. 그보다 앞쪽 통로 좌석은 넓은 좌석 구역뿐인데, 추가로 40달러가 듭니다.","그래도 50분은 빠듯해서요. 그걸로 할게요.","알겠습니다, 새 좌석은 6C입니다. 환승 시간이 촉박하다는 메모도 예약에 추가해 둘 테니, 항공편이 지연되면 승무원이 먼저 내리게 해 드릴 수 있을 거예요."], qs:[{q:"대화는 어디에서 이루어지고 있을 것 같은가?", o:["여행사에서","공항 체크인 카운터에서","기차역에서","호텔 프런트에서"]},{q:"남자가 \"그래도 50분은 빠듯해서요\"라고 말한 이유는 무엇인가?", o:["더 늦은 항공편을 요청하려고","지연에 대해 불평하려고","환불을 요청하려고","추가 요금을 내는 이유를 설명하려고"]},{q:"여자는 무엇을 하겠다고 말하는가?", o:["남자의 예약에 메모를 남긴다","남자의 여행 가방을 무료로 위탁한다","남자를 비즈니스 클래스로 업그레이드한다","덴버의 항공사에 연락한다"]}]},
"p3-11": {s:["안녕하세요, 린드크비스트 선생님과 두 시에 예약이 있는데요. 제 이름은 베아트리스 모레노입니다.","어서 오세요, 모레노 씨. 여기 처음 오신 환자분이시니 이 두 가지 양식을 작성해 주셔야 합니다. 하나는 병력이고, 다른 하나는 보험 정보입니다.","네. 아, 지난달에 보험사를 바꿨어요. 새 카드는 안 가져왔는데, 휴대폰에서 증권 번호를 찾을 수 있어요.","괜찮습니다. 증권 번호와 보험사 이름만 적어 주시면 저희가 확인하겠습니다. 그리고 오늘 오후에는 선생님 진료가 20분 정도 늦어지고 있습니다.","괜찮아요. 기다리는 동안 커피 한 잔 마실 수 있는 곳이 있을까요?","1층에 엘리베이터 바로 옆에 카페가 있습니다. 선생님이 진료 준비가 되면 바로 휴대폰으로 전화드리겠습니다."], qs:[{q:"남자는 누구일 것 같은가?", o:["약사","의사","보험 설계사","접수 담당자"]},{q:"여자는 어떤 문제를 언급하는가?", o:["예약 시간에 늦게 도착했다.","휴대폰을 가져오는 것을 잊었다.","보험 카드를 가지고 있지 않다.","진료실을 찾을 수 없다."]},{q:"남자는 무엇을 하겠다고 말하는가?", o:["여자에게 커피를 가져다준다","의사가 가능해지면 여자에게 전화한다","여자의 예약을 변경한다","보험사에 연락한다"]}]},
"p3-12": {s:["기다려 주셔서 감사합니다, 다나카 씨. 차량 점검을 마쳤습니다. 브레이크 패드가 심하게 마모되어서, 더 운행하시기 전에 꼭 교체하셔야 합니다.","그럴까 봐 걱정했어요. 비용은 얼마나 드나요?","부품과 공임을 합쳐 320달러 정도입니다. 오늘 오후 다섯 시까지 끝낼 수 있습니다.","다섯 시요? 네 시 반에 기차역에서 고객을 픽업해야 하는데요.","그러시면 오늘 하루 저희 대차를 이용하셔도 됩니다. 차량을 찾으러 오실 때 다시 가져다주시면 됩니다.","그러면 큰 도움이 되겠네요. 아, 그리고 작업하시는 김에 타이어 공기압도 확인해 주시겠어요? 어제 경고등이 켜졌거든요."], qs:[{q:"남자는 무엇을 교체해야 한다고 말하는가?", o:["브레이크 패드","타이어","배터리","헤드라이트"]},{q:"여자가 \"네 시 반에 기차역에서 고객을 픽업해야 하는데요\"라고 말한 이유는 무엇인가?", o:["역까지 가는 길을 물으려고","가격이 너무 비싼 이유를 설명하려고","시간이 맞지 않음을 나타내려고","남자에게 수리를 미루라고 제안하려고"]},{q:"여자는 남자에게 무엇을 해 달라고 요청하는가?", o:["할인을 해 주기","타이어 공기압을 확인하기","차가 준비되면 전화하기","기차역까지 태워다 주기"]}]},
"p3-13": {s:["다니엘, 원예 책의 수정된 원고를 볼 시간 있었어요? 저자가 월요일에 보냈던데요.","어젯밤에 앞부분 절반을 읽었어요. 새로 추가된 컨테이너 가드닝 챕터는 아주 좋은데, 분량이 걱정돼요. 이제 400페이지가 넘어서 인쇄 비용이 꽤 많이 오를 거예요.","저도 그 점을 알아챘어요. 식물 목록 중 일부를 인쇄하는 대신 보조 웹사이트로 옮기면 어떨까요?","그건 괜찮을 것 같네요. 어차피 마케팅팀에서 온라인 콘텐츠를 더 달라고 요청해 왔으니까요.","좋아요. 그럼 제가 저자에게 그 변경을 제안하는 이메일 초안을 쓸까요? 이달 말까지 최종 파일을 인쇄소에 보내기로 되어 있잖아요.","그렇게 해 주세요. 그리고 마케팅의 프리야에게도 참조를 걸어서 어떻게 진행되는지 알 수 있게 해 주세요."], qs:[{q:"화자들은 어떤 업계에서 일할 것 같은가?", o:["조경","출판","웹 디자인","광고"]},{q:"남자는 무엇을 걱정하는가?", o:["마감일을 놓치는 것","저자를 잃는 것","새 인쇄소를 찾는 것","제작 비용이 증가하는 것"]},{q:"남자가 \"어차피 마케팅팀에서 온라인 콘텐츠를 더 달라고 요청해 왔으니까요\"라고 말한 이유는 무엇인가?", o:["여자의 제안을 지지하려고","프로젝트 지연을 설명하려고","추가 인력을 요청하려고","마케팅팀을 비판하려고"]}]},
"p3-14": {s:["안녕하세요, 알바레즈 씨, 그린필드 농장의 톰입니다. 내일 귀하의 식당으로 가는 배송 건으로 전화드렸습니다. 안타깝게도 이번 주 폭우로 상추 작물이 많이 손상되어, 주문하신 양의 절반밖에 보내 드릴 수 없습니다.","아, 이런. 토요일에 큰 출장 연회가 있는데 샐러드가 메뉴에 있어요. 대신 보내 주실 수 있는 다른 게 있을까요?","시금치와 케일은 충분히 있습니다. 온실에서 재배해서 비의 영향을 받지 않았어요. 킬로당 같은 가격으로 대체해 드릴 수 있습니다.","시금치면 되겠어요. 부족한 상추 대신 시금치 10킬로로 할게요.","알겠습니다. 송장을 수정해서 오늘 오후에 수정본을 보내 드리겠습니다. 그리고 배송은 평소처럼 내일 아침 일곱 시까지 도착할 겁니다.","완벽해요. 미리 알려 주셔서 감사합니다."], qs:[{q:"남자가 전화한 이유는 무엇인가?", o:["주문에 문제가 있음을 알리려고","출장 연회 예약을 확인하려고","새 제품군을 소개하려고","배송 대금 결제를 요청하려고"]},{q:"남자는 시금치에 대해 뭐라고 말하는가?", o:["상추보다 저렴하다.","날씨에 손상되지 않았다.","토요일에 배송될 것이다.","소량만 구할 수 있다."]},{q:"남자는 오늘 오후에 여자에게 무엇을 보낼 것인가?", o:["제품 카탈로그","배송 일정표","케일 샘플","수정된 송장"]}]},
"p4-01": {s:["그린웨이 마켓 고객 여러분께 안내 말씀드립니다. 앞으로 두 시간 동안 모든 신선 베이커리 제품을 20퍼센트 할인합니다. 빵, 머핀, 그리고 매일 아침 갓 구워내는 인기 블루베리 파이가 포함됩니다. 또한 이번 토요일 오전 11시에 델리 코너에서 무료 요리 시연회를 개최한다는 점도 잊지 마세요. 셰프 마르코가 30분 안에 3코스 저녁 식사를 준비하는 방법을 보여 드립니다. 자리가 한정되어 있으니 고객 서비스 데스크에서 신청해 주세요. 그린웨이 마켓을 이용해 주셔서 감사합니다."], qs:[{q:"안내 방송은 어디에서 이루어지고 있는가?", o:["식당에서","식료품점에서","요리 학교에서","빵집에서"]},{q:"토요일에 무슨 일이 있을 것인가?", o:["새 코너가 문을 연다.","요리 시연회가 열린다.","가격이 인하된다.","셰프가 채용된다."]},{q:"청자들은 무엇을 하도록 권장되는가?", o:["데스크에서 신청하기","무료 샘플 시식하기","설문지 작성하기","웹사이트 방문하기"]}]},
"p4-02": {s:["안녕하세요, 다나카 씨, 하버 치과의 제니퍼 로우입니다. 이번 주 목요일 10시 30분에 김 선생님과 예약이 있으시다는 것을 알려 드리려고 전화드렸습니다. 환자 양식이 새로 바뀌어서 새 양식을 작성하셔야 하니, 15분 정도 일찍 와 주세요. 또한 지난 방문 이후 보험사를 바꾸셨다면 새 보험 카드를 가져와 주세요. 예약을 변경하셔야 한다면 최소 24시간 전에 555-0142로 전화 주세요. 감사합니다, 목요일에 뵙겠습니다."], qs:[{q:"메시지의 목적은 무엇인가?", o:["결제를 확인하려고","청자에게 예약을 상기시키려고","새 의사를 소개하려고","새 진료 시간을 알리려고"]},{q:"청자는 왜 일찍 도착해야 하는가?", o:["주차하기 위해","양식을 작성하기 위해","새 치과의사를 만나기 위해","할인을 받기 위해"]},{q:"청자가 예약을 변경해야 한다면 무엇을 해야 하는가?", o:["이메일을 보낸다","사무실을 방문한다","하루 전에 전화한다","김 선생님과 이야기한다"]}]},
"p4-03": {s:["마치기 전에, 우리 고객 서비스팀에 관한 소식을 공유하고자 합니다. 다음 달부터 평일 전화 지원 시간을 오후 9시까지 연장할 예정입니다. 아시다시피 우리 고객 중 다수가 서부 해안에 있는데, 설문조사에서 현재 다섯 시 마감 시간이 불편하다고 알려 주셨습니다. 추가 시간을 담당하기 위해 상담원 세 명을 추가로 채용하고, 기존 직원에게는 유연 근무제도 제공할 예정입니다. 저녁 근무에 관심이 있으시면 금요일까지 팀 리더에게 알려 주세요. 오늘 오후에 이메일로 세부 사항을 보내 드리겠습니다."], qs:[{q:"화자는 어떤 변화를 발표하고 있는가?", o:["새 사무실 위치","더 긴 지원 시간","가격 인상","새 설문조사"]},{q:"화자에 따르면 이 변화는 왜 이루어지는가?", o:["비용을 줄이기 위해","고객 피드백에 대응하기 위해","규정을 준수하기 위해","경쟁사와 경쟁하기 위해"]},{q:"화자는 오늘 오후에 무엇을 할 것인가?", o:["지원자를 면접한다","팀 리더들과 만난다","이메일을 보낸다","설문조사를 실시한다"]}]},
"p4-04": {s:["안녕하세요, 여러분, 할랜드 글라스웍스 공장 견학에 오신 것을 환영합니다. 저는 올리버이고, 앞으로 90분 동안 여러분의 가이드를 맡겠습니다. 먼저 용해로실에서 시작하겠습니다. 그곳에서 장인들이 녹인 유리를 손으로 성형하는 모습을 보실 수 있고, 이어서 디자인 스튜디오와 포장 구역으로 이동하겠습니다. 항상 노란 선 뒤에 계셔 주세요—용해로는 1천 도가 넘습니다. 사진 촬영은 디자인 스튜디오를 제외한 모든 곳에서 가능합니다. 그곳에서는 아직 출시되지 않은 제품을 작업하고 있기 때문입니다. 견학이 끝나면 기념품점의 모든 상품을 20퍼센트 할인받을 수 있는 쿠폰을 드립니다. 자, 저를 따라오세요."], qs:[{q:"화자는 누구일 것 같은가?", o:["공장 견학 가이드","안전 검사관","유리 공예가","매장 관리자"]},{q:"청자들은 디자인 스튜디오에서 무엇을 하지 말라고 요청받는가?", o:["제품을 만지는 것","사진을 찍는 것","큰 소리로 말하는 것","휴대폰을 사용하는 것"]},{q:"청자들은 견학이 끝나면 무엇을 받을 것인가?", o:["무료 샘플","할인 쿠폰","지도","수료증"]}]},
"p4-05": {s:["메트로 라디오를 듣고 계십니다. 오후 교통 정보입니다. 시내로 향하는 운전자분들은 5번가 다리를 피하셔야 합니다. 긴급 보수 공사로 양방향 모두 폐쇄되었습니다. 시 당국은 다리가 금요일 오전까지 다시 개통될 것으로 예상한다고 밝혔습니다. 그동안은 리버사이드 터널이나 링컨 대로를 우회 경로로 이용하세요. 또한 20번 고속도로 동쪽 방향 차선은 14번 출구 근처에서 고장 난 트럭 때문에 서행 중이지만, 작업반이 현장에 있어 곧 차선이 정리될 예정입니다. 30분 후에 다시 교통 정보를 전해 드리겠습니다. 이제 다시 음악으로 돌아갑니다."], qs:[{q:"방송은 주로 무엇에 관한 것인가?", o:["일기 예보","도로 상황","건설 프로젝트","음악 축제"]},{q:"5번가 다리는 왜 폐쇄되었는가?", o:["퍼레이드 때문에","홍수 때문에","긴급 보수 공사 때문에","사고 때문에"]},{q:"다음 교통 정보는 언제 제공되는가?", o:["10분 후에","30분 후에","한 시간 후에","금요일에"]}]},
"p4-06": {s:["안녕하십니까, 그리고 와 주신 모든 분께 감사드립니다. 오늘 밤 우리는 올해의 지역사회 봉사상 수상자인 엘레나 토레스 씨를 기리기 위해 이 자리에 모였습니다. 지난 5년간 토레스 씨는 우리의 연례 식품 기부 행사를 주관해 왔으며, 작년 한 해에만 지역 가정을 위해 10톤이 넘는 식품을 모았습니다. 또한 시의 문해 교육 프로그램을 위해 200명이 넘는 자원봉사자를 모집했습니다. 그녀의 활동이 놀라운 점은 이 모든 일을 자신의 회계 사무소를 운영하면서 해냈다는 것입니다. 토레스 씨, 무대로 올라와 상을 받아 주십시오. 그리고 수상 소감 후에는 모두 정원에서 열리는 리셉션에 함께해 주시기 바랍니다."], qs:[{q:"담화의 목적은 무엇인가?", o:["신입 직원을 소개하려고","상을 수여하려고","모금 목표를 발표하려고","새 시설을 개관하려고"]},{q:"화자는 토레스 씨의 어떤 점이 놀랍다고 말하는가?", o:["최근에 이 도시로 이사했다.","자신의 사업체를 가지고 있다.","전문 요리사이다.","전에도 이 상을 받았다."]},{q:"토레스 씨가 연설한 후에 무슨 일이 있을 것인가?", o:["저녁 식사가 제공된다.","영상이 상영된다.","리셉션이 열린다.","자원봉사자들이 표창을 받는다."]}]},
"p4-07": {s:["안녕하세요, 웨스턴 컨설팅의 찬드라 씨께 남기는 메시지입니다. 에이펙스 오피스 서플라이의 루이스입니다. 화요일에 주문하신 복사 용지 12상자와 토너 카트리지 2개 건으로 전화드렸습니다. 용지는 발송되어 내일 도착할 예정입니다. 하지만 귀사의 프린터 모델용 카트리지는 제조사에서 입고 대기 중이라 앞으로 2주 동안은 들어오지 않을 것으로 예상됩니다. 다른 브랜드의 호환 카트리지는 재고가 있는데, 실제로 약 10퍼센트 더 저렴합니다. 그것으로 대체하길 원하시면 오늘 다섯 시 전에 내선 204번으로 전화 주세요. 내일 배송에 함께 나가도록 하겠습니다. 그렇지 않으면 원래 카트리지를 계속 주문해 두고 도착하면 알려 드리겠습니다. 감사합니다."], qs:[{q:"메시지의 목적은 무엇인가?", o:["결제를 요청하려고","주문 진행 상황을 알리려고","새 프린터를 광고하려고","회의 시간을 확인하려고"]},{q:"화자는 대체 제품에 대해 뭐라고 말하는가?", o:["같은 제조사에서 만든다.","2주 후에 도착한다.","원래 제품보다 저렴하다.","보증 기간이 더 길다."]},{q:"화자는 청자에게 무엇을 해 달라고 요청하는가?", o:["특정 시간까지 회신 전화하기","매장을 직접 방문하기","원래 주문을 취소하기","영수증 사본을 보내기"]}]},
"p4-08": {s:["2천 년 전 도시 생활이 어땠을지 궁금했던 적이 있으신가요? 이번 봄, 리버사이드 역사박물관이 여러분을 그 답을 찾는 자리로 초대합니다. 새 전시 '고대 로마의 거리'는 4월 3일에 개막하며, 이탈리아 전역의 박물관에서 대여한 300점이 넘는 유물을 선보이는데, 그중 다수는 유럽 밖에서 한 번도 전시된 적이 없습니다. 실물 크기로 재현한 로마 시장을 거닐고, 평범한 시민들이 사용하던 동전, 장신구, 도구를 보고, 밀랍 서판에 직접 글씨를 써 보세요. 전시는 8월 31일까지 계속됩니다. 입장권은 성인 15달러이며, 12세 미만 어린이는 무료입니다. 그리고 한 가지 팁: 수요일 저녁에 방문하세요. 박물관이 9시까지 문을 열고 입장료도 반값입니다. 지금 riversidemuseum.org에서 입장권을 예약하세요."], qs:[{q:"무엇이 광고되고 있는가?", o:["이탈리아 가이드 투어","역사책","다큐멘터리 영화","박물관 전시"]},{q:"화자는 수요일 저녁에 대해 뭐라고 말하는가?", o:["입장료가 할인된다.","강연이 열린다.","어린이는 입장할 수 없다.","박물관이 일찍 닫는다."]},{q:"화자는 청자들에게 무엇을 하도록 권하는가?", o:["박물관에 전화해 길을 묻기","박물관 회원이 되기","온라인으로 입장권 예약하기","역사 유물을 기증하기"]}]},
"p4-09": {s:["오늘 회의를 마치기 전에, 두 번째 조립 라인에 대해 여러분께 최신 상황을 알려 드리고자 합니다. 새 포장 기계가 지난 금요일에 설치되었고, 기술자들이 어제 보정 작업을 마쳤습니다. 월요일부터 이 라인은 전속력으로 가동되며, 이는 교대 근무당 이전보다 약 40퍼센트 더 많은 제품을 포장하게 된다는 뜻입니다. 여기까지가 좋은 소식입니다. 문제는 이 기계가 다른 크기의 상자를 사용하기 때문에 창고에 있는 상자들이 맞지 않는다는 것입니다. 새 상자는 이미 주문했지만 수요일까지는 도착하지 않을 겁니다. 그래서 다음 주 처음 이틀 동안은 두 번째 라인에서 지금처럼 수작업으로 포장할 것입니다. 팀 리더 여러분, 직원들이 이 사실을 알도록 해 주세요. 오늘 오후에 세부 사항을 담은 메모를 보내겠습니다."], qs:[{q:"화자는 어디에서 일할 것 같은가?", o:["운송 회사에서","식료품점에서","제조 공장에서","전자제품 소매점에서"]},{q:"화자는 어떤 문제를 언급하는가?", o:["기계가 아직 설치되지 않았다.","일부 자재의 크기가 맞지 않는다.","기술자를 구할 수 없다.","창고가 가득 찼다."]},{q:"화자는 오늘 오후에 무엇을 할 것인가?", o:["조립 라인을 점검한다","상자를 더 주문한다","기술자들과 만난다","메모를 배포한다"]}]},
"p4-10": {s:["4번 승강장에서 3시 15분 노스게이트행 급행 열차를 기다리시는 승객 여러분께 안내 말씀드립니다. 엘름우드 분기점 부근의 신호 문제로 이 열차가 약 35분 지연되어 현재 3시 50분에 출발할 예정입니다. 불편을 드려 죄송합니다. 노스게이트에 더 빨리 도착하셔야 하는 승객께서는 2번 승강장에서 3시 25분 완행 열차를 이용하실 수 있으며, 이 열차는 모든 역에 정차하여 4시 40분에 노스게이트에 도착합니다. 급행 승차권은 그 열차에서도 사용하실 수 있습니다. 급행을 기다리기로 하신다면, 위층 카페에서 지연된 승객분들께 무료 따뜻한 음료를 제공하고 있으니 참고하세요. 카운터에서 승차권만 보여 주시면 됩니다. 다시 한번 안내드립니다. 3시 15분 급행은 이제 4번 승강장에서 3시 50분에 출발합니다. 기다려 주셔서 감사합니다."], qs:[{q:"안내 방송은 어디에서 이루어지고 있을 것 같은가?", o:["기차역에서","공항에서","버스 터미널에서","여객선에서"]},{q:"지연의 원인은 무엇인가?", o:["악천후","인력 부족","선로 정비","신호 문제"]},{q:"급행 열차를 기다리는 승객들은 무엇을 하라고 안내받는가?", o:["2번 승강장으로 이동하기","카페에서 승차권을 보여 주기","카운터에서 승차권을 교환하기","열차에 일찍 탑승하기"]}]},
"p4-11": {s:["안녕하세요, 할로우 로지스틱스에 오신 것을 환영합니다. 저는 교육 담당자 메러디스 조이고, 사흘 동안 여러분과 함께할 것입니다. 오늘 오전에는 물류 센터 견학으로 시작할 테니, 문 옆 테이블에 있는 안전 조끼를 하나씩 착용해 주세요. 점심 후에는 직원 ID 배지를 받게 되는데, 내일부터 건물에 들어오려면 이것이 필요합니다. 오후 나머지 시간은 재고 관리 소프트웨어를 다룰 예정입니다. 한 번도 사용해 본 적이 없더라도 걱정하지 마세요. 단계별로 차근차근 살펴볼 겁니다. 내일과 목요일에는 각자 부서의 경험 많은 팀원을 따라다니며 배우게 됩니다. 한 가지 더: 폴더에 있는 핸드북에 교대 근무 교환 정책이 설명되어 있습니다. 내일 아침 가장 먼저 이에 대해 논의할 예정이니 오늘 밤 8페이지 부분을 읽어 주세요."], qs:[{q:"청자들은 누구일 것 같은가?", o:["창고 고객","소프트웨어 개발자","신입 직원","안전 검사관"]},{q:"청자들은 점심 후에 무엇을 받을 것인가?", o:["안전 조끼","소프트웨어 설명서","신분증 배지","건물 지도"]},{q:"청자들은 오늘 밤에 무엇을 하라고 요청받는가?", o:["부서 선택하기","교대 근무 신청서 제출하기","온라인 강좌 수료하기","핸드북 일부 읽기"]}]},
"p4-12": {s:["비즈니스 디스 위크에 다시 오신 것을 환영합니다. 오늘의 주요 뉴스입니다. 애리조나에 본사를 둔 태양광 패널 설치 업체 루멘 솔라가 지난 분기 매출이 30퍼센트 성장했다고 발표했습니다. 회사는 이 증가의 공을 주택 소유자가 패널 비용을 일시불 대신 월 할부로 낼 수 있게 하는 새 금융 프로그램에 돌리고 있습니다. 1월에 이 프로그램이 시작된 이후 주거용 설치 건수가 거의 두 배로 늘었습니다. 루멘은 또한 연말까지 네바다에 새 서비스 센터 세 곳을 열 계획을 발표했으며, 이로써 약 150개의 일자리가 창출될 것입니다. 이러한 프로그램이 어떻게 운영되는지 더 알아보시려면, 루멘의 최고재무책임자가 10월 20일 저희의 무료 청취자 세미나에서 강연할 예정입니다. 좌석이 한정되어 있으니 금요일까지 저희 웹사이트에서 등록하세요."], qs:[{q:"보도는 주로 무엇에 관한 것인가?", o:["정부 정책의 변화","한 회사의 최근 성장","새로운 종류의 태양광 패널","두 회사 간의 합병"]},{q:"화자에 따르면 설치 증가로 이어진 것은 무엇인가?", o:["새로운 결제 방식","정부 보조금","더 낮은 자재 비용","텔레비전 광고 캠페인"]},{q:"화자는 청자들에게 금요일까지 무엇을 하도록 권하는가?", o:["루멘 솔라에 입사 지원하기","인터뷰 질문 제출하기","행사에 등록하기","집에 태양광 패널 설치하기"]}]}
});

"p6-01": {p:"수신: 전 직원\n발신: 시설관리팀\n제목: 주차장 보수 공사\n\n5월 6일부터 5월 10일까지 동쪽 주차장이 재포장 공사로 폐쇄될 예정임을 알려 드립니다. 이 기간 동안 직원 여러분께서는 서쪽 주차장이나 센터 스트리트에 있는 공영 주차장을 이용해 주시기 바랍니다. ___(1)___ 회사 사원증을 제시하는 분에 한해 주차 요금을 ___(2)___ 해당 주차장과 협의해 두었습니다.\n\n보수 공사는 예정대로 완료될 것으로 예상됩니다. ___(3)___, 날씨로 인해 지연될 경우 이메일로 알려 드리겠습니다. 이로 인해 발생할 수 있는 ___(4)___에 대해 사과드리며 여러분의 협조에 감사드립니다.", qs:[

"p6-02": {p:"황 선생님께,\n\n최근 Aria X200 무선 헤드폰을 구매해 주셔서 감사합니다. 고객님의 제품이 당사의 연장 보증 프로그램 ___(1)___ 알려 드리고자 합니다. 6월 30일 전에 등록하시면 추가 12개월의 보증을 무료로 받으실 수 있습니다. ___(2)___\n\n등록하시려면 당사 웹사이트를 방문하셔서 헤드폰 케이스 안쪽에 있는 일련번호를 입력하기만 하면 됩니다. 문의 사항이 있으시면 월요일부터 금요일까지 오전 9시와 오후 6시 ___(3)___ 고객지원팀을 이용하실 수 있습니다.\n\n고객님의 거래에 ___(4)___ 새 헤드폰을 즐겁게 사용하시기 바랍니다.\n\n감사합니다.\nAria Audio 고객 관리팀", qs:[

"p6-03": {p:"입주민 안내문\n\n건물의 주 엘리베이터가 정기 점검 ___(1)___ 3월 4일 화요일에 운행이 중단됩니다. 작업은 오전 9시에 시작하여 오후 4시까지 완료될 예정입니다. 이 시간 ___(2)___ 입주민께서는 건물 뒤쪽에 있는 화물용 엘리베이터를 이용하실 수 있습니다.\n\n이로 인해 일부 입주민, 특히 고층에 거주하시는 분들께는 ___(3)___ 수 있음을 알고 있습니다. ___(4)___ 당일 무거운 물건을 옮기는 데 도움이 필요하시면 최소 하루 전에 관리사무소로 연락해 주시기 바랍니다.\n\n양해해 주셔서 감사합니다.\nWestgate Towers 관리사무소", qs:[

{o:["그래서 저희는 도움을 드릴 직원을 배치하도록 조치했습니다.","엘리베이터는 2010년에 설치되었습니다.","임대료는 매월 1일에 납부해야 합니다.","로비는 다음 달에 다시 도색될 예정입니다."]}

"p7-01": {p:"리버사이드 피트니스 센터 — 개관 기념 특별 혜택\n\n3월 31일 전에 가입하시면 등록비(75달러 상당)가 면제됩니다. 회원 혜택:\n• 완비된 웨이트 룸과 25미터 실내 수영장\n• 요가, 스피닝, 필라테스를 포함한 주 40회 이상의 그룹 수업\n• 무료 주차 및 수건 서비스\n• 리버사이드 3개 지점 모두 이용 가능\n\n월 회비: 45달러(개인) / 70달러(가족)\n\n하버 로드 220번지로 방문하시거나 555-0188로 전화하셔서 무료 1일 이용권을 받으세요. 친구를 추천하는 기존 회원께는 1개월 무료 이용 혜택을 드립니다.", qs:[
{q:"광고의 목적은 무엇인가?", o:["새 수업 일정을 알리려고","신규 회원을 유치하려고","스포츠 행사를 홍보하려고","구인 광고를 하려고"]},
{q:"회원 혜택으로 언급되지 않은 것은 무엇인가?", o:["무료 주차","수영장 이용","개인 트레이닝 세션","여러 지점 이용"]},
{q:"기존 회원은 어떻게 1개월 무료 혜택을 받을 수 있는가?", o:["3월 31일 전에 가입함으로써","40개의 수업에 참석함으로써","친구를 추천함으로써","555-0188로 전화함으로써"]}
]},
"p7-02": {p:"발신: Daniel Reyes <dreyes@nortonlogistics.com>\n수신: Sofia Marchetti <smarchetti@brightpath.com>\n날짜: 8월 3일\n제목: Re: 창고 소프트웨어 제안서\n\nMarchetti 씨께,\n\nBrightPath 재고 관리 시스템 제안서를 보내 주셔서 감사합니다. 월요일에 저희 운영팀과 공유했는데, 전반적으로 반응이 긍정적이었습니다. 특히 실시간 추적 기능은 저희가 수년간 애를 먹어 온 문제를 해결해 줄 것 같습니다.\n\n다만, 진행에 앞서 논의하고 싶은 두 가지 사항이 있습니다. 첫째, 제안서에는 6주의 도입 기간이 명시되어 있는데, 저희의 성수기가 10월 중순에 시작되므로 10월 1일까지는 시스템이 완전히 가동되어야 합니다. 둘째, 견적 가격에 직원 교육이 포함되어 있지 않은 것 같습니다. 교육이 가능한지, 가능하다면 비용은 얼마인지 확인해 주시겠습니까?\n\n다음 주에는 수요일을 제외한 모든 오후에 통화가 가능합니다. 편하신 시간을 알려 주시기 바랍니다.\n\n감사합니다.\nDaniel Reyes\nNorton Logistics 운영 이사", qs:[
{q:"Reyes 씨는 왜 이메일을 썼는가?", o:["제안을 거절하려고","제안서에 대한 설명을 요청하려고","제품 시연 일정을 잡으려고","지연에 대해 항의하려고"]},
{q:"Reyes 씨는 실시간 추적 기능에 대해 뭐라고 말하는가?", o:["너무 비싸다.","오랜 문제를 해결해 줄 것이다.","추가 직원이 필요하다.","필요하지 않다."]},
{q:"Norton Logistics에 대해 암시된 것은 무엇인가?", o:["가을에 가장 바쁘다.","최근 새 직원을 채용했다.","전에 BrightPath를 이용한 적이 있다.","Marchetti 씨의 사무실 근처에 있다."]},
{q:"두 번째 문단 세 번째 줄의 단어 \"running\"과 의미가 가장 가까운 것은?", o:["빠르게 움직이는","작동하는","경쟁하는","흐르는"]}
]},
"p7-03": {p:"지역 베이커리, 2호점으로 확장\n\n할스턴(5월 14일)—2015년 엘름 스트리트에 문을 연 이후 할스턴 주민들의 사랑을 받아 온 Morning Glory Bakery가 6월 1일 웨스트필드 쇼핑센터에 2호점을 엽니다. [1] 사장 Priya Nair 씨는 수개월에 걸친 고객들의 요청 끝에 이런 결정을 내렸다고 말했습니다. \"사람들이 저희 사워도우를 사려고 시내를 가로질러 운전해 온다는 말을 계속 들었어요.\" Nair 씨가 말했습니다. \"저희가 그분들께 가는 게 맞다고 생각했죠.\" [2]\n\n새 매장은 기존 매장의 거의 두 배 크기이며 20석 규모의 작은 카페 공간도 갖출 예정입니다. 엘름 스트리트 매장과 달리 점심시간에는 샌드위치와 수프도 판매합니다. Nair 씨는 직원 8명을 추가로 채용할 계획이며, 이번 주에 면접이 진행되고 있습니다. [3]\n\n엘름 스트리트 매장은 현재 영업시간 그대로 계속 운영됩니다. [4] 개점을 기념하여 6월 1일에는 두 매장 모두에서 구매 시 페이스트리를 무료로 제공합니다.", qs:[
{q:"기사는 주로 무엇에 관한 것인가?", o:["베이커리의 새 메뉴","새 매장의 개점","소유주 변경","지역 채용 행사"]},
{q:"기사에 따르면, 새 매장은 기존 매장과 어떻게 다를 것인가?", o:["더 일찍 문을 닫을 것이다.","더 작을 것이다.","점심 메뉴를 판매할 것이다.","사워도우를 판매하지 않을 것이다."]},
{q:"Nair 씨에 대해 언급된 것은 무엇인가?", o:["최근 할스턴으로 이사했다.","고객의 요구에 부응했다.","엘름 스트리트 매장을 닫을 계획이다.","2010년부터 베이커리를 소유해 왔다."]},
{q:"[1], [2], [3], [4]로 표시된 위치 중 다음 문장이 들어가기에 가장 적절한 곳은?\n\"카페 경력이 있는 지원자를 특히 환영합니다.\"", o:["[1]","[2]","[3]","[4]"]}
]},
"p7-04": {p:"Mina Choi (오전 10:12)\n안녕하세요 Tom, 아직 인쇄소에 계세요? 방금 고객이 전화했는데, 브로슈어를 150부 대신 200부로 원한대요.\n\nTom Baker (오전 10:14)\n네, 여기 있어요. 아직 작업을 시작하지 않아서 수량을 변경할 수 있어요. 다만 가격이 60달러 정도 올라갈 거예요.\n\nMina Choi (오전 10:15)\n괜찮아요. 고객이 추가 비용을 승인했어요. 그래도 3시까지 전부 준비될 수 있을까요?\n\nTom Baker (오전 10:17)\n물어볼게요. 안 되면 제가 기다렸다가 직접 고객 사무실로 가져다줄게요.\n\nMina Choi (오전 10:18)\n좋아요. 어느 쪽이든 알려 주세요.", qs:[
{q:"Choi 씨는 왜 Baker 씨에게 연락하는가?", o:["주문을 변경해 달라고 요청하려고","고객이 취소했다고 알리려고","가격표를 요청하려고","회의 시간을 확인하려고"]},
{q:"오전 10시 18분에 Choi 씨가 \"어느 쪽이든 알려 주세요\"라고 쓴 것은 무슨 의미이겠는가?", o:["브로슈어가 제시간에 준비될지 알고 싶어 한다.","수량을 아직 결정하지 못했다.","Baker 씨가 인쇄소를 고르기를 원한다.","고객에게 직접 연락할 것이다."]}
]},
"p7-05": {p:"고객 후기 — Lakeside Inn, 312호\n작성자 J. Whitfield · 2박 투숙\n\n저는 출장 때문에 Lakeside Inn을 선택했는데, 컨벤션 센터에서 불과 10분 거리라는 위치와 무료 공항 셔틀 때문이었습니다. 셔틀은 오갈 때 모두 정확히 제시간에 운행되었습니다. 객실은 깨끗하고 조용했으며, 책상 공간은 편안하게 일할 수 있을 만큼 넓었습니다.\n\n유일한 불만은 조식입니다. \"무료\"라고 광고되어 있지만 따뜻한 음식은 추가 요금이 붙고, 실제로 무료인 것은 커피, 토스트, 과일뿐입니다. 또한 객실의 와이파이가 저녁에는 느렸는데, 로비에서는 잘 되었습니다.\n\n전반적으로 출장이라면 다시 묵겠지만, 조식은 다른 곳에서 드시기를 권합니다.", qs:[
{q:"Whitfield 씨는 왜 이 호텔을 선택했는가?", o:["저렴한 가격 때문에","레스토랑 때문에","위치와 셔틀 때문에","동료가 추천해서"]},
{q:"Whitfield 씨는 조식에 대해 뭐라고 말하는가?", o:["너무 일찍 제공되었다.","일부 음식은 무료가 아니었다.","주말에는 이용할 수 없었다.","기대보다 좋았다."]},
{q:"호텔의 와이파이에 대해 추론할 수 있는 것은 무엇인가?", o:["객실에서는 이용할 수 없다.","속도가 장소와 시간에 따라 다르다.","추가 요금이 필요하다.","최근 업그레이드되었다."]}
]},
"p6-04": {p:"회람\n수신: 영업부\n발신: Grace Lin, 영업 이사\n날짜: 9월 2일\n제목: 새로운 경비 보고 절차\n\n10월 1일부터 모든 경비 보고서는 과거에 사용해 온 종이 양식 ___(1)___ 새 온라인 포털을 통해 제출해야 합니다. 이 포털에서는 휴대전화로 영수증 사진을 바로 업로드할 수 있어 절차가 상당히 빨라질 것입니다. ___(2)___ 다음 달 5일 이후에 제출된 보고서는 ___(3)___ 않습니다.\n\n새 시스템에 대한 30분짜리 교육 세션이 9월 20일 B 회의실에서 열립니다. 특히 출장이 잦은 직원의 경우 참석을 적극 ___(4)___.\n\n문의 사항이 있으시면 저에게 연락해 주십시오.", qs:[
{o:["~대신에 (전치사)","~에 더하여 (전치사)","~에 따르면 (전치사)","~뿐만 아니라 (전치사)"]},
{o:["제출 마감일은 변경되지 않았다는 점에 유의하시기 바랍니다.","영업팀은 지난 분기에 목표를 초과 달성했습니다.","종이 양식은 안내 데스크에서 받으실 수 있습니다.","포털은 다음 주에 점검을 위해 중단될 예정입니다."]},
{o:["환급되는 (과거분사, 수동태)","환급하다 (동사원형)","환급하는 (현재분사)","환급 (명사)"]},

]},
"p6-05": {p:"소중한 고객님께,\n\nNorthbridge Bank 메인 스트리트 지점이 3월 15일에 커머스 플라자 45번지의 더 넓은 장소로 ___(1)___ 알려 드리게 되어 기쁩니다. 새 지점은 평일 영업시간 연장, 추가 창구, 소규모 사업자 서비스 전용 공간을 갖출 예정입니다. ___(2)___\n\n고객님의 계좌번호, 온라인 뱅킹 로그인 정보, 직불카드는 그대로 유지됩니다. ___(3)___, 대여 금고는 3월 13일 주말 동안 새 장소로 이전되며, 이 이틀 동안은 이용이 불가능합니다.\n\n이번 일시적인 불편에 대해 ___(4)___ 새 보금자리에서 고객님을 모시기를 기대합니다.\n\n감사합니다.\nMarcus Webb\n지점장", qs:[

{o:["또한 부속 주차장에서 고객 주차가 무료로 제공됩니다.","이 지점은 1985년부터 영업해 왔습니다.","계좌를 개설하시려면 신분증 두 가지를 지참해 주십시오.","유감스럽게도 이 지점은 영구 폐쇄됩니다."]},
{o:["그러나 (접속부사)","마찬가지로 (접속부사)","요컨대 (접속부사)","마찬가지로 (접속부사)"]},
{o:["유감스럽게 생각하다 (동사)","부인하다 (동사)","축하하다 (동사)","의심하다 (동사)"]}

"p7-06": {p:"전체 입주사 안내문 — Oakwood Business Park\n\n7월 8일 월요일부터 주 주차 빌딩의 재포장 공사가 진행됩니다. 공사는 약 3주가 소요되며, 3층부터 시작하여 한 번에 한 층씩 진행됩니다. 특정 층이 폐쇄되는 동안 해당 층을 배정받은 입주사는 C동 뒤쪽의 임시 주차장을 이용하실 수 있습니다. 오전 7시부터 오후 7시까지 15분 간격으로 임시 주차장과 정문 사이를 셔틀이 운행합니다.\n\n이 시간 외에 주차 빌딩을 이용해야 하는 입주사는 내선 400번으로 관리사무소에 연락하여 임시 출입 카드를 신청하시기 바랍니다. 불편을 드려 죄송하며 양해해 주셔서 감사합니다.\n\n— Oakwood 자산관리팀", qs:[
{q:"안내문의 목적은 무엇인가?", o:["임대료 변경을 알리려고","입주사에 공사 작업을 알리려고","새 셔틀 노선을 소개하려고","주차에 대한 의견을 요청하려고"]},
{q:"안내문에 따르면, 셔틀은 얼마나 자주 운행되는가?", o:["5분마다","15분마다","30분마다","1시간마다"]},
{q:"주차 빌딩에 대해 암시된 것은 무엇인가?", o:["층이 하나 이상이다.","주말에는 폐쇄된다.","철거될 예정이다.","C동 뒤에 위치해 있다."]}
]},
"p7-07": {p:"[지문 1 — 이메일]\n발신: Hannah Weiss <hweiss@claritybooks.com>\n수신: 워크숍 참가자\n제목: 글쓰기 워크숍 — 최종 일정\n날짜: 4월 2일\n\n참가자 여러분께,\n\n4월 12일에 열리는 봄 글쓰기 워크숍의 최종 일정을 첨부합니다. 지난주에 보내 드린 초안에서 한 가지 변경된 점이 있으니 유의해 주십시오. 발표자인 Okafor 씨가 오전에 다른 일정이 있어 자가 출판 세션이 오후로 옮겨졌습니다. 점심은 로비에서 제공되며, 별도 표시가 없는 한 모든 세션은 210호에서 진행됩니다. 참석이 어려우시면 대기자 명단에 있는 분께 자리를 드릴 수 있도록 4월 9일까지 알려 주시기 바랍니다.\n\n감사합니다.\nHannah Weiss\n\n[지문 2 — 일정표]\n봄 글쓰기 워크숍 — 4월 12일 — Clarity Books, 210호\n9:00–10:15    나만의 목소리 찾기 — Lydia Chen\n10:30–11:45   내 글 직접 편집하기 — Paul Grant\n11:45–12:45   점심 (로비)\n12:45–2:00    오늘날의 자가 출판 — David Okafor\n2:15–3:30     문학 에이전트와 일하기 — Maria Sousa (305호)", qs:[
{q:"Weiss 씨는 왜 이메일을 보냈는가?", o:["워크숍을 취소하려고","일정을 제공하려고","결제를 요청하려고","새 발표자를 소개하려고"]},
{q:"원래 오전에 예정되어 있던 세션은 무엇인가?", o:["나만의 목소리 찾기","내 글 직접 편집하기","오늘날의 자가 출판","문학 에이전트와 일하기"]},
{q:"Sousa 씨의 세션은 어디에서 열리는가?", o:["로비에서","210호에서","305호에서","서점에서"]},
{q:"참석할 수 없는 참가자는 언제까지 Weiss 씨에게 알려야 하는가?", o:["4월 2일","4월 9일","4월 12일","4월 15일"]}
]},
"p7-08": {p:"기술 기업, 부산에 연구 센터 개설 예정\n\n부산(6월 3일)—산업용 센서 제조업체인 Veltron Systems가 내년 초 부산에 연구개발 센터를 열 것이라고 어제 발표했습니다. 약 120명의 엔지니어를 고용할 이 시설은 자율주행 차량용 센서에 주력할 예정입니다.\n\n최고경영자 Hana Sato 씨는 여러 자동차 제조사와의 근접성과 우수한 공과대학들 때문에 이 도시를 선택했다고 말했습니다. \"저희는 네 개 도시를 검토했습니다.\" Sato 씨가 말했습니다. \"부산이 인재와 파트너의 조합 면에서 가장 좋았습니다.\"\n\n이 회사는 현재 오사카와 뮌헨에 연구 센터를 두고 있습니다. Sato 씨는 부산 센터가 2019년에 Veltron의 1세대 차량 센서를 개발한 오사카 팀과 긴밀히 협력할 것이라고 말했습니다. 새 건물의 공사는 8월에 시작될 예정이며, 회사는 가을에 채용을 시작할 계획입니다.", qs:[
{q:"기사는 주로 무엇에 관한 것인가?", o:["회사의 새 시설 개설 계획","신제품 출시","회사 경영진 교체","두 기술 기업의 합병"]},
{q:"Sato 씨에 따르면, 부산이 선택된 이유는 무엇인가?", o:["운영 비용이 낮아서","자동차 제조사와 대학 근처에 위치해서","회사 본사가 그곳에 있어서","시가 세제 혜택을 제공해서"]},
{q:"8월에 무슨 일이 있을 것인가?", o:["센터가 문을 열 것이다.","채용이 시작될 것이다.","공사가 시작될 것이다.","Sato 씨가 부산을 방문할 것이다."]},
{q:"두 번째 문단 첫 번째 줄의 단어 \"proximity\"와 의미가 가장 가까운 것은?", o:["가까움","유사성","인기","거리"]}
]},
"p7-09": {p:"Ben Okoro (오후 2:05)\n안녕하세요 Laura, 고객이 우리 프레젠테이션을 목요일에서 내일 오전으로 옮겼어요. 샘플 보드를 제시간에 완성할 수 있을까요?\n\nLaura Kim (오후 2:07)\n내일 오전이요? 빠듯하네요. 인쇄소에서 큰 보드는 목요일이나 되어야 준비된다고 했어요.\n\nBen Okoro (오후 2:08)\n디지털 버전으로 발표하고 보드는 후속 회의에 가져가면 어떨까요?\n\nLaura Kim (오후 2:10)\n그러면 될 것 같아요. 인쇄소에 전화해서 작은 보드 두 개라도 오늘 밤까지 해 줄 수 있는지 알아볼게요.\n\nBen Okoro (오후 2:11)\n좋아요. 제가 슬라이드를 업데이트해서 5시까지 보내 드릴게요.", qs:[
{q:"문제는 무엇인가?", o:["고객이 회의를 취소했다.","프레젠테이션이 앞당겨졌다.","인쇄소가 주문을 분실했다.","파일이 열리지 않는다."]},
{q:"오후 2시 10분에 Kim 씨가 \"그러면 될 것 같아요\"라고 쓴 것은 무슨 의미이겠는가?", o:["큰 보드 없이 발표하는 것에 동의한다.","인쇄소가 제시간에 끝낼 것이라고 생각한다.","후속 회의 일정을 변경하고 싶어 한다.","인쇄본을 선호한다."]},
{q:"Okoro 씨는 오후 5시까지 무엇을 할 것인가?", o:["고객에게 전화한다","인쇄소를 방문한다","업데이트된 슬라이드를 보낸다","보드를 찾아온다"]}
]},
"p7-10": {p:"청구서 — Bluewater Catering\n청구서 번호 #4471    날짜: 5월 20일    납부 기한: 6월 3일\n청구 대상: Pinecrest Dental Group, 오크 스트리트 88번지\n행사: 직원 감사 오찬, 5월 18일\n\n품목                                  수량   단가     금액\n샌드위치 플래터 (10인분)                4    $45.00   $180.00\n가든 샐러드 (대)                       2    $28.00    $56.00\n모둠 디저트 (10인분)                   3    $35.00   $105.00\n음료 서비스 (커피, 차, 물)              1    $60.00    $60.00\n배달 및 세팅                                          $40.00\n소계                                                 $441.00\n할인 (재이용 고객, 10%)                               -$44.10\n총 납부액                                            $396.90\n\n수표 또는 계좌 이체로 결제하실 수 있습니다. 납부 기한 이후 미납 잔액에는 2%의 연체료가 부과됩니다. Bluewater Catering을 이용해 주셔서 감사합니다!", qs:[

{q:"Pinecrest Dental Group에 대해 암시된 것은 무엇인가?", o:["전에 Bluewater Catering을 이용한 적이 있다.","청구서를 늦게 납부했다.","직원이 40명이 넘는다.","디저트를 추가로 주문했다."]}

"p6-06": {p:"전 직원 안내문\n\n11월 3일 월요일부터 Harlow 역과 Riverside 캠퍼스 사이를 오가는 회사 셔틀이 변경된 일정으로 운행됩니다. 오전 출발편은 오전 7시부터 9시 40분까지 20분 간격으로 역에서 출발합니다. 현행 시간표에 ___(1)___, 마지막 저녁 셔틀은 오후 6시 45분이 아닌 오후 7시 30분에 캠퍼스에서 출발합니다. ___(2)___ ___(3)___, 메이플 스트리트 주차 구역은 재개발로 폐쇄되므로 셔틀이 더 이상 그곳에 정차하지 않습니다. 새 시간표 사본은 이번 주 후반 인트라넷에 ___(4)___. 이번 변경 사항에 대해 문의가 있는 직원은 내선 2240번으로 시설부에 연락하시기 바랍니다.", qs:[

"p6-07": {p:"수신: Daniel Okafor <d.okafor@brightmail.com>\n발신: Lena Marsh <l.marsh@corvinproperties.com>\n날짜: 8월 12일\n제목: 임대 계약 갱신 — 4B호\n\nOkafor 씨께,\n\nCorvin Plaza 4B호에 대한 귀하의 현재 임대 계약은 10월 31일에 만료될 ___(1)___ 있습니다. 저희는 임대료 3%의 소폭 인상과 함께 동일한 조건으로 12개월 추가 갱신을 제안드리고자 합니다. ___(2)___ 갱신을 원하시면 첨부된 계약서에 서명하여 9월 15일까지 저희 사무실로 보내 주시기 바랍니다. ___(3)___, 저희는 귀하가 퇴거할 의사가 있는 것으로 간주하고 예비 임차인에게 광고를 시작할 것입니다. 벽 재도색과 같은 건물에 대한 모든 ___(4)___는 작업 시작 전에 서면으로 승인을 받아야 한다는 점에 유의해 주십시오.\n\n계속해서 귀하를 모실 수 있기를 바랍니다.\n\n감사합니다.\nLena Marsh\nCorvin Properties 자산 관리자", qs:[
{o:["상기된 (과거분사)","예정된 (과거분사, be scheduled to: ~할 예정이다)","위치한 (과거분사)","준비된 (과거분사)"]},

"p6-08": {p:"GreenDesk 식물 관리 서비스\n\n이 지역 최고의 사무실 식물 관리 서비스 업체인 GreenDesk로 일터에 생기를 더하세요. 저희의 숙련된 기술자가 2주마다 귀사를 방문하여 식물에 물을 주고, 다듬고, 상태를 점검하므로 직원들은 관리 걱정 ___(1)___ 업무에 집중할 수 있습니다. 저희는 조명이 약한 로비, 밝은 회의실, 그리고 그 사이의 모든 환경에 적합한 다양한 ___(2)___의 식물을 제공합니다. ___(3)___, 저희가 설치하는 모든 식물에는 교체 보증이 적용됩니다. 식물이 제대로 자라지 않으면 무료로 교체해 드립니다. 12월 31일 전에 12개월 계약을 체결하는 기업은 무료 디자인 상담을 ___(4)___. 555-0148로 전화하시거나 www.greendeskplants.com을 방문하여 견적을 요청하세요.", qs:[

"p6-09": {p:"브렌튼 — 브렌튼 시의회는 화요일, 도심 지역 25개 정거장에 300대의 자전거가 ___(1)___ 자전거 공유 프로그램이 내년 봄에 시작될 것이라고 발표했습니다. 이용자는 모바일 앱으로 자전거의 잠금을 해제하고 네트워크 내 어느 정거장에나 반납할 수 있습니다. ___(2)___ 이 프로그램을 제안한 시의원 Priya Nandan 씨는 목표가 출퇴근 시간대의 교통 혼잡을 줄이는 것이라고 말했습니다. \"많은 주민이 직장에서 3킬로미터 이내에 살고 있습니다.\" 그녀가 말했습니다. \"그들에게 자전거는 운전을 대신할 ___(3)___ 대안입니다.\" ___(4)___, 시는 이미 개별 정거장을 후원하고자 하는 여러 지역 기업으로부터 관심을 받았습니다. 정거장 위치 목록은 1월에 시 웹사이트에 게시될 예정입니다.", qs:[

"p6-10": {p:"Riverbend 공동체 텃밭 — 구획 이용자 지침\n\nRiverbend 공동체 텃밭에 오신 것을 환영합니다. 텃밭이 모두에게 쾌적한 공간으로 유지될 수 있도록 모든 구획 이용자께서는 다음 규칙을 지켜 주시기 바랍니다. 구획은 재배 기간 내내 ___(1)___ 합니다. 4주 이상 돌보지 않은 채 방치된 구획은 대기자 명단에 있는 분께 재배정될 수 있습니다. 물은 오전 6시부터 오후 8시까지 공용 수도꼭지에서 사용하실 수 있습니다. ___(2)___, 과거에 누수로 인해 수도 요금이 많이 나온 적이 있으니 사용 후에는 수도꼭지를 완전히 잠가 주십시오. 보관 창고의 도구는 어느 회원이든 ___(3)___ 있지만 당일에 세척하여 반납해야 합니다. 마지막으로, 텃밭에 두고 가는 물품에는 분실 시 돌려드릴 수 있도록 구획 번호를 명확히 ___(4)___ 주시기 바랍니다.", qs:[

{o:["또한 (접속부사)","그러나 (접속부사)","그렇지 않으면 (접속부사)","대신에 (접속부사)"]},

"p7-11": {p:"TallyBook 온라인 회계\n\n소규모 사업체를 운영하는 것은 저녁 시간을 서류 작업에 쓰지 않아도 충분히 힘든 일입니다. TallyBook은 직원 50명 미만의 기업을 위해 특별히 설계된 클라우드 기반 회계 서비스입니다. 몇 초 만에 전문적인 청구서를 만들어 보내고, 휴대전화로 영수증을 촬영하여 경비를 추적하고, 클릭 한 번으로 세무 보고서를 생성하세요. 데이터가 온라인에 안전하게 저장되기 때문에 귀하와 귀하의 회계사는 어떤 기기에서든 동일한 최신 수치를 확인할 수 있습니다.\n\n스타터 플랜은 월 12달러이며 청구서 발행, 경비 추적, 이메일 지원이 포함됩니다. 월 29달러의 프로페셔널 플랜에는 급여 처리, 재고 관리, 주 7일 전화 지원이 추가됩니다. 두 플랜 모두 30일 무료 체험이 제공되며, 시작하는 데 신용카드가 필요하지 않습니다.\n\n3월 말까지 프로페셔널 플랜을 선택하는 신규 가입자는 당사 공인 자문가와의 1시간 무료 설정 세션을 받게 됩니다. 체험을 시작하시려면 www.tallybook.com/trial을 방문하세요.\n\nTallyBook: 계산하는 시간은 줄이고, 성장하는 시간은 늘리세요.", qs:[
{q:"무엇이 광고되고 있는가?", o:["세무 대행 회사","휴대전화 요금제","온라인 회계 서비스","비즈니스 교육 과정"]},

{q:"신규 고객은 어떻게 설정 세션을 받을 수 있는가?", o:["다른 사업체를 추천함으로써","4월 전에 프로페셔널 플랜에 가입함으로써","1년치를 미리 결제함으로써","온라인 세미나에 참석함으로써"]}
]},
"p7-12": {p:"수신: Marcus Ellery <m.ellery@pinecrestoutdoor.com>\n발신: Sofia Reyes <s.reyes@greatlakesexpo.org>\n날짜: 5월 6일\n제목: 부스 배정 — Great Lakes 아웃도어 엑스포\n\nEllery 씨께,\n\n7월 18일부터 20일까지 덜루스 컨벤션 센터에서 열리는 올해 Great Lakes 아웃도어 엑스포에 Pinecrest Outdoor Gear를 전시업체로 등록해 주셔서 감사합니다. 귀사에 전시장 내 캠핑·하이킹 구역의 모서리 자리인 214번 부스가 배정되었음을 확인해 드리고자 합니다. 요청하신 대로 부스는 정문 근처에 있으므로 행사 기간 내내 많은 방문객이 찾을 것입니다.\n\n몇 가지 중요한 날짜를 유의해 주십시오. 전시업체는 7월 17일 오전 9시부터 오후 6시 사이에 전시물을 설치할 수 있습니다. 전기 콘센트나 추가 조명이 필요하시면 저희 웹사이트의 신청서를 6월 20일까지 제출해야 하며, 그 이후의 요청에는 75달러의 지연 수수료가 부과됩니다. 마지막으로, 각 전시업체는 직원 출입증 4장을 받습니다. 더 필요하시면 7월 10일까지 장당 20달러에 추가 출입증을 구매하실 수 있습니다.\n\n귀사의 부스 위치가 표시된 배치도를 첨부합니다. 궁금한 점이 있으시면 언제든지 연락 주십시오.\n\n감사합니다.\nSofia Reyes\n전시업체 서비스 코디네이터", qs:[
{q:"이메일은 왜 보내졌는가?", o:["부스 비용 결제를 요청하려고","전시업체의 부스 위치를 확인해 주려고","행사장 변경을 알리려고","회사에 발표를 요청하려고"]},
{q:"214번 부스에 대해 언급된 것은 무엇인가?", o:["대부분의 다른 부스보다 크다.","다른 회사와 함께 사용하게 된다.","전시장 중앙에 위치해 있다.","입구와 가깝다."]},
{q:"수수료를 피하려면 전시업체는 언제까지 추가 조명을 요청해야 하는가?", o:["6월 20일","7월 10일","7월 17일","7월 18일"]},
{q:"Pinecrest Outdoor Gear에 대해 암시된 것은 무엇인가?", o:["전에 이 엑스포에 참가한 적이 있다.","직원 출입증이 4장 이상 필요할 것이다.","부스 위치에 대한 선호를 밝혔다.","주로 낚시 장비를 판매한다."]}
]},
"p7-13": {p:"Orrin Dairy, 전기차로 전환\n\n웨스트필드(6월 3일) — 1952년부터 웨스트필드 지역 가정에 우유와 치즈를 배달해 온 가족 기업 Orrin Dairy가 내년 말까지 24대의 배달 밴 전체를 전기차로 교체할 것이라고 어제 발표했습니다. 첫 전기 밴 6대는 이미 도심 노선에서 운행 중입니다.\n\n회사 사장 Thomas Orrin 씨에 따르면 이번 결정은 주로 비용 때문이었습니다. \"연료비와 유지비가 배달 비용의 거의 3분의 1을 차지합니다.\" 그가 말했습니다. \"전기 밴은 구매 비용이 더 들지만, 4년 안에 본전을 뽑을 것으로 예상합니다.\" 회사는 하퍼 로드 차고지에 충전소를 설치했으며, 밴은 그곳에서 밤새 충전됩니다.\n\n고객들도 이 변화를 반기는 것으로 보입니다. 10년 넘게 Orrin의 배달을 받아 온 Nina Cho 씨는 새 밴이 눈에 띄게 조용하다고 말했습니다. \"예전 밴은 새벽 5시에 아이들을 깨우곤 했어요.\" 그녀가 말했습니다. \"이제는 도착하는 소리도 안 들려요.\"\n\nOrrin Dairy는 85명의 직원을 고용하고 있으며 약 6,000가구에 서비스를 제공합니다. 회사는 내년 봄 이웃 도시인 콜더로 배달 지역을 확장할 계획입니다.", qs:[
{q:"기사는 주로 무엇에 관한 것인가?", o:["회사의 배달 차량 교체 계획","새 낙농장의 개장","유제품 가격 인상","두 지역 기업의 합병"]},
{q:"Orrin 씨에 따르면, 회사는 왜 전기 밴으로 전환하는가?", o:["새 규정을 준수하기 위해","대외 이미지를 개선하기 위해","운영 비용을 줄이기 위해","젊은 고객을 유치하기 위해"]},
{q:"두 번째 문단 두 번째 줄의 표현 \"account for\"와 의미가 가장 가까운 것은?", o:["설명하다","차지하다","비용을 지불하다","보고하다"]},
{q:"Cho 씨는 새 밴에 대해 뭐라고 말하는가?", o:["전보다 일찍 도착한다.","더 보기 좋다.","더 다양한 제품을 배달한다.","소음이 적다."]},
{q:"Orrin Dairy는 내년 봄에 무엇을 할 계획인가?", o:["운전기사를 추가 채용한다","다른 도시에서 배달을 시작한다","두 번째 차고지를 연다","밴 18대를 추가 구매한다"]}
]},
"p7-14": {p:"회람\n\n수신: Lakeview 사무실 전 직원\n발신: Rachel Dunmore, 사무실 관리자\n날짜: 9월 9일\n제목: 새로운 방문객 체크인 절차\n\n9월 15일 월요일부터 Lakeview 사무실의 모든 방문객은 새 전자 키오스크를 이용해 안내 데스크에서 체크인해야 합니다. 방문객이 이름, 회사, 만날 직원을 입력하면 시스템이 자동으로 해당 직원에게 문자 메시지를 보냅니다. 방문객에게는 인쇄된 출입증도 제공되며, 건물 안에 있는 동안 잘 보이게 착용하고 나갈 때 안내 데스크에 반납해야 합니다.\n\n방문객을 맞을 예정인 직원은 최소 하루 전에 인트라넷에서 방문객을 사전 등록해 주시기 바랍니다. 사전 등록된 방문객은 키오스크에서 스캔할 수 있는 QR 코드가 담긴 이메일을 받게 되며, 이를 통해 체크인 시간이 1분 미만으로 단축됩니다. 또한 로비 이외의 구역에서는 방문객이 항상 직원과 동행해야 한다는 점을 기억해 주십시오.\n\n기존의 종이 방문 기록부는 9월 12일에 철거됩니다. 키오스크에 대한 간단한 교육 세션이 9월 10일과 11일 오전 10시와 오후 2시에 로비에서 제공됩니다. 문의 사항은 내선 318번으로 저에게 주시면 됩니다.", qs:[
{q:"회람의 목적은 무엇인가?", o:["안내 데스크의 이전을 알리려고","교육 세션 자원봉사자를 모집하려고","직원들에게 출입증 착용을 상기시키려고","방문객 응대에 관한 새 절차를 설명하려고"]},
{q:"회람에 따르면, 방문객이 키오스크에서 체크인하면 무슨 일이 일어나는가?", o:["직원에게 문자 메시지로 알림이 간다.","경비원이 방문객을 안내한다.","방문객의 사진이 촬영된다.","주차권이 인쇄된다."]},
{q:"직원들은 어떻게 방문객의 체크인 시간을 줄일 수 있는가?", o:["안내 데스크에서 방문객을 맞이함으로써","미리 안내 데스크에 전화함으로써","사전에 온라인으로 등록함으로써","임시 출입증을 줌으로써"]},
{q:"교육 세션에 대해 암시된 것은 무엇인가?", o:["약 1시간 동안 진행될 것이다.","새 시스템이 의무화되기 전에 열릴 것이다.","전 직원에게 의무이다.","키오스크 제조사가 진행할 것이다."]}
]},
"p7-15": {p:"Hana Kim (오전 10:12)\n안녕하세요, Omar. 웨스트게이트 매장에 도착했나요? 지역 매니저가 새 가을 디스플레이를 보러 2시에 올 거예요.\n\nOmar Haddad (오전 10:14)\n방금 도착했어요. 마네킹이 도착했는데 배송분에 4개밖에 없어요. 우리는 6개를 주문했잖아요.\n\nHana Kim (오전 10:15)\n그건 문제네요. 쇼윈도 디자인에는 6개가 다 필요해요.\n\nOmar Haddad (오전 10:16)\n공급업체에 전화했어요. 나머지 2개는 아직 창고에 있고 목요일이나 되어야 도착한대요.\n\nHana Kim (오전 10:18)\n목요일은 너무 늦어요. 엘름 스트리트 매장에서 2개를 빌릴 수 있을까요? 거기는 지난주에 디스플레이를 바꿨잖아요.\n\nOmar Haddad (오전 10:19)\n좋은 생각이에요. 지금 그쪽 Dana에게 전화할게요. 그녀가 갖고 있으면 제가 차로 가서 정오 전에 가져올 수 있어요.\n\nHana Kim (오전 10:20)\n완벽해요. 그동안 우리가 가진 4개에 옷을 입히기 시작할 수 있을까요? 제가 11시 30분까지 가서 조명 작업을 도울게요.\n\nOmar Haddad (오전 10:21)\n그럴게요. Dana에게서 연락이 오는 대로 문자할게요.", qs:[
{q:"글쓴이들은 어디에서 일하겠는가?", o:["가구 창고","배송 회사","의류 소매점","광고 대행사"]},
{q:"Haddad 씨는 어떤 문제를 언급하는가?", o:["매장이 늦게 문을 열 것이다.","배송품 일부가 도착하지 않았다.","매니저가 방문을 취소했다.","일부 의류가 손상되었다."]},
{q:"오전 10시 18분에 Kim 씨가 \"목요일은 너무 늦어요\"라고 쓴 것은 무슨 의미이겠는가?", o:["공급업체를 교체해야 한다.","배송이 잘못된 날짜로 예정되었다.","이번 주에는 디스플레이를 바꿀 수 없다.","오늘 매니저 방문 전에 마네킹이 필요하다."]},
{q:"Haddad 씨는 다음에 무엇을 하겠는가?", o:["다른 매장의 직원에게 연락한다","공급업체 창고로 운전해 간다","쇼윈도의 조명을 조정한다","지역 매니저의 방문 일정을 변경한다"]}
]},
"p7-16": {p:"Brightline Signs & Graphics\n파운드리 레인 18번지, 댈튼, OH 44615 · (330) 555-0192\n\n청구서 #5120\n날짜: 10월 2일\n청구 대상: Harbor View Bistro, 마리나 드라이브 92번지, 댈튼, OH 44615\n담당: Claire Fontaine, 사장\n\n설명 | 수량 | 단가 | 금액\n조명 간판, 2.4m x 0.9m (알루미늄 프레임, LED 조명) | 1 | $1,850.00 | $1,850.00\n창문 레터링, 비닐, 정문 | 2 | $140.00 | $280.00\n교체 가능한 패널이 있는 A형 입간판 | 1 | $215.00 | $215.00\n설치 (조명 간판만 해당) | 1 | $300.00 | $300.00\n\n소계: $2,645.00\n재이용 고객 할인 (5%): -$132.25\n판매세 (6.5%): $163.33\n총 납부액: $2,676.08\n\n조건: 청구서 발행일로부터 30일 이내에 결제해야 합니다. 10일 이내에 전액 결제한 청구서에는 2% 할인이 적용됩니다. 수표 또는 계좌 이체 시 청구서 번호를 기재해 주십시오.\n\n비고: 조명 간판 설치는 10월 9일 오전 8시에서 11시 사이로 예정되어 있습니다. 창문 레터링과 A형 입간판은 같은 방문 시 배달됩니다. LED 부품에는 3년 제조사 보증이 적용됩니다. Brightline을 다시 찾아 주셔서 감사합니다!", qs:[
{q:"Harbor View Bistro에 대해 암시된 것은 무엇인가?", o:["최근 새 장소로 이전했다.","전에 Brightline과 거래한 적이 있다.","주 7일 영업한다.","조명 간판을 두 개 이상 주문했다."]},
{q:"주문에 포함되지 않은 것은 무엇인가?", o:["조명 간판","창문용 레터링","메뉴판","이동식 간판"]},
{q:"Harbor View Bistro는 어떻게 총 납부액을 줄일 수 있는가?", o:["10일 이내에 결제함으로써","계좌 이체로 결제함으로써","간판을 추가로 주문함으로써","물품을 직접 찾아감으로써"]},
{q:"10월 9일에 무슨 일이 있을 것인가?", o:["청구서가 우편으로 발송될 것이다.","보증이 만료될 것이다.","결제 기한이 될 것이다.","간판이 설치될 것이다."]}

"p7-17": {p:"[지문 1 — 이메일]\n수신: registration@northernlogisticssummit.com\n발신: Julian Park <j.park@verano-foods.com>\n날짜: 9월 24일\n제목: 등록 변경\n\n안녕하세요,\n\n저는 Northern Logistics Summit 이틀 전체 일정에 등록되어 있습니다. 등록할 때 창고 자동화 워크숍을 선택했는데, 저희 회사가 지난달부터 유럽으로 제품을 수출하기 시작해서 관련 서류 업무를 이해해야 하므로 대신 통관 서류 워크숍에 참석하고 싶습니다. 이 변경이 가능한지 알려 주시기 바랍니다.\n\n또한 제 동료 Rena Soto가 저와 함께 참석하고 싶어 하는데, 그녀는 둘째 날만 참석할 수 있습니다. 하루 등록이 가능한가요?\n\n마지막으로, 첫날에 제 기차가 오전 9시 40분에 도착하기 때문에 첫 세션에 몇 분 늦을 수도 있습니다.\n\n감사합니다.\nJulian Park\nVerano Foods 물류 코디네이터\n\n[지문 2 — 일정표]\nNorthern Logistics Summit — 프로그램\n할덴 컨벤션 센터, 10월 15–16일\n\n1일차 (10월 15일)\n9:00–9:45 개회 연설: 화물 운송의 미래 — 그랜드 홀\n10:00–12:00 워크숍 (택 1): 창고 자동화 — A실; 통관 서류 — C실; 차량 연료 효율 — D실\n12:00–1:30 점심 — 테라스\n1:30–4:00 패널 토론: 지역 공급망 — 그랜드 홀\n\n2일차 (10월 16일)\n9:00–11:30 전시업체 쇼케이스 — 전시 홀\n11:30–1:00 점심 — 테라스\n1:00–3:30 워크숍 (택 1): 콜드체인 물류 — A실; 운송업체와의 협상 — B실\n\n등록비: 이틀 전체 340달러; 1일차만 200달러; 2일차만 160달러. 워크숍 변경은 10월 1일까지 무료로 요청할 수 있습니다.", qs:[
{q:"Park 씨는 왜 이메일을 보냈는가?", o:["등록을 취소하려고","환불을 요청하려고","등록 내용 변경을 요청하려고","워크숍 발표자로 자원하려고"]},

{q:"Soto 씨는 참석을 위해 얼마를 지불하겠는가?", o:["120달러","200달러","340달러","160달러"]},
{q:"Park 씨에 대해 암시된 것은 무엇인가?", o:["개회 연설의 일부를 놓칠 것이다.","이전에도 이 서밋에 참석한 적이 있다.","2일차에 발표를 할 것이다.","할덴 컨벤션 센터에 묵을 계획이다."]},

"p7-18": {p:"Pembroke Street Market, 열 번째 시즌으로 돌아오다\n\n홀리스터(4월 28일) — Pembroke Street Market이 5월 10일 토요일 시즌 개장을 하며, 몇몇 지역 농부들이 마을 동쪽의 한 주차장에 처음 좌판을 차린 지 10년이 됩니다. [1] 올해 시장에는 신선한 농산물, 제과류, 수공예품, 조리 식품을 판매하는 60여 개 업체가 참여합니다.\n\n시장 관리자 Leah Brandt 씨는 이번 시즌의 가장 큰 변화는 장소라고 말했습니다. [2] \"예전 장소는 더 이상 감당이 안 됐어요.\" Brandt 씨가 설명했습니다. \"새 광장은 두 배의 공간에 지붕이 있는 좌석과 공중화장실까지 갖추고 있습니다.\" 시장은 10월 25일까지 매주 토요일 오전 8시부터 오후 1시까지 운영됩니다.\n\n10주년을 기념하여 개장일에는 라이브 음악, 홀리스터의 세 레스토랑 셰프들이 진행하는 요리 시연, 어린이 원예 체험이 마련됩니다. [3] 또한 업체들은 선착순 200명의 쇼핑객에게 10주년 기념 에코백을 무료로 제공합니다.\n\nBrandt 씨는 시장의 성장을 고객들의 충성심 덕분으로 돌렸습니다. \"첫해 여름에 저희를 찾아 주셨던 많은 분이 지금도 매주 오십니다.\" 그녀가 말했습니다. [4] 전체 업체 목록과 새 장소의 지도는 www.pembrokemarket.org에서 확인하세요.", qs:[
{q:"기사의 목적은 무엇인가?", o:["시즌 시장의 개장을 알리려고","지역 레스토랑 주인을 소개하려고","시의회 결정을 보도하려고","주민들에게 판매자가 되도록 권장하려고"]},
{q:"Pembroke Street Market에 대해 언급된 것은 무엇인가?", o:["입장료를 받는다.","저녁에 운영된다.","식품 판매자만 받는다.","주 1회 운영된다."]},
{q:"개장일에 대해 언급된 것은 무엇인가?", o:["평소보다 일찍 시작할 것이다.","일부 활동은 전문 요리사가 진행할 것이다.","기금 마련을 위해 에코백을 판매할 것이다.","시 공무원이 연설을 할 것이다."]},
{q:"[1], [2], [3], [4]로 표시된 위치 중 다음 문장이 들어가기에 가장 적절한 곳은?\n\"시장은 주차장에서 린든 애비뉴에 새로 단장한 시민 광장으로 옮겨졌다.\"", o:["[1]","[2]","[3]","[4]"]}
]}

"expect": {p:"v.", m:"예상하다, 기대하다", n:"expect to V / expect A to V / be expected to V (~할 것으로 예상되다, 토익 빈출). expectation(n.) 기대 (meet/exceed expectations 기대를 충족/초과하다). expected(adj.) 예상되는. unexpected 예상치 못한, unexpectedly 뜻밖에."},

"expire": {p:"v.", m:"만료되다, 만기가 되다", n:"자동사 (수동태 불가): the contract/coupon expires on + 날짜. expiration(n.) 만료 (expiration date 유효 기간). expired(adj.) 만료된. 영국식 expiry(n.)."},

"feedback": {p:"n.", m:"피드백, 의견, 반응", n:"불가산 (a feedback (X), feedbacks (X)). give/provide/receive feedback on/about ~. customer feedback 고객 의견. positive/negative feedback."},

"due to": {m:"~ 때문에, ~로 인해", n:"전치사 — 뒤에 명사(구). due to a scheduling conflict. because of와 같음. 절(주어+동사)이 오면 because/since. '~할 예정인' due to V는 다른 용법. 형용사 due(기한인): payment is due within 30 days."},
"in spite of": {m:"~에도 불구하고", n:"전치사 — 뒤에 명사(구)/동명사. = despite(despite 뒤에 of 없음 주의). 절이 오면 although/even though/though. 뜻이 반대인 because of/due to와 구분."},
"even though": {m:"비록 ~이지만", n:"접속사 — 뒤에 주어+동사. = although/though. 명사가 오면 despite/in spite of. even if(설령 ~하더라도)는 가정의 뜻으로 구분."},
"as long as": {m:"~하기만 하면, ~하는 한", n:"조건 접속사 — 뒤에 주어+동사(= provided that, on condition that). as soon as(~하자마자), as well as(~뿐만 아니라), as far as(~하는 한도에서)와 혼동 주의."},
"as soon as": {m:"~하자마자", v:["as soon as the doctor is ready","as soon as i hear back"], n:"시간 접속사 — 시간 부사절에서는 미래 대신 현재시제(as soon as the doctor is ready). as long as(~하는 한), as well as(~뿐만 아니라)와 구분. 단일어 once, upon + V-ing와 같은 뜻."},
"as well as": {m:"~뿐만 아니라 …도", n:"A as well as B = B뿐 아니라 A도(A가 강조). 주어가 A as well as B이면 동사는 A에 일치. in addition to + 명사와 같은 뜻. as soon as/as long as와 혼동 주의."},
"rather than": {m:"~보다는, ~ 대신에", n:"비교·선택. A rather than B: B 말고 A. 앞뒤 형태를 맞춤(동사/명사/전치사구). instead of와 거의 같음. other than(~ 이외에), more than(~보다 많은)과 구분."},
"instead of": {m:"~ 대신에", n:"전치사 — 뒤에 명사/동명사(instead of printing them). = in place of, rather than. 부사 instead(대신에)는 단독으로 문장 앞/끝에. in addition to(~에 더하여)와 뜻 반대."},
"in place of": {m:"~ 대신에", n:"= instead of. 전치사구, 뒤에 명사. ten kilos of spinach in place of the missing lettuce. take place(열리다)와 혼동 주의."},
"according to": {m:"~에 따르면, ~에 의하면", n:"전치사 — 뒤에 명사(출처: the speaker, the article, the notice). according to me는 쓰지 않음. 질문 'According to the speaker, …'는 세부사항 문제 패턴."},
"such as": {m:"~와 같은 (예를 들면)", n:"전치사 — 명사 뒤에 예시 명사를 바로 이어 붙임(alterations, such as repainting walls). 문장 앞의 접속부사 For example(, )과 구분. 접속사 자리(절 연결)에는 못 씀."},
"for example": {m:"예를 들어", n:"접속부사 — 문장 앞에 콤마와 함께. 앞 문장의 구체적 사례를 제시할 때. such as는 명사 뒤에 붙는 전치사. Part 6 접속부사 문제에서 앞뒤 논리(예시/대조/추가/결과)로 판단."},
"in addition": {m:"게다가, 또한", v:["in addition,"], n:"접속부사(= moreover, furthermore, also) — 문장 앞 콤마. in addition to + 명사(~에 더하여)는 전치사구. Part 6 빈칸에서 '추가' 논리일 때 정답."},
"in addition to": {m:"~에 더하여, ~ 외에도", n:"전치사 — 뒤에 명사/동명사. = besides, as well as. instead of(대신에)와 뜻 반대. 단독 In addition,(게다가)은 접속부사."},
"as a result": {m:"그 결과", n:"접속부사(= therefore, consequently) — 문장 앞 콤마. as a result of + 명사(~의 결과로)는 전치사구. Now that(이제 ~이므로)처럼 절을 이끄는 접속사가 아니므로 접속사 자리 불가."},
"now that": {m:"이제 ~이므로", n:"접속사 — 뒤에 주어+동사(Now that the contract has been signed, …). 이유+시점. 전치사 Due to/In spite of와 구분(명사만 옴). As a result는 접속부사."},
"in order to": {m:"~하기 위해", n:"in order to + 동사원형(= so as to, to V). 목적. in order that/so that + 주어+동사(절). 조건(as long as), 이유(because of)와 구분. 부정은 in order not to."},
"so that": {m:"~하도록, ~하기 위해", n:"목적 접속사 — so that + 주어 + can/will/may + V. in order to + V(원형)와 같은 뜻. so … that(너무 ~해서 …하다)은 결과. 콤마 없이 쓰이면 목적, 앞에 콤마가 있으면 결과로 해석될 때가 많음."},
"in case": {m:"~할 경우에 대비하여", n:"접속사 — in case + 주어+동사(in case you need to return the item). 명사가 오면 in case of. if(만약 ~라면)와는 달리 '대비'의 뜻. in that case(그런 경우에는)와 구분."},
"in case of": {m:"~의 경우에는, ~에 대비하여", n:"전치사 — 뒤에 명사(in case of fire/emergency). 절이 오면 in case + 주어+동사. '만약 ~라면' 조건 접속사 if와 구분: 'void if the appliance is serviced…' 자리에 in case of 불가."},
"in that case": {m:"그런 경우에는, 그렇다면", n:"대화 응답 표현. 상대가 말한 상황을 전제로 결정을 바꿀 때. in case(~에 대비해)와 뜻이 다름."},
"on behalf of": {m:"~을 대신하여, ~을 대표하여", n:"전치사 — on behalf of + 사람/단체. = on one's behalf. instead of(대신에)는 '교체'의 뜻이고 on behalf of는 '대리'."},
"on the basis of": {m:"~을 근거로, ~에 기초하여", n:"전치사 — on the basis of cost, feasibility… = based on. basis(근거)는 명사, base(기반/기초를 두다)는 명사·동사."},
"with the exception of": {m:"~을 제외하고", v:["the exception of"], n:"= except for. With the exception of the lobby, all areas…. exception(예외) 명사, exceptional(뛰어난) 형용사. without exception(예외 없이)과 구분."},
"except for": {m:"~을 제외하고", v:["except in","except wednesday"], n:"전치사. 문장 앞에서는 except for(또는 with the exception of)를 씀. except + 전치사구/절도 가능(except in the design studio). 뒤에 명사만 올 때는 except과 except for 모두 가능."},
"compared to": {m:"~와 비교하여", n:"분사구문 (when) compared to/with. compared to last year. 뒤에 비교 대상 명사. 'Compared ___ the current timetable' → to. comparable(비슷한), comparison(비교) 파생어 구분."},
"in short": {m:"요컨대, 간단히 말해", n:"접속부사 — 앞 내용을 요약. 대조(However), 유사(Similarly/Likewise)와 구분해야 하는 Part 6 보기."},

"until further notice": {m:"추후 공지가 있을 때까지", v:["further notice"], n:"postponed until further notice. until + 명사(계속의 종료 시점). by(완료 기한: submit by Friday)와 구분. notice는 '공지'(가산)·'알아차림'."},

"during this period": {m:"이 기간 동안", n:"during + 명사(기간/행사: during the week, during the holiday season). while + 주어+동사. for + 숫자 기간(for three weeks). 'During this time, residents may…' 자리에 While 불가."},

"by the end of": {m:"~ 말까지", v:["by the end of the day","by the end of the month","by the end of the year","by the end of next year"], n:"by = 완료 기한(그 전 아무 때나 끝내면 됨). until the end of the week(그때까지 계속)와 구분. at the end of(~의 끝에, 시점)."},

"by then": {m:"그때까지는", n:"by + 시점(완료 기한). we need the chairs by then. until then(그때까지 계속)과 구분."},

"the other": {m:"(둘 중) 나머지 하나", v:["the other two"], n:"one … the other …(둘 중 나머지). another(또 다른 하나, 불특정), others(다른 것들), the others(나머지 전부). 'more practical than ___' 두 제안 중 다른 하나 → the other."},

"a third of": {m:"3분의 1", n:"nearly a third of our delivery expenses. 분수 + of + 명사: 동사는 of 뒤 명사에 일치. two-thirds(3분의 2)는 복수형."},

"although": {p:"conj.", m:"비록 ~이지만", n:"접속사: 뒤에 주어+동사. 명사 앞에는 despite / in spite of. even though, though도 같은 뜻."},
"though": {p:"conj./adv.", m:"비록 ~이지만; 그렇지만", n:"접속사로는 although와 같음. 문장 끝에 오면 부사 '그렇지만'(~, though.)"},
"during": {p:"prep.", m:"~ 동안", n:"전치사: during + 명사(during the meeting). 절이 오면 while. 숫자 기간(three hours)에는 for."},
"while": {p:"conj.", m:"~하는 동안; ~인 반면", n:"접속사: while + 주어+동사. 명사 앞에는 during. '반면에(대조)' 뜻도 빈출."},
"until": {p:"prep./conj.", m:"~까지 (계속)", n:"상태·동작이 '계속'될 때 until. 한 번 '완료'되는 기한은 by (submit by Friday / be away until Friday)."},
"since": {p:"prep./conj.", m:"~ 이후로; ~ 때문에", n:"since + 과거 시점 → 주절은 현재완료(has worked since 2015). for + 기간. '~때문에' 접속사 용법도 있음."},
"unless": {p:"conj.", m:"~하지 않는 한", n:"= if ~ not. 조건 부사절이므로 현재시제가 미래 대신(unless it rains)."},
"whether": {p:"conj.", m:"~인지 아닌지", n:"whether A or B / whether or not. if와 달리 전치사 뒤·주어 자리에도 쓸 수 있음. weather(날씨)와 철자 구분."},
"whereas": {p:"conj.", m:"~인 반면에", n:"대조 접속사. 뒤에 주어+동사. while(~반면)과 비슷."},
"otherwise": {p:"adv.", m:"그렇지 않으면", n:"접속부사: 두 절을 연결하지 못하므로 세미콜론(;)이나 마침표 뒤에 옴. Part 5에서 두 절 사이 빈칸이면 오답."},
"therefore": {p:"adv.", m:"그러므로", n:"접속부사(두 절을 직접 연결 불가). 결과를 이끎. Part 6 빈칸은 앞뒤 인과 관계로 판단."},
"however": {p:"adv.", m:"그러나", n:"접속부사: However, S + V. 절을 연결하는 접속사가 아님(but은 접속사)."},
"moreover": {p:"adv.", m:"게다가", n:"= in addition, furthermore. 앞 내용에 정보를 추가."},
"instead": {p:"adv.", m:"대신에", n:"instead of + 명사/V-ing (전치사구). 단독 instead는 부사로 문장 끝·앞."},
"by": {p:"prep.", m:"~까지(완료 기한); ~에 의해; ~옆에", n:"by Friday = 금요일까지 '완료'. until은 '계속'. 수동태의 행위자(by + 사람)도 빈출."},
"within": {p:"prep.", m:"~ 이내에", n:"within 30 days(30일 이내). in two weeks는 '2주 후에'."},
"despite": {p:"prep.", m:"~에도 불구하고", n:"전치사: despite + 명사/V-ing. despite of (X). 절 앞에는 although/even though. = in spite of."}
});
</script>
<script>
// ===================== 유틸 =====================
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L = ['A','B','C','D'];
const todayKey = (d = new Date()) => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pct = (c,n) => n ? Math.round(c/n*100) : null;
const fmtMin = s => s < 60 ? Math.round(s)+'초' : Math.floor(s/60)+'분 '+Math.round(s%60)+'초';
let toastTimer; function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2600); }

// ===================== 난이도 = 수험생 추정 오답률 =====================
// 유형별 평균 오답률(%) 기준값. 문항에 err가 없으면 기준값 ± 문항 난이도로 산출.
const ERR_BASE = {p2_wh:25,p2_yn:35,p2_choice:30,p2_neg:45,p2_stmt:55,p3_topic:25,p3_detail:40,p3_intent:55,p3_next:35,p4_topic:25,p4_detail:40,p4_next:35,
  p5_pos_n:25,p5_pos_adj:25,p5_pos_adv:20,p5_tense:40,p5_voice:35,p5_prep:45,p5_conj:40,p5_rel:40,p5_pron:35,p5_vocab_v:50,p5_vocab_n:50,p5_vocab_adj:55,p5_inf:35,p5_comp:35,
  p6_vocab:50,p6_connector:45,p6_insert:60,p6_gram:40,p7_main:25,p7_detail:35,p7_infer:55,p7_syn:45,p7_not:50,p7_insert:60,p7_intent:50};
const errToDiff = e => e<28?1:e<38?2:e<48?3:e<58?4:5;
const DIFF_LABEL = {1:'쉬움',2:'쉬움',3:'보통',4:'어려움',5:'어려움'};
BANK.forEach(g=>g.qs.forEach(q=>{ if(q.err==null) q.err=Math.max(10,Math.min(85,ERR_BASE[q.type]+((q.diff||3)-3)*7)); q.diff=errToDiff(q.err); }));
const groupErr = g => Math.round(g.qs.reduce((a,q)=>a+q.err,0)/g.qs.length);

// ===================== 인덱스 =====================
const QINDEX = {}, GINDEX = {};
BANK.forEach(g => { GINDEX[g.id]=g; g.sec = PART_INFO[g.part].sec; g.qs.forEach((q,i)=>{ q.id=g.id+'-'+i; q.gid=g.id; q.part=g.part; q.sec=TYPES[q.type].sec; q.idx=i; QINDEX[q.id]=q; }); });
const ALLQ = Object.values(QINDEX);

// ===================== 상태 & 저장 =====================
const LS_KEY = 'toeic-trainer-v1';
const DEFAULT = { goal:800, responses:[], bookmarks:[], vocab:{}, scoreHistory:[], diagDone:false, lessonsRead:{}, updatedAt:0 };
let S = JSON.parse(JSON.stringify(DEFAULT));
function loadLocal(){ try{ const j=localStorage.getItem(LS_KEY); if(j){ const d=JSON.parse(j); if(d && typeof d==='object') Object.assign(S, d); } }catch(e){} }
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }
let db=null, SAMPLE=null, saveTimer=null;
async function initCaps(){
  try{ db = await window.claude?.use?.('db'); }catch(e){ db=null; }
  if(db){ try{ const snap = await db.doc('progress/main').get(); if(snap.exists){ const d=snap.data(); if((d.updatedAt||0) > (S.updatedAt||0)){ Object.assign(S, d); saveLocal(); renderAll(); } } }catch(e){} }
  try{ SAMPLE = await window.claude?.use?.('sample'); }catch(e){ SAMPLE=null; }
}
function persist(){ S.updatedAt=Date.now(); saveLocal(); if(!db) return; clearTimeout(saveTimer); saveTimer=setTimeout(async()=>{ try{ await db.doc('progress/main').set(JSON.parse(JSON.stringify(S))); }catch(e){} }, 1200); }

// ===================== 점수 추정 (1-모수 로지스틱) =====================
const DIFF_B = {1:-1.5, 2:-0.75, 3:0, 4:0.75, 5:1.5};
function estimateTheta(sec, responses = S.responses){
  const rs = responses.filter(r => QINDEX[r.qid] && QINDEX[r.qid].sec===sec).slice(-80);
  if(!rs.length) return null;
  let best=0, bestL=-Infinity;
  for(let t=-3; t<=3.0001; t+=0.05){
    let ll = -0.1*t*t;
    for(const r of rs){ const b=DIFF_B[QINDEX[r.qid].diff]; const p=1/(1+Math.exp(-1.3*(t-b))); ll += r.correct ? Math.log(p) : Math.log(1-p); }
    if(ll>bestL){ bestL=ll; best=t; }
  }
  return best;
}
const thetaToScore = t => t===null ? null : Math.max(5, Math.min(495, Math.round((100 + (t+2.5)/5*395)/5)*5));
function scores(responses = S.responses){
  const tl=estimateTheta('LC',responses), tr=estimateTheta('RC',responses);
  const lc=thetaToScore(tl), rc=thetaToScore(tr);
  return { lc, rc, total:(lc!==null&&rc!==null)?lc+rc:null, tl, tr };
}
function typeStats(){ const st={}; for(const r of S.responses){ const q=QINDEX[r.qid]; if(!q) continue; (st[q.type]=st[q.type]||{n:0,c:0,t:0}); st[q.type].n++; st[q.type].t+=r.t||0; if(r.correct) st[q.type].c++; } return st; }
function partStats(){ const st={}; for(const r of S.responses){ const q=QINDEX[r.qid]; if(!q) continue; (st[q.part]=st[q.part]||{n:0,c:0}); st[q.part].n++; if(r.correct) st[q.part].c++; } return st; }
function pWrong(q, sc, ts){
  const th = (q.sec==='LC' ? sc.tl : sc.tr) ?? 0;
  let b = DIFF_B[q.diff]; const s=ts[q.type];
  if(s && s.n>=2) b += (0.5 - s.c/s.n)*1.4;
  const p = 1/(1+Math.exp(-1.3*(th-b)));
  return Math.min(.95, Math.max(.05, 1-p));
}
function weakTypes(limit=3){
  const ts=typeStats();
  return Object.entries(ts).filter(([,s])=>s.n>=2).map(([type,s])=>({type,acc:s.c/s.n,n:s.n})).filter(w=>w.acc<0.8).sort((a,b)=>a.acc-b.acc || b.n-a.n).slice(0,limit);
}
function latestOutcome(){ const m={}; for(const r of S.responses) m[r.qid]=r; return m; }
function lastSeen(){ const m={}; for(const r of S.responses){ const q=QINDEX[r.qid]; if(q) m[q.gid]=Math.max(m[q.gid]||0, r.ts); } return m; }

// ===================== 추천 학습 =====================
function groupPriority(g, sc, ts, weak, seen){
  const now=Date.now();
  let s=0;
  for(const q of g.qs){ const pw=pWrong(q,sc,ts); s += pw*(1-pw)*4 + (weak.has(q.type)?0.6:0); }
  s/=g.qs.length;
  if(!seen[g.id]) s+=0.35; else if(now-seen[g.id] < 2*864e5) s-=1.2;
  return s + Math.random()*0.15;
}
function recommendGroups(targetLC=4, targetRC=6){
  const sc=scores(), ts=typeStats(), weak=new Set(weakTypes().map(w=>w.type)), seen=lastSeen();
  const ranked = BANK.map(g=>({g,p:groupPriority(g,sc,ts,weak,seen)})).sort((a,b)=>b.p-a.p);
  const pick=[]; let lc=0, rc=0;
  for(const {g} of ranked){ if(g.sec==='LC' && lc<targetLC){ pick.push(g.id); lc+=g.qs.length; } else if(g.sec==='RC' && rc<targetRC){ pick.push(g.id); rc+=g.qs.length; } }
  return pick.sort((a,b)=>GINDEX[a].part-GINDEX[b].part);
}
let STUDY_DIFF='all';
const groupMaxErr = g => Math.max(...g.qs.map(q=>q.err));
const diffMatch = (g,d) => d==='all' || (d==='easy' && groupMaxErr(g)<38) || (d==='hard' && groupMaxErr(g)>=48) || (d==='mid' && groupMaxErr(g)>=38 && groupMaxErr(g)<48);
function groupsForPart(part, nq, d=STUDY_DIFF){
  const sc=scores(), ts=typeStats(), weak=new Set(weakTypes().map(w=>w.type)), seen=lastSeen();
  let pool = BANK.filter(g=>g.part===part && diffMatch(g,d)); if(!pool.length) pool = BANK.filter(g=>g.part===part);
  const ranked = pool.map(g=>({g,p:groupPriority(g,sc,ts,weak,seen)})).sort((a,b)=>b.p-a.p);
  const pick=[]; let n=0; for(const {g} of ranked){ if(n>=nq) break; pick.push(g.id); n+=g.qs.length; } return pick;
}
function groupsForType(type, max=8){
  const seen=lastSeen();
  return BANK.filter(g=>g.qs.some(q=>q.type===type)).sort((a,b)=>(seen[a.id]||0)-(seen[b.id]||0)).slice(0,max).map(g=>g.id);
}

// ===================== 학습 기록 통계 =====================
function dayKeys(){ const s=new Set(); for(const r of S.responses) s.add(todayKey(new Date(r.ts))); return s; }
function streak(){ const days=dayKeys(); let n=0; const d=new Date(); if(!days.has(todayKey(d))) d.setDate(d.getDate()-1); while(days.has(todayKey(d))){ n++; d.setDate(d.getDate()-1); } return n; }
function todayCount(){ const k=todayKey(); return S.responses.filter(r=>todayKey(new Date(r.ts))===k).length; }
function totalTime(){ return S.responses.reduce((a,r)=>a+(r.t||0),0); }
function recordScore(){ const sc=scores(); if(sc.total===null) return; const k=todayKey(); const i=S.scoreHistory.findIndex(h=>h.day===k); const e={day:k,ts:Date.now(),lc:sc.lc,rc:sc.rc,total:sc.total}; if(i>=0) S.scoreHistory[i]=e; else S.scoreHistory.push(e); }

// ===================== 단어·표현 사전 매칭 =====================
const PHRASE_FORMS = (()=>{ const arr=[]; for(const [k,v] of Object.entries(PHRASES)){ arr.push({f:k.toLowerCase(),k}); (v.v||[]).forEach(x=>arr.push({f:x.toLowerCase(),k})); } arr.sort((a,b)=>b.f.length-a.f.length); return arr.map(o=>({...o, re:new RegExp('(^|[^a-z])('+o.f.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')(?![a-z])','g')})); })();
function lemmas(w){ const out=[w]; const b=w.replace(/'s$/,''); if(b!==w) out.push(b);
  if(/ies$/.test(b)) out.push(b.slice(0,-3)+'y'); if(/(s|x|z|ch|sh)es$/.test(b)) out.push(b.slice(0,-2)); if(/s$/.test(b)) out.push(b.slice(0,-1));
  if(/ied$/.test(b)) out.push(b.slice(0,-3)+'y'); if(/ed$/.test(b)){ out.push(b.slice(0,-2), b.slice(0,-1)); if(/([^aeiou])\1ed$/.test(b)) out.push(b.slice(0,-3)); }
  if(/ing$/.test(b)){ out.push(b.slice(0,-3), b.slice(0,-3)+'e'); if(/([^aeiou])\1ing$/.test(b)) out.push(b.slice(0,-4)); }
  if(/er$/.test(b)) out.push(b.slice(0,-2), b.slice(0,-1)); if(/est$/.test(b)) out.push(b.slice(0,-3), b.slice(0,-2));
  if(/ly$/.test(b)) out.push(b); return out; }
function lookupWord(w){ const l=w.toLowerCase(); for(const c of lemmas(l)) if(DICT[c]) return {key:c, ...DICT[c]}; return null; }
// 텍스트 → 단어(.w)·표현(.ph) 클릭 가능한 HTML. on=false면 단순 이스케이프.
function richText(text, on){
  if(!on) return esc(text);
  const low=text.toLowerCase(); const taken=new Array(text.length).fill(false); const chunks=[];
  for(const pf of PHRASE_FORMS){ pf.re.lastIndex=0; let m; while((m=pf.re.exec(low))){ const s=m.index+m[1].length, e=s+m[2].length; let free=true; for(let i=s;i<e;i++) if(taken[i]){free=false;break;} if(free){ for(let i=s;i<e;i++) taken[i]=true; chunks.push({s,e,k:pf.k}); } pf.re.lastIndex=e; } }
  chunks.sort((a,b)=>a.s-b.s);
  let out='', pos=0;
  const words = seg => esc(seg).replace(/[A-Za-z][A-Za-z'\-]*[A-Za-z]|[A-Za-z]/g, w => { const d=lookupWord(w.replace(/&#39;/g,"'")); return d? `<span class="w" data-w="${esc(d.key)}">${w}</span>` : w; });
  for(const c of chunks){ out+=words(text.slice(pos,c.s)); out+=`<span class="ph" data-p="${esc(c.k)}">${esc(text.slice(c.s,c.e))}</span>`; pos=c.e; }
  out+=words(text.slice(pos)); return out;
}
function passageHTML(text, on){ return richText(text,on).replace(/___\((\d)\)___/g,'<span class="blank">___($1)___</span>').replace(/\[(\d)\]/g,'<span class="pos">[$1]</span>'); }
function showPop(target){
  const pop=$('#pop'); let d, head, kind;
  if(target.dataset.w){ d=DICT[target.dataset.w]; head=target.dataset.w; kind=d&&d.p?d.p:''; }
  else { d=PHRASES[target.dataset.p]; head=target.dataset.p; kind='표현'; }
  if(!d) return;
  pop.innerHTML=`<div class="ph-head"><span class="num" style="font-size:17px;font-weight:700">${esc(head)}</span>${kind?`<span class="chip" style="font-size:11px">${esc(kind)}</span>`:''}</div><div class="ph-m">${esc(d.m)}</div>${d.n?`<div class="ph-n"><b>유의</b> ${esc(d.n)}</div>`:''}`;
  pop.hidden=false;
  const r=target.getBoundingClientRect(); const pw=Math.min(340, window.innerWidth-24); pop.style.width=pw+'px';
  let left=Math.max(12, Math.min(window.innerWidth-pw-12, r.left+r.width/2-pw/2));
  pop.style.left=left+'px';
  const ph=pop.offsetHeight; let top = r.top-ph-10; let arrowUp=false;
  if(top<8){ top=r.bottom+10; arrowUp=true; }
  pop.style.top=top+'px'; pop.classList.toggle('below',arrowUp);
  pop.style.setProperty('--ax', (r.left+r.width/2-left)+'px');
  document.querySelectorAll('.w.on,.ph.on').forEach(e=>e.classList.remove('on')); target.classList.add('on');
}
function hidePop(){ const pop=$('#pop'); if(pop && !pop.hidden){ pop.hidden=true; document.querySelectorAll('.w.on,.ph.on').forEach(e=>e.classList.remove('on')); } }
document.addEventListener('click', e=>{ const t=e.target.closest('.w,.ph'); if(t){ e.stopPropagation(); if(t.classList.contains('on')) hidePop(); else showPop(t); return; } if(!e.target.closest('#pop')) hidePop(); }, true);
document.addEventListener('scroll', hidePop, true);
document.addEventListener('keydown', e=>{ if(e.key==='Escape') hidePop(); });

// ===================== 음성 (LC) =====================
const TTS = ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window);
let voices=[];
function loadVoices(){ if(!TTS) return; voices = speechSynthesis.getVoices().filter(v=>/^en[-_]?/i.test(v.lang)); }
if(TTS){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(g){
  const fem=/female|samantha|zira|victoria|karen|moira|tessa|fiona|allison|ava|susan|aria|jenny|emma|michelle|sara|google us english/i, mal=/\bmale|daniel|alex|david|fred|tom|mark|guy|ryan|christopher|eric|google uk english male/i;
  const us=voices.filter(v=>/en[-_]US/i.test(v.lang)); const pool = us.length?us:voices;
  if(g==='W'){ return pool.find(v=>fem.test(v.name)) || voices.find(v=>fem.test(v.name)) || pool[0]; }
  return pool.find(v=>mal.test(v.name)&&!/female/i.test(v.name)) || voices.find(v=>mal.test(v.name)&&!/female/i.test(v.name)) || pool[1] || pool[0];
}
let playBtnEl=null;
const LC_AUDIO = true; let AUD=null;
function playGroupAudio(g){
  stopSpeech();
  const a=new Audio('audio/'+g.id+'.mp3'); AUD=a; const setPlaying=on=>{ if(playBtnEl) playBtnEl.classList.toggle('playing',on); };
  a.onplay=()=>setPlaying(true); a.onended=()=>{ setPlaying(false); timerStart(); }; a.onpause=()=>setPlaying(false);
  a.onerror=()=>{ AUD=null; if(TTS) speakSeq(audioItems(g)); else { toast('음원을 불러오지 못했어요. 스크립트를 보고 푸세요.'); SES.showScript[g.id]=true; renderQuiz(); } };
  a.play().catch(()=>{ a.onerror(); });
}
function speakSeq(items){
  if(!TTS) return;
  speechSynthesis.cancel();
  const vw=pickVoice('W'), vm=pickVoice('M');
  const sameVoice = vw && vm && vw.name===vm.name;
  let i=0;
  const setPlaying=on=>{ if(playBtnEl) playBtnEl.classList.toggle('playing',on); };
  const next=()=>{
    if(i>=items.length){ setPlaying(false); timerStart(); return; }
    const it=items[i++]; const u=new SpeechSynthesisUtterance(it.text);
    u.lang='en-US'; u.rate=0.92; const v = it.g==='W'?vw:vm; if(v) u.voice=v;
    if(sameVoice || !v) u.pitch = it.g==='W'?1.15:0.85;
    u.onend=()=>setTimeout(next, it.pause||350); u.onerror=()=>{ setPlaying(false); timerStart(); };
    speechSynthesis.speak(u);
  };
  setPlaying(true); next();
}
function stopSpeech(){ if(TTS) speechSynthesis.cancel(); if(AUD){ AUD.onended=null; AUD.onpause=null; AUD.pause(); AUD=null; } }
function audioItems(g){
  if(g.part===2){ const q=g.qs[0]; return [{text:g.script,g:'M',pause:900}, ...q.opts.map((o,i)=>({text:L[i]+'. '+o, g:'W', pause:700}))]; }
  return g.script.map(([sp,text])=>({text,g:sp,pause:400}));
}
function scriptText(g){ if(g.part===2){ const q=g.qs[0]; return 'Q: '+g.script+'\n'+q.opts.map((o,i)=>'('+L[i]+') '+o).join('\n'); } return g.script.map(([sp,t])=>(sp==='W'?'W: ':'M: ')+t).join('\n\n'); }

// ===================== 탭 & 전체 렌더 =====================
let VIEW='home';
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>showView(b.dataset.view)));

// ===================== 분석 =====================
function scoreChart(){
  const H=S.scoreHistory.slice(-20); if(H.length<1) return '';
  const W=600,Hh=200,pl=36,pr=12,pt=14,pb=26; const vals=H.map(h=>h.total).concat([S.goal]);
  let lo=Math.max(10,Math.min(...vals)-60), hi=Math.min(990,Math.max(...vals)+60); if(hi-lo<100){hi=Math.min(990,lo+100);}
  const x=i=>H.length===1?(W-pl-pr)/2+pl:pl+i*(W-pl-pr)/(H.length-1), y=v=>pt+(hi-v)/(hi-lo)*(Hh-pt-pb);
  const ticks=[]; const step=(hi-lo)>300?100:50; for(let v=Math.ceil(lo/step)*step; v<=hi; v+=step) ticks.push(v);
  const path=H.map((h,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(h.total).toFixed(1)).join(' ');
  const area=H.length>1?path+` L${x(H.length-1).toFixed(1)} ${y(lo).toFixed(1)} L${x(0).toFixed(1)} ${y(lo).toFixed(1)} Z`:'';
  return `<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="예상 점수 추이">
    ${ticks.map(v=>`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text x="${pl-6}" y="${(y(v)+4).toFixed(1)}" text-anchor="end">${v}</text>`).join('')}
    ${S.goal>=lo&&S.goal<=hi?`<line class="goal" x1="${pl}" x2="${W-pr}" y1="${y(S.goal).toFixed(1)}" y2="${y(S.goal).toFixed(1)}"/><text x="${W-pr}" y="${(y(S.goal)-4).toFixed(1)}" text-anchor="end" style="fill:var(--good)">목표 ${S.goal}</text>`:''}
    ${area?`<path class="area" d="${area}"/>`:''}<path class="ln" d="${path}"/>
    ${H.map((h,i)=>`<circle class="dot" cx="${x(i).toFixed(1)}" cy="${y(h.total).toFixed(1)}" r="${i===H.length-1?5:3}"/>`).join('')}
    ${H.map((h,i)=>(H.length<=8||i===0||i===H.length-1||i%Math.ceil(H.length/6)===0)?`<text x="${x(i).toFixed(1)}" y="${Hh-8}" text-anchor="middle">${h.day.slice(5)}</text>`:'').join('')}
    <text x="${x(H.length-1).toFixed(1)}" y="${(y(H[H.length-1].total)-10).toFixed(1)}" text-anchor="middle" style="fill:var(--accent);font-weight:700;font-size:15px">${H[H.length-1].total}</text>
  </svg>`;
}

  </div>
  <div class="card"><div class="bold" style="margin-bottom:4px">난이도별 정답률 <span class="muted small">(수험생 오답률 기준)</span></div>

const TIME_LIMIT = {2:5,3:8,4:8,5:20,6:30,7:60}; // 초/문항 (LC는 음원 종료 후)
const fmtClock = s => { s=Math.max(0,Math.floor(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
let TIMER=null, timerIv=null;
function timerSetup(g){ clearInterval(timerIv); TIMER={part:g.part,n:g.qs.length,limit:TIME_LIMIT[g.part]*g.qs.length,start:null,stopped:null,waiting:g.sec==='LC'&&(LC_AUDIO||TTS),overToasted:false}; if(!TIMER.waiting) TIMER.start=Date.now(); timerIv=setInterval(timerTick,200); }
function timerStart(){ if(TIMER&&TIMER.waiting){ TIMER.waiting=false; TIMER.start=Date.now(); if(SES) SES.qStart=Date.now(); timerTick(); } }
function timerStop(){ if(TIMER&&TIMER.start&&!TIMER.stopped){ TIMER.stopped=Date.now(); timerTick(); } }
function timerClear(){ clearInterval(timerIv); timerIv=null; TIMER=null; }
function timerTick(){
  const el=$('#tgauge'); if(!el||!TIMER) return; const i=el.querySelector('i'), t=$('#ttime'), lbl=$('#tlabel');
  if(TIMER.waiting){ i.style.width='0%'; t.textContent='0:00 / '+fmtClock(TIMER.limit); lbl.textContent='음원이 끝나면 시작 · 문항당 '+TIME_LIMIT[TIMER.part]+'초'; el.classList.remove('over'); return; }
  const e=((TIMER.stopped||Date.now())-TIMER.start)/1000; const over=e>TIMER.limit;
  i.style.width=Math.min(100,e/TIMER.limit*100)+'%'; t.textContent=fmtClock(e)+' / '+fmtClock(TIMER.limit); el.classList.toggle('over',over);
  lbl.textContent = TIMER.stopped ? (over?`권장 시간 초과 +${Math.round(e-TIMER.limit)}초`:'시간 내 완료') : (over?'권장 시간 초과':`Part ${TIMER.part} 권장 ${TIME_LIMIT[TIMER.part]}초/문항${TIMER.n>1?' × '+TIMER.n:''}`);
  if(over&&!TIMER.stopped&&!TIMER.overToasted){ TIMER.overToasted=true; toast('권장 시간을 넘겼어요. 실전에서는 표시하고 넘어가세요.'); }
}
